spring.application.name=otgyeol

# 앱은 컨테이너 안에서 0.0.0.0:3000으로 받는다(주최 측 실행 규칙).
server.port=${PORT:3000}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# MariaDB. 기본값은 우분투 서버의 MariaDB 기본 포트(3306). 다른 포트·호스트는 DATABASE_URL로 바꾼다(docker는 compose가 넣는다).
spring.datasource.url=${DATABASE_URL:jdbc:mariadb://127.0.0.1:3306/otgyeol}
spring.datasource.username=${DATABASE_USERNAME:otgyeol}
spring.datasource.password=${DATABASE_PASSWORD:otgyeol}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 사진 업로드: 한 장 10MB, 한 번에 최대 4장
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=45MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d

# /__health가 응답하는 배포 commit
app.release-id=${RELEASE_ID:dev}

# docker 시드 계정(로컬 전용). 비어 있으면 시드를 만들지 않는다.
app.seed.email=${SEED_USER_EMAIL:}
app.seed.password=${SEED_USER_PASSWORD:}

# AI Gateway 키. 서버에서만 읽는다. 모델은 Gateway 모델 목록(https://ai-gateway.vercel.sh/v1/models)에서 확인한 값.
app.ai.gateway-key=${AI_GATEWAY_API_KEY:}
app.ai.model=${AI_MODEL:google/gemini-2.5-flash}
app.ai.base-url=https://ai-gateway.vercel.sh/v1
