# 옷결 사용자 핵심 흐름. 주최 측 실행이 흐름마다 e2e/scenarios/<id>.spec.ts를 실행한다.
# 선행 데이터는 앱이 처음 뜰 때 시드로 만든다(사용자 시드 계정의 의류 11벌, 수납 공간 8곳(박스·본가 포함), 세탁·수선 기록 2건).
# 각 흐름은 시드 데이터만으로 성립하고 서로 다른 시드 의류를 사용한다.
platform: both
platformReason: |
  옷을 옮기는 순간은 박스 앞이나 세탁소 카운터라, 박스 라벨 QR·영수증을 찍고 옷을 체크하는 옮기기는 휴대폰 카메라로 한다.
  택 촬영과 등록도 새 옷을 산 직후나 옷장 앞에서 스마트폰 카메라로 하고, 외출 직전 옷 위치 찾기와 세탁소 회수 확인도
  집 안이나 이동 중에 휴대폰으로 한다. 반면 계절 옷 교체 때 옷장 지도를 보며 여러 벌의 배치를 정하거나 박스에 넣을
  옷을 한꺼번에 고르는 일은 넓은 화면의 PC에서 하는 장면이 있어, 두 화면 모두에서 같은 흐름이 동작해야 한다.
scenarios:
  - id: S1
    title: 처음 온 사람이 서비스 소개를 보고 회원가입해 빈 옷장을 연다
    steps:
      - 첫 화면에서 서비스 소개를 확인하고 '시작하기'를 누른다
      - 회원가입 화면에서 이메일과 비밀번호를 입력한다
      - "'가입하기'를 누른다"
    expected: 가입한 이메일로 로그인된 상태가 되고, 내 옷장에 등록된 옷이 0벌이라는 안내와 '옷 등록' 버튼이 보인다
  - id: S2
    title: 사용자가 택 사진 2장으로 새 옷을 AI 분석해 등록한다
    account: 사용자
    steps:
      - 메뉴에서 '옷 등록'을 누른다
      - "'택 사진 추가'로 세탁 택 사진과 브랜드 택 사진 2장을 올린다"
      - "'택 분석하기'를 누른다"
      - 분석 결과의 '옷 이름'에 '등록 테스트 셔츠'를 입력한다
      - "'제품 찾기'를 누른다"
      - "'저장하기'를 누른다"
    expected: 옷 상세 화면에 '등록 테스트 셔츠'와 택 사진 2장, AI가 읽은 브랜드·소재 값이 보이고, 제품 후보 카드 또는 '검색 결과 없음' 안내가 기록되어 있다
  - id: S3
    title: 사용자가 옷의 계절 분류를 고치고 계절별 보기로 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '화이트 반소매 티셔츠'를 연다
      - "'정보 수정'을 누른다"
      - 계절에서 '봄'을 추가로 선택한다
      - "'저장'을 누른다"
      - 메뉴에서 '내 옷장'을 누른다
      - 보기 기준에서 '계절'을 고른다
      - 화면을 새로고침한다
    expected: 계절별 보기의 '봄' 묶음과 '여름' 묶음 모두에 '화이트 반소매 티셔츠'가 보이고, 새로고침 후에도 그대로 유지된다
  - id: S4
    title: 사용자가 박스 라벨 QR과 '처음 보는 옷'으로 여름 옷을 '여름 박스'에 묶음 보관한 뒤 한 벌을 다시 집 안 옷장으로 꺼낸다
    account: 사용자
    steps:
      - 메뉴에서 '옮기기'를 누른다
      - "'박스·집 밖'을 누른다"
      - "'박스 라벨 찍기'로 '여름 박스'에 붙여 둔 QR 라벨 사진을 올리고, 보낼 곳이 '여름 박스'로 골라진 것을 확인한다"
      - "'처음 보는 옷'을 눌러 옷 이름에 '스트라이프 마 셔츠'를 입력하고 옷 종류에서 '셔츠'를 고른 뒤 '등록하고 넣기'를 누른다"
      - 옮길 옷에서 '린넨 반소매 셔츠'와 '네이비 반바지'를 추가로 고른다
      - "'여름 박스로 보냄 (3벌)'을 누른다"
      - 메뉴에서 '내 옷장'을 누른다
      - 보기 기준에서 '집 밖/박스'를 고른다
      - "'박스 속' 묶음에서 '네이비 반바지'를 눌러 옷 상세를 연다"
      - "'위치 변경'을 누르고 집 안 공간에서 '옷장 A → 왼쪽 행거'를 고른 뒤 '여기로 옮김'을 누른다"
    expected: "박스 라벨 QR로 보낼 곳이 '여름 박스'로 자동 선택되고, '처음 보는 옷'으로 추가한 '스트라이프 마 셔츠'가 체크된 채 목록 맨 위에 나타난다. 보낸 뒤 '집 밖/박스' 보기의 '박스 속' 묶음에 '스트라이프 마 셔츠'·'린넨 반소매 셔츠'·'네이비 반바지'가 '박스 속 · 여름 박스'로 표시되며, 이어서 '네이비 반바지'의 위치를 변경하면 해당 옷의 위치가 '박스 속 · 여름 박스'에서 '옷장 A → 왼쪽 행거'로 바뀐다"
  - id: S5
    title: 사용자가 셔츠와 후드티를 영수증 사진과 함께 세탁소 묶음으로 맡기고 관리함에서 회수 예정일을 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '옮기기'를 누른다
      - "'세탁소'를 누른다"
      - 세탁소에 '동네 세탁소'를 입력한다
      - 회수 예정일에서 '3일 뒤'를 누른다
      - "'영수증 찍기'로 세탁소 영수증 사진 1장을 올린다"
      - 옮길 옷에서 '체크 플란넬 셔츠'와 '그레이 후드티'를 고른다
      - "'동네 세탁소에 맡김 (2벌)'을 누른다"
      - 메뉴에서 '관리함'을 누른다
      - "'진행 중' 탭을 누른다"
    expected: 맡긴 직후 옮기기 화면의 최근 옮긴 기록에 '사진 1장'이 함께 보이고, 관리함의 '진행 중' 목록에 '체크 플란넬 셔츠'와 '그레이 후드티'가 '동네 세탁소'·3일 뒤 회수 예정으로 보이며 두 옷의 상태가 '세탁 중'으로 표시된다
  - id: S6
    title: 사용자가 새 수납 공간을 만들고 배치 추천을 확정해 옷 위치를 찾는다
    account: 사용자
    steps:
      - 메뉴에서 '옷장 지도'를 누른다
      - "'공간 추가'를 누른다"
      - 공간 이름에 '현관 행거'를, 유형에서 '걸기'를, 수용 개수에 '3'을 입력한다
      - "'저장'을 누른다"
      - "'배치 추천 받기'를 누른다"
      - 추천안에서 '연청 데님 팬츠' 줄의 '배치 완료'를 누른다
      - 메뉴에서 '내 옷장'을 누른다
      - 검색창에 '연청'을 입력한다
    expected: 옷장 지도에 '현관 행거'가 보이고, 검색 결과의 '연청 데님 팬츠' 카드에 확정된 보관 위치 경로가 표시되며 '미배치' 표시가 사라진다
  - id: S7
    title: 사용자가 셔츠를 세탁소에 맡기고 회수 예정일을 기록한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '네이비 옥스퍼드 셔츠'를 연다
      - "'세탁·수선 맡기기'를 누른다"
      - 종류에서 '세탁'을, 맡긴 곳에서 '업체'를 고르고 업체명에 '동네 세탁소'를 입력한다
      - 회수 예정일을 내일 날짜로 입력한다
      - "'기록하기'를 누른다"
      - 메뉴에서 '관리함'을 누른다
      - "'진행 중' 탭을 누른다"
    expected: 관리함의 '진행 중' 목록에 '네이비 옥스퍼드 셔츠'가 '동네 세탁소'·내일 회수 예정으로 보이고, 이 셔츠의 상태가 '세탁 중'으로 표시된다
  - id: S8
    title: 사용자가 기한이 지난 세탁물을 회수하고 보관 위치를 다시 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '관리함'을 누른다
      - "'기한 지남' 목록에서 '베이지 니트'의 '회수 완료'를 누른다"
      - "'베이지 니트'를 눌러 옷 상세를 연다"
      - 제안된 위치를 확인하고 '재배치 확인'을 누른다
    expected: 옷 상세에서 '베이지 니트'의 상태가 '보관 중'과 확정된 위치로 표시되고, 관리 이력에 회수 완료 기록이 남으며, 관리함의 '기한 지남' 목록에서 사라진다
