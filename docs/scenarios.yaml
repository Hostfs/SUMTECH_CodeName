# 옷결 사용자 핵심 흐름. 주최 측 실행이 흐름마다 e2e/scenarios/<id>.spec.ts를 실행한다.
# 선행 데이터는 앱이 처음 뜰 때 시드로 만든다(사용자 시드 계정의 의류 7벌, 수납 공간 3곳, 세탁·수선 기록 2건).
# 각 흐름은 시드 데이터만으로 성립하고 서로 다른 시드 의류를 사용한다.
platform: both
platformReason: |
  택 촬영과 등록은 새 옷을 산 직후나 옷장 앞에서 스마트폰 카메라로 하고, 외출 직전 옷 위치 찾기와 세탁소 회수 확인도
  집 안이나 이동 중에 휴대폰으로 한다. 반면 계절 옷 교체 때 옷장 지도를 보며 여러 벌의 배치를 정하거나 3D 모형으로
  상하의를 비교하는 일은 넓은 화면의 PC에서 하는 장면이 있어, 두 화면 모두에서 같은 흐름이 동작해야 한다.
scenarios:
  - id: S1
    title: 처음 온 사람이 서비스 소개를 보고 회원가입해 빈 옷장을 연다
    steps:
      - 첫 화면에서 서비스 소개를 확인하고 '시작하기'를 누른다
      - 회원가입 화면에서 이메일과 비밀번호를 입력한다
      - "'가입하기'를 누른다"
    expected: 가입한 이메일로 로그인된 상태가 되고, 내 옷장에 등록된 옷이 0벌이라는 안내와 '옷 등록' 버튼이 보인다
  - id: S2
    title: 사용자가 택 사진 2장으로 새 옷을 AI 분석해 등록한다
    account: 사용자
    steps:
      - 메뉴에서 '옷 등록'을 누른다
      - "'택 사진 추가'로 세탁 택 사진과 브랜드 택 사진 2장을 올린다"
      - "'택 분석하기'를 누른다"
      - 분석 결과의 '옷 이름'에 '등록 테스트 셔츠'를 입력한다
      - "'제품 찾기'를 누른다"
      - "'저장하기'를 누른다"
    expected: 옷 상세 화면에 '등록 테스트 셔츠'와 택 사진 2장, AI가 읽은 브랜드·소재 값이 보이고, 제품 후보 카드 또는 '검색 결과 없음' 안내가 기록되어 있다
  - id: S3
    title: 사용자가 옷의 계절 분류를 고치고 계절별 보기로 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '화이트 반소매 티셔츠'를 연다
      - "'정보 수정'을 누른다"
      - 계절에서 '봄'을 추가로 선택한다
      - "'저장'을 누른다"
      - 메뉴에서 '내 옷장'을 누른다
      - 보기 기준에서 '계절'을 고른다
      - 화면을 새로고침한다
    expected: 계절별 보기의 '봄' 묶음과 '여름' 묶음 모두에 '화이트 반소매 티셔츠'가 보이고, 새로고침 후에도 그대로 유지된다
  - id: S4
    title: 사용자가 신체 치수를 넣고 3D 모형에 상하의를 입혀 코디를 저장한다
    account: 사용자
    steps:
      - 메뉴에서 '코디 스튜디오'를 누른다
      - 신체 치수의 '키'에 '185'를 입력한다
      - "'치수 적용'을 누른다"
      - 상의 목록에서 '그레이 울 재킷'을 고른다
      - 하의 목록에서 '블랙 슬랙스'를 고른다
      - "'코디 저장'을 누른다"
      - 코디 이름에 '출근 코디'를 입력하고 '저장'을 누른다
    expected: 3D 모형 옆에 '재킷'·'긴바지' 템플릿과 키 185cm가 표시되고, 저장한 코디 목록에 '출근 코디'가 '그레이 울 재킷'·'블랙 슬랙스' 조합으로 보인다
  - id: S5
    title: 사용자가 가을 출근 코디를 AI에게 추천받는다
    account: 사용자
    steps:
      - 메뉴에서 '코디 스튜디오'를 누른다
      - "'AI 추천' 탭을 누른다"
      - 계절에서 '가을'을, 상황에서 '출근'을 고른다
      - "'추천 받기'를 누른다"
    expected: 내 옷장에 있는 옷 카드로 이루어진 상하의 조합과 비어 있지 않은 추천 이유가 보이고, 세탁 중인 '베이지 니트'는 추천에 들어 있지 않다
  - id: S6
    title: 사용자가 새 수납 공간을 만들고 배치 추천을 확정해 옷 위치를 찾는다
    account: 사용자
    steps:
      - 메뉴에서 '옷장 지도'를 누른다
      - "'공간 추가'를 누른다"
      - 공간 이름에 '현관 행거'를, 유형에서 '걸기'를, 수용 개수에 '3'을 입력한다
      - "'저장'을 누른다"
      - "'배치 추천 받기'를 누른다"
      - 추천안에서 '연청 데님 팬츠' 줄의 '배치 완료'를 누른다
      - 메뉴에서 '내 옷장'을 누른다
      - 검색창에 '연청'을 입력한다
    expected: 옷장 지도에 '현관 행거'가 보이고, 검색 결과의 '연청 데님 팬츠' 카드에 확정된 보관 위치 경로가 표시되며 '미배치' 표시가 사라진다
  - id: S7
    title: 사용자가 셔츠를 세탁소에 맡기고 회수 예정일을 기록한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '네이비 옥스퍼드 셔츠'를 연다
      - "'세탁·수선 맡기기'를 누른다"
      - 종류에서 '세탁'을, 맡긴 곳에서 '업체'를 고르고 업체명에 '동네 세탁소'를 입력한다
      - 회수 예정일을 내일 날짜로 입력한다
      - "'기록하기'를 누른다"
      - 메뉴에서 '관리함'을 누른다
    expected: 관리함의 '진행 중' 목록에 '네이비 옥스퍼드 셔츠'가 '동네 세탁소'·내일 회수 예정으로 보이고, 이 셔츠의 상태가 '세탁 중'으로 표시된다
  - id: S8
    title: 사용자가 기한이 지난 세탁물을 회수하고 보관 위치를 다시 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '관리함'을 누른다
      - "'기한 지남' 목록에서 '베이지 니트'의 '회수 완료'를 누른다"
      - "'베이지 니트'를 눌러 옷 상세를 연다"
      - 제안된 위치를 확인하고 '재배치 확인'을 누른다
    expected: 옷 상세에서 '베이지 니트'의 상태가 '보관 중'과 확정된 위치로 표시되고, 관리 이력에 회수 완료 기록이 남으며, 관리함의 '기한 지남' 목록에서 사라진다
