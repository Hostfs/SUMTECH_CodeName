# 옷결 사용자 핵심 흐름. 주최 측 실행이 흐름마다 e2e/scenarios/<id>.spec.ts를 실행한다.
# 선행 데이터는 앱이 처음 뜰 때 시드로 만든다(사용자 시드 계정의 의류 14벌, 수납 공간 9곳(박스·본가·신발장 포함), 세탁·수선 기록 2건).
# 각 흐름은 시드 데이터만으로 성립하고 서로 다른 시드 의류를 사용한다. 화면은 모바일 디자인(하단 메뉴: 홈·내 옷장·옷 등록·코디·보관함)이고,
# 옷 정보·옷 등록 화면에서는 하단 메뉴가 숨겨져 '뒤로'로 돌아간다.
platform: both
platformReason: |
  택 촬영과 등록은 새 옷을 산 직후나 옷장 앞에서 스마트폰 카메라로 하고, 외출 직전 옷 위치 찾기와 세탁소 회수 확인도
  집 안이나 이동 중에 휴대폰으로 한다. 반면 계절 옷 교체 때 옷장 지도를 보며 여러 벌의 배치를 정하거나 박스에 넣을
  옷을 한꺼번에 고르는 일은 넓은 화면의 PC에서 하는 장면이 있어, 두 화면 모두에서 같은 흐름이 동작해야 한다.
scenarios:
  - id: S1
    title: 처음 온 사람이 서비스 소개를 보고 회원가입해 빈 옷장을 연다
    steps:
      - 첫 화면(로그인)에서 서비스 이름과 소개 문구를 확인하고 '회원가입'을 누른다
      - 회원가입 화면에서 이메일과 비밀번호를 입력한다
      - "'가입하기'를 누른다"
      - 메뉴에서 '내 옷장'을 누른다
    expected: 홈 인사말에 가입한 이메일의 아이디가 보여 로그인된 상태이고, 내 옷장에 등록된 옷이 0벌이라는 안내와 '옷 등록' 버튼이 보인다
  - id: S2
    title: 사용자가 택 사진 2장을 AI로 읽어 새 옷을 등록한다
    account: 사용자
    steps:
      - 메뉴에서 '옷 등록'을 누른다
      - 옷 종류에서 '상의'를 고른다
      - "'택·제품 코드'를 누른다"
      - "'택 사진 추가'로 세탁 택 사진과 브랜드 택 사진 2장을 올린다"
      - "'사진 찾기'를 누른다(택 글자를 읽어 브랜드·품번을 채우고 상품 사진을 찾는다)"
      - "'사진 없이'를 누른다"
      - 옷 정보의 '옷 이름'에 '등록 테스트 셔츠'를 입력한다
      - "'저장하기'를 누른다"
    expected: 옷 정보 화면에 '등록 테스트 셔츠'가 보이고, AI가 택에서 읽은 브랜드와 소재(혼용률 %)가 채워져 있다
  - id: S3
    title: 사용자가 옷의 계절 분류를 고치고 계절별 보기로 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '화이트 반소매 티셔츠'를 연다
      - "'수정'을 누른다"
      - 계절에서 '봄'을 추가로 선택한다
      - "'저장'을 누른다"
      - "'뒤로'를 눌러 내 옷장으로 돌아간다"
      - "'필터'를 눌러 보기 기준에서 '계절별'을 고르고 '적용하기'를 누른다"
      - 화면을 새로고침한 뒤 '화이트 반소매 티셔츠'를 연다
    expected: 계절별 보기의 '봄' 묶음과 '여름' 묶음 모두에 '화이트 반소매 티셔츠'가 보이고, 새로고침 후에도 옷 정보에 '봄'·'여름' 계절이 그대로 남아 있다
  - id: S4
    title: 사용자가 여름 옷 두 벌을 한 번에 '여름 박스'로 옮기고 위치별 보기로 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - "'선택'을 누른다"
      - 목록에서 '린넨 반소매 셔츠'와 '네이비 반바지'를 고른다
      - "'위치 변경'을 누른다"
      - 보관 공간에서 '여름 박스'를 고르고 '여름 박스(으)로 변경'을 누른다
      - "'필터'를 눌러 보기 기준에서 '위치별'을 고르고 '적용하기'를 누른다"
    expected: "'여름 박스' 묶음에 '린넨 반소매 셔츠'와 '네이비 반바지'가 보이고, 두 카드의 위치가 '여름 박스'로 표시된다"
  - id: S5
    title: 사용자가 수선 맡긴 바지의 회수 예정일을 미루고 관리함에서 확인한다
    account: 사용자
    steps:
      - 메뉴에서 '보관함'을 누른다
      - "'관리함' 탭을 누른다"
      - "'오늘 회수 예정' 목록에서 '카키 치노 팬츠'의 '예정일 변경'을 누른다"
      - 회수 예정일을 3일 뒤 날짜로 입력한다
      - "'변경'을 누른다"
      - 화면을 새로고침한 뒤 '관리함' 탭을 누른다
    expected: "'카키 치노 팬츠'가 '오늘 회수 예정'에서 빠지고 '진행 중' 목록에 '수선 · 미싱 수선실'·'3일 뒤 회수 예정'으로 보이며, 새로고침 후에도 유지된다"
  - id: S6
    title: 사용자가 새 수납 공간을 만들고 배치 추천을 확정해 옷 위치를 찾는다
    account: 사용자
    steps:
      - 메뉴에서 '보관함'을 누른다
      - "'공간 추가'를 누른다"
      - 공간 이름에 '현관 행거'를, 유형에서 '걸기'를, 수용 개수에 '3'을 입력한다
      - "'저장'을 누른다"
      - "'배치 추천 받기'를 누른다"
      - 추천안에서 '연청 데님 팬츠' 줄의 '배치 완료'를 누른다
      - 메뉴에서 '내 옷장'을 누른다
      - 검색창에 '연청'을 입력한다
    expected: 옷장 지도에 '현관 행거'가 보이고, 검색 결과의 '연청 데님 팬츠' 카드에 확정된 보관 위치가 표시되며 '미배치' 표시가 사라진다
  - id: S7
    title: 사용자가 셔츠를 세탁소에 맡기고 회수 예정일을 기록한다
    account: 사용자
    steps:
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '네이비 옥스퍼드 셔츠'를 연다
      - "'더보기'에서 '세탁·수선 맡기기'를 누른다"
      - 종류에서 '세탁'을, 맡긴 곳에서 '업체'를 고르고 업체명에 '동네 세탁소'를 입력한다
      - 회수 예정일을 내일 날짜로 입력한다
      - "'기록하기'를 누른다"
      - "'뒤로'를 누르고 메뉴에서 '보관함'을 누른다"
      - "'관리함' 탭을 누른다"
    expected: 관리함의 '진행 중' 목록에 '네이비 옥스퍼드 셔츠'가 '세탁 · 동네 세탁소'·'내일 회수 예정'으로 보이고, 내 옷장에서 이 셔츠의 상태가 '세탁 중'으로 표시된다
  - id: S8
    title: 사용자가 기한이 지난 세탁물을 회수하고 보관 위치를 다시 정한다
    account: 사용자
    steps:
      - 메뉴에서 '보관함'을 누른다
      - "'관리함' 탭을 누른다"
      - "'기한 지남' 목록에서 '베이지 니트'의 '회수 완료'를 누른다"
      - 메뉴에서 '내 옷장'을 누른다
      - 목록에서 '베이지 니트'를 연다
      - "'위치 변경'을 누르고 '서랍장'의 '2단'을 골라 '서랍장 › 2단(으)로 변경'을 누른다"
      - "'뒤로'를 누르고 메뉴에서 '보관함'을 누른 뒤 '관리함' 탭을 누른다"
    expected: 회수 직후 '베이지 니트'는 위치 미확인(미배치)으로 보이고, 위치를 정하면 옷 정보에 상태 표시 없이(보관 중) '서랍장 › 2단'이 보이며, 관리함의 '기한 지남' 목록에서 사라지고 '완료 이력'에 '베이지 니트 세탁 회수'가 남는다
