sources: []

verification_plan:
  summary: 자취생 8명 인터뷰와 기존 앱 리뷰 분석으로 [ ] 칸을 모두 채운다.
  evidence_to_collect:
    - id: E2
      what: 자취생 인터뷰 [n명, 일시] — 최근 옷 찾기 실패 에피소드
      status: 미수집
    - id: E3
      what: 1주 관찰 기록 [n명] — 옷 찾기 시간·횟수
      status: 미수집
    - id: E4
      what: 디지털 옷장 앱 리뷰 분석 — 이탈 이유
      status: 미수집
  recruiting: 자취생 8명 섭외 (보관 장소 3곳 이상 조건)
  interview_questions:
    - 최근 옷을 못 찾았던 때를 그대로 얘기해 달라.
    - 그 옷은 어디 있었나.
    - 찾는 데 얼마나 걸렸나.
    - 옷 목록을 기록해 본 적 있나, 마지막 갱신은 언제인가.
  method:
    - 발언 원문 기록 (일시·당사자·소요 시간).
    - 디지털 옷장 앱 2~3개 직접 사용 + 앱스토어 리뷰에서 이탈 이유 집계.
    - 결과로 상황 빈도, 영향 표, 근거 표, 통찰 칸을 채운다.
    - 결과가 가설과 다르면 statement와 근본 문제부터 다시 쓴다.
  decision_rule: 8명 중 5명 이상이 최근 한 달 내 '집 밖·박스 속 옷'을 못 찾은 경험이 있으면 이 문제로 진행한다. 미만이면 다른 장면(세탁소 회수 등)으로 좁힌다.

five_whys:
  symptom: 외출 직전 입으려던 옷이 옷장에 없어 한참 뒤지다가, 세탁소에 맡겼거나 박스·본가에 있다는 걸 뒤늦게 떠올리고 그 옷을 포기한다.
  whys:
    - 그 옷이 지금 어디 있는지 모른다.
    - 옷장 밖(박스·본가·세탁소)으로 옮긴 사실을 기억하지 못한다.
    - 옮기던 당시 어디에도 남기지 않았다.
    - 옮기는 순간은 바쁘고, 몇 주 뒤에도 기억날 거라고 생각한다.
    - 기록의 이득은 나중에 오고 비용은 지금 들기 때문에, 그 순간엔 기록하지 않는 게 합리적이다.
  root_cause: 옮기는 순간의 기록 비용이 그 순간의 이득보다 크다. (3~5단계는 인터뷰로 검증)

solution_paths:
  - path: 박스·세탁소 단위 기록 (박스 라벨 QR, 세탁소 영수증 촬영 → 옷 묶음 등록)
    status: chosen
    reason: 옷 한 벌씩이 아니라 '옮기는 단위'로 기록해 비용을 줄인다. 택 OCR은 첫 등록 보조로만 쓴다.
  - path: 모든 옷을 한 벌씩 촬영·입력
    status: deferred
    reason: 기존 앱과 같은 방식. 첫 등록과 갱신 부담으로 이탈 가능성이 크다. AI 검색이 실패할 때의 대체 경로로만 유지한다.
  - path: 3D 가상착의·코디
    status: rejected
    reason: 이번에 정의한 문제(위치·상태 모름)와 무관하다.

# 해법 기준과 선택한 해법의 동작(우성 수정안). 대시보드 형식의 solution_paths와 분리해 둔다.
# 근본 원인에서 해법·결과로 이어지는 흐름.
solution_logic: |-
  근본 원인: 옮기는 순간의 기록 비용이 그 순간의 이득보다 커서, 옮길 때 아무것도 남기지 않는다.
  → 해법 원리: 옮기는 순간의 기록 비용을 거의 0(3초)으로 낮추면, 찾는 순간에 믿을 수 있는 기록이 남는다.
  → 해법: 옷을 한 벌씩이 아니라 '옮기는 단위'(박스 하나, 세탁소에 한 번 맡기는 묶음)로 묶어, 박스 라벨 QR이나 세탁소 영수증을 한 번 찍는 것으로 위치·상태를 기록한다.
  → 결과: 외출 직전 '그 옷이 지금 어디 있고 바로 입을 수 있는지'를 옷장을 뒤지지 않고 확인한다.
solution_criterion: 해법의 기준은 하나다. 옮기는 순간의 기록을 3초 안에 끝낼 수 있는가.
chosen_approach:
  summary: 옷을 '옮기는 단위'(박스 하나, 세탁소에 맡기는 묶음)로 묶어, 옮기는 순간에 한 번의 짧은 동작으로 위치·상태를 남긴다. 찾을 때는 '지금 어디 있고 바로 입을 수 있는지'를 바로 확인한다.
  flow_when_moving: |-
    옮기는 순간(박스에 넣기·세탁소에 맡기기)에 기록을 끝낸다.
    1. 묶음을 연다: 박스 라벨 QR을 찍거나 새 묶음을 만든다. 세탁소면 영수증을 찍는다.
    2. 들어가는 옷을 담는다: 이미 등록된 옷은 체크로, 아직 등록하지 않은 옷은 사진 한 장으로 묶음에 넣는다.
    3. 목적지와 날짜를 확인한다: 보낸 곳(박스 A·본가·세탁소)과 날짜는 기본값으로 채워져 있어 확인만 한다.
    이미 등록된 옷이라면 QR 찍기 → 체크 → 저장이 3초 안에 끝나는 것이 목표다(실측·검증 대상).
  flow_when_finding: |-
    찾는 순간(외출 직전·계절 교체·회수)에는 남겨 둔 기록을 본다.
    - 옷을 검색하면 '옷장 A → 왼쪽 행거' 또는 '박스 A / 세탁소 / 본가'처럼 현재 위치와 바로 입을 수 있는지를 보여 준다.
    - 집 밖·박스 속 옷만 모아 보거나, 세탁소에 맡긴 옷의 회수 예정·기한 지남을 한눈에 본다.
  how_it_meets_criterion: 한 벌씩이 아니라 묶음 단위로 기록하고, 목적지·날짜를 기본값으로 채우며, 택 OCR은 첫 등록에서만 보조로 써서 옮기는 순간의 입력을 최소화한다.
  out_of_scope: 모든 옷의 일괄 등록, 정밀 핏 보장, 3D 가상착의·코디는 이번 범위에서 다루지 않는다.
  maps_to_features: [R11, R07, R08, R01]
  open_questions:
    - 3초 목표가 실제로 달성되는지, 옮기는 순간에 사용자가 기록할 의향이 있는지 검증이 필요하다(verification_plan 참조).
    - 박스 라벨 QR과 세탁소 영수증 촬영 중 어느 입력이 더 부담이 적은지 사용자 테스트로 확인한다.

insight:
  claim: (가설) 사람들은 기록을 '못' 하는 게 아니라, 옮기는 순간엔 기록할 '이유가 없어서' 안 한다. 그래서 더 꼼꼼한 옷장 앱이 아니라, 옮기는 순간의 기록을 거의 없애는 쪽이 답이다.
  evidence: "현재 근거는 팀 제안자 1인 경험(E1)뿐이다. [인터뷰 '마지막 갱신 시점' 답변: n명 중 _명이 첫 등록 이후 갱신하지 않음] (미수집)"
  note: 인터뷰 결과로 claim을 확인하거나 교체한다. 근거를 채우지 못하면 제출 전에 이 칸을 지운다.
  design_decision: 옮기는 단위(박스·세탁소) 기록을 중심에 두고, 택 OCR은 첫 등록 보조로만 쓴다. 3D 가상착의·코디와 정밀 핏 보장은 이번 범위에서 제외한다.

# features: 수정안의 좁힌 문제(집 밖·박스 속 옷의 위치·상태)에 맞춰 3D 코디(옛 R05)와 코디 추천(옛 R06)을 제외했다.
# R-id는 추적을 위해 유지하고, 제외한 번호는 비워 둔다. R11은 수정안에서 선택한 '옮기는 단위 묶음 기록' 해법을 반영한다.
features:
  - id: R00
    name: 회원가입·로그인과 계정별 옷장 분리
    input: 이메일·비밀번호(회원가입, 로그인), 로그아웃 버튼
    output: 계정별로 의류·공간·신체 치수·관리 기록이 서버에 저장되고, 다른 계정의 자료는 보이거나 바뀌지 않는다. 로그인하지 않은 사람은 첫 화면에서 서비스 소개와 예시 옷장 둘러보기만 볼 수 있다.
    done: 회원가입 후 바로 로그인되어 빈 옷장이 보이고, 로그아웃 후 다시 로그인해도 등록한 옷이 그대로 있다. 비밀번호가 틀리면 로그인되지 않고 이유를 보여 준다. 다른 계정의 의류 주소를 열면 404가 된다.
  - id: R01
    name: 택 사진 등록·분석·수정(첫 등록 보조)
    input: 한 벌의 택 사진 1장 이상(세탁·혼용률 택, 브랜드·품번 택을 여러 장 묶을 수 있음)
    output: AI가 읽은 브랜드·품번·표기 사이즈·원산지·소재(겉감·안감 구분, 혼용률)·세탁 지시를 원문과 함께 보여 주고, 읽지 못한 값은 '확인 필요'로 표시한다. 사용자가 고친 값이 저장되고 원본 택 사진도 그 의류에 남는다. 택 OCR은 첫 등록을 돕는 보조이며, 미입력이어도 등록을 마칠 수 있다.
    done: 택 사진 2장을 한 의류에 묶어 분석하면 추출값과 원문이 표시되고, 값을 고쳐 저장하면 옷 상세에서 고친 값과 택 사진 2장이 보인다. AI 호출이 실패하면 입력 내용을 유지한 채 재시도와 직접 입력을 고를 수 있다.
  - id: R02
    name: 제품 후보 웹 검색·확정·대체 등록
    input: 택에서 읽은(또는 사용자가 고친) 브랜드와 품번
    output: 웹 검색과 상품 페이지 수집으로 찾은 제품 후보 카드(상품명·대표 이미지·색상·출처 URL·조회 시점·일치 근거)를 보여 준다. 사용자가 실제 보유 제품을 고르면 후보가 그 의류에 연결되고, 고르지 않은 후보는 의류 정보에 섞이지 않는다. 결과가 없거나 검색이 실패하면 직접 촬영 사진과 택 정보로 등록을 계속한다.
    done: 후보를 하나 선택해 저장하면 옷 상세에 상품명·출처 URL·조회 시점이 보인다. 후보가 없거나 검색이 실패해도 '직접 입력으로 계속'을 눌러 등록을 끝낼 수 있다. 정확도 퍼센트 같은 보정되지 않은 점수는 표시하지 않는다.
  - id: R03
    name: 대표 이미지 정리
    input: 선택한 제품 이미지 또는 사용자가 직접 촬영한 옷 사진
    output: 배경 제거, 중앙 정렬, 동일한 정사각 캔버스와 여백을 적용한 대표 이미지가 옷장 목록에 쓰이고 원본은 따로 남는다. 로고·무늬·색은 바꾸지 않는다.
    done: 테스트 사진을 올리면 정리된 대표 이미지와 원본을 나란히 볼 수 있다. 처리에 실패하면 원본이 대표 이미지로 유지되고 '다시 처리'를 누를 수 있다.
  - id: R04
    name: 다중 속성 분류와 검색
    input: 보기 기준 선택(종류·계절·브랜드·위치·상태·사용자 컬렉션), 검색어, 분류 수정
    output: AI가 처음 제안한 분류(종류·세부 종류·계절·색상)를 사용자가 수정·추가·삭제할 수 있고, 같은 옷이 여러 계절·컬렉션에 동시에 속한다. 사용자가 고친 값은 AI 재분석으로 덮어쓰지 않는다. '집 밖/박스 속' 같은 위치·상태 기준으로도 묶어 볼 수 있다.
    done: 내 옷장에서 '계절'·'브랜드'·'위치' 보기로 바꾸면 그 기준으로 묶여 보이고, 옷의 계절을 고쳐 저장한 뒤 새로고침해도 고친 값으로 묶인다.
  # R05(체형 비율 반영 3D 코디) — 제외: 수정안에서 3D 가상착의·코디가 정의한 문제(위치·상태 모름)와 무관해 범위에서 뺌.
  # R06(보유 의류 기반 AI 코디 추천) — 제외: 코디 확인은 별도 문제로 분리.
  - id: R07
    name: 수납 공간 등록·배치 추천·위치 찾기
    input: 공간 이름과 상위 공간(예 옷장 A > 왼쪽 행거), 유형(걸기·접기·장기보관), 대략적인 수용 개수, 자주 입는 정도
    output: 의류 종류·계절·자주 입는 정도·공간 유형·용량으로 만든 배치 추천안을 보여 주고, 사용자가 수정할 수 있다. 추천안은 미확정으로 남고 '배치 완료'를 눌러야 현재 위치가 바뀐다. 용량을 넘으면 초과 수량을 표시한다. 옷을 검색하면 '옷장 A → 왼쪽 행거'처럼 경로를 보여 준다.
    done: 배치 추천을 만든 직후에는 옷 상세의 위치가 바뀌지 않고, '배치 완료'를 누른 뒤 내 옷장에서 그 옷을 검색하면 확정된 위치 경로가 보인다. 용량을 넘긴 공간에는 초과 수량이 표시된다.
  - id: R08
    name: 세탁·수선·회수 관리
    input: 상태(세탁 대기·세탁 중·수선 중), 자택·업체 구분, 업체명, 수선 내용, 맡긴 날짜, 회수 예정일
    output: 관리함에 '오늘 회수 예정'과 '기한 지남' 목록과 배지가 접속 시점 날짜로 계산되어 보인다. 회수 완료를 누르면 진행 중 목록에서 빠지고 기록은 이력으로 남으며, 옷은 '회수 완료·위치 미확인' 상태로 기존 위치를 제안받는다. '재배치 확인'을 눌러야 보관 중으로 바뀐다.
    done: 회수 예정일이 지난 기록은 '기한 지남'에 보이고, 예정일을 미래로 바꾸면 그 목록에서 빠진다. 회수 완료를 누르면 진행 중 목록에서 사라지고 옷 상세 이력에 남으며, 재배치 확인 후 상태가 '보관 중'으로 표시된다.
  - id: R09
    name: 일관된 영속 저장
    input: 등록·분류·배치·관리 상태 변경
    output: 등록→위치→상태가 같은 의류 ID를 참조하고, 한 화면에서 바꾼 상태가 다른 모든 화면에 같은 값으로 보인다.
    done: 옷을 세탁 중으로 바꾸면 내 옷장 카드·옷 상세·옷장 지도·관리함에서 모두 세탁 중(사용 불가)으로 반영되고, 새로고침 후에도 유지된다.
  - id: R10
    name: 공개 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 잘못된 입력, 외부 AI·검색 장애
    output: 공개 HTTPS 주소에서 스마트폰과 PC 모두 핵심 흐름을 쓸 수 있다. 필수 값이 비면 저장하지 않고 이유를 보여 주며, 외부 호출 실패 시 입력을 유지한 채 재시도·수동 입력 경로를 준다. 없는 주소는 404 화면을 보여 준다.
    done: 휴대폰 화면과 PC 화면에서 등록·옷장·옷장 지도·관리함이 깨지지 않고 사용된다. 별칭 없이 저장을 누르면 저장되지 않고 이유가 보인다.
  - id: R11
    name: 옮기는 단위(박스·세탁소) 묶음 기록
    input: 박스 라벨 QR 또는 세탁소 영수증 촬영, 묶을 옷 선택(또는 묶음 통째), 보낸 곳(박스·본가·세탁소)과 날짜
    output: 여러 벌을 한 번에 '옮김'으로 기록해 각 옷의 현재 위치·상태가 '박스 A / 세탁소 / 본가'로 바뀐다. 옮기는 순간의 입력을 짧게(목표 3초) 끝내도록 기본값을 채워 준다. 영수증·QR 원본은 그 묶음에 남는다. 세탁소로 보낸 묶음은 R08의 회수 관리로 이어진다.
    done: 박스 라벨을 찍고 옷 여러 벌을 묶어 '박스 A로 보냄'을 저장하면 각 옷 상세의 위치가 '박스 A'로 바뀌고 내 옷장에서 '집 밖/박스' 보기로 함께 보인다. 세탁소 영수증을 찍어 묶음을 만들면 그 옷들이 '세탁 중'이 되고 회수 예정일이 관리함에 나타난다.
