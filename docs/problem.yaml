five_whys:
  symptom: 외출 직전 입으려던 옷이 옷장에 없어 뒤지다가, 세탁소에 맡겼거나 박스·본가에 있다는 걸 뒤늦게 떠올리고 그 옷을 포기한다.
  whys:
    - 그 옷이 지금 어디 있는지 바로 확인하지 못한다.
    - 옷장 밖(박스·본가·세탁소)으로 옮긴 사실이나 구체적인 위치를 기억하지 못한다.
    - 옮길 당시 위치(세탁소라면 맡긴 사실과 회수일)를 남기지 않았거나, 이후 한두 벌씩 꺼내고 넣은 변화를 반영하지 않았다.
    - (가설) 처음 옮길 때든 한 벌을 꺼낼 때든, 옮기는 순간에는 손이 바쁘고 기록에 따로 시간을 내야 해 미룬다.
    - (가설) 기록의 수고는 옮기는 그 순간에 들지만 기록의 쓸모는 나중에 찾을 때에야 생겨, 옮기는 순간에 기록할 이유가 약하다.

solution_paths:
  - path: 옮기는 단위 묶음 기록 — 박스 라벨 QR·세탁소 영수증 촬영과 다중 선택으로 한 번에 위치·상태 변경
    status: chosen
    reason: |-
      근본 원인을 '옮기는 순간의 기록 수고'로 보았으므로, 그 순간의 입력을 줄이는 쪽을 골랐다.
      - 보낼 곳: 박스에 붙여 둔 라벨 QR을 찍으면 그 박스가 골라지고, 라벨이 없는 본가·세탁소는 최근에 보낸 곳이 기본값으로 채워진다.
      - 옷: 이미 등록된 옷은 체크만 하면 여러 벌이 한 번에 옮겨진다. 처음 보는 옷은 그 자리에서 이름·종류만 넣어 묶음에 추가하므로, 전부 미리 등록할 필요가 없다.
      - 낱벌: 박스에 한 벌을 더 넣을 때는 같은 옮기기 화면에서 한 벌만 체크하고, 박스에서 한 벌을 꺼내 옷장에 걸 때는 옷 상세의 '위치 변경'에서 넣은 곳을 한 번 고른다. 계절 교체로 여러 벌을 꺼낼 때는 옷장 지도에서 넣을 공간의 '옷 넣기'로 여러 벌을 골라 한 번에 넣는다. 어느 경우든 메모처럼 위치를 글로 다시 쓰지 않는다.
      - 영수증: 받았으면 사진을 묶음에 함께 남기고, 받지 못했어도(SRC2의 44.2%) 묶음 기록 자체가 맡긴 옷 목록과 회수 예정일이 된다.
      남는 위험: 옮길 때 앱을 열지 않으면 여전히 어긋난다. 이 부담이 메모보다 실제로 작은지는 팀 밖 사용으로 확인해야 한다.
  - path: 모든 옷을 한 벌씩 촬영·입력하는 옷장 앱
    status: deferred
    reason: 가진 옷을 전부 미리 등록하게 하면 첫 등록 부담이 크다. 그래서 일괄 사전 등록은 요구하지 않고, 옮기는 중 '처음 보는 옷'으로 바로 추가하거나 새 옷을 샀을 때 택 사진(R01)으로 한 벌 등록하는 길만 남긴다.
  - path: 3D 가상착의·코디 추천
    status: rejected
    reason: 옷의 보관 위치와 착용 가능 상태를 확인하는 핵심 문제와 직접 연결되지 않아 범위에서 제외했다.

insight:
  claim: 팀이 세운 가설은, 옷의 위치는 찾을 때가 아니라 옮길 때(처음 넣을 때와 한 벌씩 꺼낼 때 모두) 잃는다는 것이다. 그렇다면 기록은 옮기는 순간에, 여러 벌을 한 번에, 글로 적지 않고 남길 수 있어야 한다. 박스 라벨 QR은 보낼 곳을 고르는 계기로 쓰고, 세탁소 영수증은 있으면 덧붙이는 선택 사항이다.
  evidence: |-
    E1·E2: 박스에 넣어 둔 옷이 무엇인지·어디 뒀는지 몰라 박스를 전부 뒤지거나 착용을 포기했고, 세탁소 회수 시점을 놓쳤다.
    SRC7·SRC8: 좁은 주거 때문에 계절 옷을 둘 공간이 부족하다는 보도와, 좁은 주거공간을 이유로 든 세탁업체 의류보관 서비스 이용 증가 보도가 있다. 옷이 옷장 밖으로 옮겨 가는 일 자체는 이미 일어난다.
    SRC2·SRC3: 세탁물 분실로 피해구제를 신청한 231건 중 인수증을 받은 경우는 76건(32.9%)이었고, 소비자원은 완성된 세탁물을 빨리 회수하라고 안내한다. 맡긴 옷의 기록·회수 문제가 분쟁에서도 드러난다(일반 이용자의 빈도를 뜻하지는 않는다).
    SRC4~SRC6: 앱 설명 기준 옷장 앱은 보유 목록·코디 중심이고, 세탁 앱은 자기 서비스에 맡긴 세탁물만 다룬다.
    아직 확인하지 못한 것: 팀 밖 사용자 인터뷰, 메모 대비 묶음 기록에 걸리는 시간, 반복 사용 시 기록이 실제 위치와 맞게 유지되는 비율.
  design_decision: |-
    핵심: 박스·세탁소·본가로 옮기는 묶음 기록(R11), 세탁 회수 관리(R08), 위치 경로 조회(R07).
    R07: 박스에서 꺼낸 옷도 집 안 어디에 뒀는지 남아야 다음에 찾을 수 있으므로, 집 안 공간('옷장 A → 왼쪽 행거')과 옷 상세의 '위치 변경'을 둔다. 배치 추천은 위치가 비어 있는 옷을 한꺼번에 정리할 때의 편의 기능이며, 추천이 꼭 필요한지는 확인하지 않았다. 추천은 '배치 완료'를 눌러야 위치가 된다.
    보조: 택 AI 분석(R01~R03)은 첫 등록 입력을 줄이고 세탁 지시를 함께 읽어 옷 상세에 남긴다(E2에 세탁 방법 실수가 있었으나, 이것으로 실수가 줄어드는지는 확인하지 않았다). 현재 날씨 기반 집 안 옷 보기(R12)는 꺼내 입을 때 박스·본가·세탁소에 있는 옷을 걸러 준다.

features:
  - id: R11
    name: 옮기는 단위(박스·세탁소·본가) 묶음 기록
    input: 보낼 곳(박스·집 밖 공간 또는 세탁소), 박스 라벨 QR·영수증 사진(선택), 옮길 옷 여러 벌 체크, 처음 보는 옷의 사진·이름·종류(선택), 옮긴 날·회수 예정일(최근값 기본)
    output: 선택한 옷들의 위치가 한 번에 해당 박스·본가로 바뀌거나, 세탁소 묶음이면 각 옷이 '세탁 중'이 되고 관리함에 회수 예정일이 등록된다. 박스 라벨 QR을 찍으면 해당 박스가 자동 선택되고, 등록되지 않은 옷은 '처음 보는 옷'에서 사진·이름·종류만 넣어 그 자리에서 묶음에 넣는다. 찍은 라벨·영수증 사진은 그 묶음 기록에 남는다.
    done: |-
      옮기기에서 '여름 박스'를 고르고 린넨 셔츠·반바지를 체크해 '여름 박스로 보냄 (2벌)'을 누르면 내 옷장 '집 밖/박스' 보기의 '박스 속' 묶음에 두 벌이 '박스 속 · 여름 박스'로 보인다.
      '세탁소'에서 '동네 세탁소'와 '3일 뒤'로 두 벌을 맡기면 관리함 진행 중 목록에 두 벌이 '세탁 중'으로 보인다. 영수증 사진을 붙였으면 최근 옮긴 기록에 '사진 1장'이 함께 보인다.
      박스 라벨 QR로 옮기기를 열면 보낼 곳이 그 박스로 미리 골라져 있다. '처음 보는 옷'으로 추가한 옷은 체크된 채 목록 맨 위에 나타나고, 보낸 뒤 내 옷장에서 그 박스 위치로 보인다.
  - id: R08
    name: 세탁·수선·회수 관리
    input: 종류(세탁·수선), 자택·업체 구분과 업체명, 맡긴 날짜, 회수 예정일
    output: 관리함에 '기한 지남'·'오늘 회수 예정'·'진행 중'·'완료 이력'이 표시된다. 회수 완료 시 '회수 완료·위치 미확인'이 되며, 맡기기 전 위치가 있으면 그 위치를 제안하고 '재배치 확인'을, 없으면 '위치 변경'으로 넣을 곳을 골라야 '보관 중'으로 확정된다.
    done: 예정일이 지난 베이지 니트가 '기한 지남'에 보이고, '회수 완료' 뒤 옷 상세에서 '재배치 확인'을 누르면 상태가 '보관 중'과 위치 경로로 바뀌며 '기한 지남'에서 사라진다.
  - id: R07
    name: 수납 공간과 위치 찾기
    input: 공간 이름과 상위 공간, 유형(걸기·접기·장기보관·박스·집 밖), 수용 개수, 옷 상세의 '위치 변경'(한 벌), 옷장 지도의 '옷 넣기'(여러 벌), 배치 추천의 '배치 완료' 확인
    output: 옷 검색 시 '옷장 A → 왼쪽 행거' 또는 '박스 속 · 여름 박스'처럼 확정된 위치 경로가 보인다. 박스에서 꺼낸 옷은 '위치 변경'이나 공간의 '옷 넣기'로 집 안 공간을 고르면 그 경로로 바뀐다. 박스·집 밖 아래에 만든 공간(예 '본가 → 안방 옷장')의 옷도 집 밖으로 본다. 배치 추천안은 '배치 완료'를 눌러야 위치에 반영된다.
    done: |-
      '현관 행거'(걸기, 3벌)를 만들고 배치 추천에서 '연청 데님 팬츠'의 '배치 완료'를 누르면, 내 옷장에서 '연청'을 검색한 카드에 위치 경로가 보이고 '미배치' 표시가 사라진다.
      '여름 박스'에 있던 옷의 상세에서 '위치 변경'으로 집 안 공간을 고르고 '여기로 옮김'을 누르면, 그 옷의 위치가 '박스 속 · 여름 박스'에서 고른 공간 경로로 바뀐다.
  - id: R09
    name: 한 벌 한 기록(일관된 저장)
    input: 등록·분류·배치·묶음·관리 상태 변경
    output: 위치·상태·묶음·이력이 같은 의류 ID에 연결되어 모든 화면에서 동일한 상태와 위치를 보여 준다.
    done: 옷을 세탁소에 맡기면 내 옷장·옷 상세·옷장 지도·관리함이 모두 '세탁 중'으로 바뀌고 새로고침 후에도 유지된다.
  - id: R00
    name: 회원가입·로그인과 계정별 옷장
    input: 이메일·비밀번호, 로그아웃
    output: 계정별로 옷·공간·묶음·관리 기록이 분리 저장되며, 로그인 전에는 서비스 소개와 예시 옷장만 보인다.
    done: 가입 직후 빈 옷장과 '옷 등록' 버튼이 보이고 다시 로그인해도 등록한 옷이 유지된다. 다른 계정의 옷 주소는 404다.
  - id: R10
    name: 휴대폰·PC 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 필수값 누락 입력, 외부 API 장애
    output: 휴대폰과 PC에서 같은 흐름을 쓰며, 필수값 누락 시 입력값을 유지한 채 이유를 보여 주고 외부 호출 실패 시 재시도·직접 입력을 제공한다.
    done: 휴대폰(가로 390px)과 PC(가로 1440px)에서 주 메뉴가 보이고 가로 스크롤 없이 옷장·옮기기·관리함을 연다. 옷 이름 없이 저장을 누르면 저장되지 않고 이유가 보이며 입력한 다른 값은 그대로 남는다. 택 분석이 실패하면 실패 이유가 보이고, 사진을 그대로 둔 채 '택 분석하기'를 다시 누르거나 직접 입력해 등록을 마칠 수 있다.
  - id: R04
    name: 보기 기준과 검색
    input: 보기 기준(종류·계절·브랜드·위치·집 밖/박스·상태·컬렉션), 검색어, 분류 수정
    output: 선택한 기준별로 의류를 묶어 보여 주며, '집 밖/박스' 보기는 박스 속·집 밖·세탁 맡김 옷을 먼저 묶어 보여 준다.
    done: 화이트 반소매 티셔츠에 '봄'을 추가하고 계절 보기로 바꾸면 봄·여름 묶음 모두에 보이고 새로고침 후에도 유지된다.
  - id: R01
    name: 택 사진 AI 분석(보조)
    input: 세탁·브랜드 택 사진 1~4장
    output: 브랜드·품번·사이즈·소재·세탁 지시를 추출하고 미인식 항목은 '확인 필요'로 표시한다.
    done: 택 사진 2장으로 분석해 이름을 넣고 저장하면 옷 상세에 이름·택 사진 2장·읽은 브랜드와 소재가 보인다.
  - id: R02
    name: 제품 후보 웹 검색(보조)
    input: 브랜드와 품번
    output: 웹 검색 후보를 보여 주고 선택한 후보를 옷에 연결하며, 결과가 없어도 직접 입력으로 등록을 마친다.
    done: 후보를 고르거나 '검색 결과 없음'으로 저장해도 옷 상세에 결과가 남는다.
  - id: R03
    name: 대표 이미지 정리(보조)
    input: 제품 이미지 또는 직접 찍은 옷 사진
    output: 배경을 정리한 정사각 대표 이미지를 만들고 원본도 함께 보존한다.
    done: 정리 실패 시 원본이 대표 이미지로 남고 '다시 처리'할 수 있다.
  - id: R12
    name: 현재 위치 날씨와 집 안 옷 보기(보조)
    input: 현재 위치 권한, 기상청 단기예보
    output: 현재 기온에 맞는 옷 중 박스·본가·세탁소에 있지 않고 지금 집 안에 있는 옷을 보관 위치와 함께 보여 준다.
    done: 위치를 허락하면 현재 기온과 집 안 옷이 위치 경로와 함께 보이고, 거부하거나 응답이 없어도 옷장 기능은 그대로 동작한다.
