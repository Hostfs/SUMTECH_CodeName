# 6요소 문장: 상황 → 고객 → 정확한 문제 → 감정 → 현재 대안 → 그 단점에도 쓰는 이유
statement: >-
  계절 옷을 여러 곳에 나누어 보관하는 자취 대학생·사회초년생은
  외출 직전이나 계절 정리 때 가진 옷이 어디에 있고 지금 입을 수 있는지 바로 알 수 없어
  준비 시간을 옷 찾기에 빼앗기고, 이미 있는 옷을 다시 사거나 맡긴 옷을 잊는다.
  그 순간 조급함과 '분명 있는데'라는 답답함을 느낀다.
  그래서 옷장을 직접 뒤지거나 사진·메모·세탁소 영수증으로 버티고 있으며,
  기록이 금방 실제와 어긋나는 단점에도 따로 돈이나 시간을 들이지 않아도 된다는 이유로 계속 쓰고 있다.

# ① 상황 (Context): 문제가 언제·어디서 일어나는가
situation:
  when_where: >-
    외출 전 상하의를 고르거나 계절 옷을 교체할 때, 여러 수납공간에 나누어 둔 옷 중
    무엇이 있고 어디에 있는지 다시 확인해야 한다. 세탁·수선을 맡긴 옷은 집에 없다는 사실과
    회수 예정일을 별도로 기억해야 한다. 새 옷을 살 때도 이미 가진 비슷한 옷을 확인하기 어렵다.
  trigger: >-
    가장 아픈 순간 가설: 출발 시간이 정해진 외출 직전(등교·출근·약속)에 원하는 옷이 바로 나오지 않을 때.
  frequency: >-
    외출 준비·세탁·계절 정리 때 반복될 것으로 예상하며, 실제 빈도는 사용자 조사로 확인한다.
  evidence_status: hypothesis

# ② 고객: '조금 성가신 90%'가 아니라 '정말 아픈 10%'를 찾는다
customer:
  who: >-
    계절별 옷을 옷장·서랍·보관 박스에 나누어 두고, 외출 준비와 세탁·수선을 스스로 관리하는
    대학생·사회초년생. 특히 자취 공간에 수납이 분산되어 있거나, 옷이 늘면서 보유 목록과 위치를
    기억하기 어려워진 사람을 우선 대상으로 한다.
  painful_segment: >-
    우선 검증할 '아픈 10%' 가설: 최근에 ① 옷을 못 찾아 준비가 늦어졌거나 ② 이미 가진 옷을 다시 샀거나
    ③ 맡긴 옷 회수를 놓친 경험이 있고, 이미 사진·메모 등 대안을 써 본 사람.
    대안을 써 본 적이 없다면 '성가신 90%'로 보고 우선순위를 낮춘다.
  behavior_patterns: >-
    확인할 행동: 외출 전 옷 고르기에 쓰는 시간, 옷을 꺼내 입어 보고 되돌려 놓는 횟수,
    계절 정리 주기, 사진·메모 기록을 시작했다가 그만둔 시점과 이유. (인터뷰로 수집, 현재 미수집)
  note: >-
    처음부터 모든 옷을 등록하는 일에는 부담을 느낄 수 있어, 새 옷이나 자주 입는 옷부터
    점진적으로 시작할 수 있어야 한다.

# ③ 근본 문제: '왜 이것이 문제인가?'를 반복해 파고든 뒤 한발 물러선다 (검증 전 가설)
root_problem:
  statement: >-
    가진 옷을 믿고 바로 꺼내 쓸 수 없어서, 시간이 정해진 외출 준비 시간과 옷에 쓴 돈을 잃는다.
    (옷을 못 찾는 것 자체가 아니라, 그로 인해 더 가치 있는 일에 쓸 시간과 돈이 새는 것이 근본 문제)
  causes:
    - 옷의 제품·세탁 정보, 보관 위치, 세탁·수선 상태가 각각 흩어져 있고 기억이나 개별 메모에 의존한다.
    - 옷을 사거나 정리하고 맡기고 돌려받을 때 생긴 변화가 한 벌의 기록에 이어지지 않아 현재 상태를 다시 확인해야 한다.
    - 수동으로 목록을 만들더라도 촬영·입력·갱신 부담 때문에 실제 옷과 기록이 어긋날 수 있다.
  evidence_status: hypothesis

# ④ 영향: 감정적 영향(사용 여부를 결정) + 정량화 가능한 영향(Value Stick)
impact:
  feelings: >-
    예상 반응: '분명 있는 옷인데 어디 있지?', '지금 꺼내 입을 수 있는 옷인가?'
    답답함, 준비가 늦어지는 조급함, 여러 벌을 꺼내고 다시 정리하는 번거로움이 발생할 수 있다.
    실제 발언은 아직 수집하지 않았다.
  painkiller_or_vitamin: >-
    판단 보류. 외출 직전 지각·중복 구매·미회수 같은 손실이 실제로 반복되면 진통제,
    '있으면 편한 정리 도구' 수준의 반응이면 비타민으로 본다. 인터뷰에서 확인한다.
  losses: >-
    옷 찾기·입어보기·재정리에 쓰는 시간, 세탁·수선 회수 누락, 비슷한 옷의 중복 구매 가능성.
  quantifiable:        # 고통을 숫자로 보여줄수록 지불 의사가 커진다. 값은 측정 전까지 비워 둔다.
    - metric: 외출 전 옷 찾기·고르기에 쓰는 시간 (분/회)
      value: ""
    - metric: 옷을 못 찾아 준비가 늦어진 횟수 (회/월)
      value: ""
    - metric: 이미 가진 옷과 비슷한 옷을 다시 산 경험과 금액 (원/년)
      value: ""
    - metric: 세탁·수선 맡긴 옷 회수를 놓친 횟수 (회/년)
      value: ""
  measured: false     # 시간·비용 미측정, 절감 효과는 검증 후 제시

# ⑤ 현재 대안 / ⑥ 대안의 단점
# 대안이 있다는 것은 문제가 실제로 아프다는 신호다. 장단점을 보고, 우리가 이 대안과의 경쟁에서 이겨야 한다.
alternatives:
  - id: A1
    how: 옷장을 직접 열어 찾고 여러 벌을 꺼내 입어 상하의 조합을 확인한다.
    strength: 따로 준비하거나 배울 것이 없고 실물을 바로 보고 입어 볼 수 있다.
    drawback: >-
      찾을 때마다 확인·착용·재정리를 반복하며, 다른 공간에 있거나 맡긴 옷은 한 번에 파악하기 어렵다.
    why_still_used: 비용이 없고 가장 익숙하다.
  - id: A2
    how: 휴대폰 사진이나 메모로 옷 목록·보관 위치를 따로 기록한다.
    strength: 이미 가진 휴대폰으로 바로 시작할 수 있고, 밖에서도 가진 옷을 확인할 수 있다.
    drawback: >-
      사진·제품 정보·위치를 직접 정리해야 하며, 옷이 이동하거나 상태가 바뀌면 다시 수정해야 한다.
    why_still_used: 정리 앱을 따로 설치·학습하지 않아도 된다. (중도 포기 여부는 인터뷰로 확인)
  - id: A3
    how: 세탁소 영수증과 달력 알림으로 맡긴 옷과 회수일을 관리한다.
    strength: 회수일 알림은 확실하게 받을 수 있다.
    drawback: >-
      영수증·알림이 개별 옷 기록과 연결되지 않으면, 지금 입을 수 있는 옷과 미회수 의류를 함께 보기 어렵다.
    why_still_used: 세탁소에서 받은 영수증을 그대로 쓰면 되어 추가 수고가 적다.

# 우리가 이겨야 하는 기준
must_beat: >-
  A1·A2는 '공짜이고 바로 쓸 수 있다'는 강점이 있다. 우리 해법은 등록·갱신 수고가
  A2보다 적어야 하고, 외출 직전 확인 시간이 A1보다 짧아야 이긴다.

personas:
  - id: P1
    description: >-
      계절 옷을 나누어 보관하고 세탁·수선을 직접 관리하는 대학생·사회초년생.
      외출 준비 때 보유한 옷의 조합과 위치를 확인해야 하는 상황을 우선 검증한다.
  - id: P2
    description: 추가 대상 후보. 수납공간이 분산된 1인 가구와 의류가 많은 사람. 차이는 인터뷰로 확인한다.

experiences:
  - id: E1
    source: 제안자가 제시한 상황
    summary: 보유 목록 파악, 코디 확인, 정리 후 위치 찾기, 세탁·수선 기억의 불편.
    # 직접 관찰 기록 없음. 수집 필요: 일시·장소·당사자 발언·소요 시간·실제 대응
    when: ""
    where: ""
    quote: ""
    duration: ""
    response: ""
  - id: E2
    source: ""
    summary: 비슷하거나 다른 실제 사례 미수집. 팀 외 사용자의 최근 경험과 불편이 없었던 사례를 함께 확인한다.

# '왜 이것이 문제인가?'를 반복해 깊이 파고든 뒤, 한발 물러서 근본 문제(root_problem)를 정한다
five_whys:
  symptom: 옷은 여러 벌 있지만 필요한 옷을 찾고, 지금 입을 수 있는지와 어울리는 조합을 확인하는 데 수고가 든다.
  whys:
    - 보유한 옷의 종류·위치·현재 상태를 한눈에 확인하기 어렵기 때문이다.
    - 옷이 여러 공간에 나뉘고, 착용·세탁·수선에 따라 위치와 상태가 바뀌기 때문이다.
    - 구매 정보, 옷장 위치, 세탁·수선 기록이 각각 다른 곳에 남거나 기억에 의존하기 때문이다.
    - 한 벌의 정보를 직접 촬영·입력하고 변동 때마다 별도로 수정해야 하므로 기록 유지에 부담이 생길 수 있다.
    - 일상적인 구매·보관·관리 행동이 한 벌의 최신 기록으로 이어지는 과정이 부족하다는 가설이다. (3~5단계는 인터뷰로 확인)
  step_back: >-
    원인을 끝까지 파고들면 '기록 연결 부족'이지만, 고객 입장에서 한발 물러서면
    잃는 것은 외출 준비 시간과 옷에 쓴 돈이다. 이를 root_problem으로 둔다.
  status: hypothesis

sources: []           # 외부 자료 URL 없음. 출처 없는 수치는 쓰지 않는다.

# 해법은 문제 정의 이후에 정한다. 솔루션부터 생각하지 않는다.
solution_paths:
  - id: 1
    title: 택 인식 + 사용자 확인 + 통합 기록
    status: recommended      # 팀 확정 전 권고안
    description: >-
      택 OCR로 등록을 돕고 제품 후보를 사용자가 확인한다. 같은 의류 ID로 분류·코디·위치·관리 상태를
      연결한다. 검색 실패도 직접 등록으로 마칠 수 있다.
  - id: 2
    title: 사진·정보를 전부 수동 입력하는 옷장 단독안
    status: on_hold
    description: >-
      빠르게 구현할 수 있지만 최초 입력과 갱신 부담이 크다. AI 검색이 실패할 때의 대체 경로로는 유지한다.
  - id: 3
    title: 정밀 3D 가상착의 중심 서비스
    status: on_hold
    description: >-
      택·상품 사진만으로 실제 패턴·물성·뒷면을 확보하기 어렵다. 이번에는 회색 체형모형과 의류 템플릿으로
      상하의 조화·길이를 비교하는 미리보기를 구현한다.

why_ours: ""          # 학생 말로 작성 필요: 기존 대안(A1~A3) 대신 이 해법이어야 하는 이유 (must_beat 기준)

insight:
  claim: >-
    사용자는 '무슨 옷이 있는가'뿐 아니라 '지금 입을 수 있는가, 어디서 꺼내는가'까지 이어서 확인할 필요가
    있다는 가설을 세웠다.
  evidence: >-
    현재 근거는 제안자가 설명한 보유 목록·코디·위치·세탁·수선의 불편이다. 직접 관찰·인터뷰·시간 측정은
    아직 없으므로 일반 사용자에게 확인해야 한다.
  design_decision:
    # 문제를 해결할 최소한의 스펙만 남긴다
    build:
      - 택 촬영·확인형 등록
      - 자유 분류
      - 회색 3D 코디
      - 배치·위치 찾기
      - 세탁·수선 기록
    principle: 제품 확정과 실제 배치는 사용자가 확인한다.
    out_of_scope:
      - 정밀 핏 보장
      - 실물 자동 추적

# 기능 명세(입력·결과·완료 조건)는 2-C 단계에서 작성
features: []

checks:
  - "①→③ 상황과 원인: 외출·계절 정리 중 정보·위치·상태 단절 확인"
  - "②→④ 대상과 영향: 관리 책임이 있는 사용자에게 번거로움 검증"
  - "② 아픈 10%: 최근 손실 경험이 있고 대안을 써 본 사람이 실제로 있는지 확인"
  - "③→④ 원인과 영향: 기록 연결 후 찾기·확인 수고가 줄어드는지 측정"
  - "④ 진통제 여부: quantifiable 지표를 인터뷰로 채우고 비타민인지 진통제인지 판정"
  - "⑤→⑥ 대안과 단점: 수동 확인·기록의 반복 부담 비교, must_beat 기준으로 우리 해법이 이기는지 확인"
