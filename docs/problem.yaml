verification_plan:
  summary: 자취생 8명 인터뷰, 1주 관찰, 기존 앱·서비스 조사, 기록 시간 실측으로 [ ] 칸을 모두 채운다.
  evidence_to_collect:
    - id: E2
      what: 자취생 인터뷰 [8명, 일시] — 장면별 최근 실패 에피소드, 근본 원인 질문, 감정 원문
      status: 미수집
    - id: E3
      what: 1주 관찰 기록 [n명] — S1의 옷 찾기 시간·횟수 (S2는 주기가 길어 인터뷰 회상으로만 잰다)
      status: 미수집
    - id: E4
      what: 디지털 옷장 앱 2~3개 직접 사용 + 앱스토어 리뷰의 이탈 이유 (이탈 비율은 리뷰가 아니라 E2로 잰다)
      status: 미수집
    - id: E5
      what: 모바일 세탁·보관 서비스 2~3개 — 맡긴 옷 사진 제공, 보관 기능 여부
      status: 미수집
    - id: E6
      what: 기록 시간 실측 — 메모 앱 한 줄 기록 vs 박스 QR 체크 기록, 등록된 옷 1~3벌 기준
      status: 미수집
    - id: E7
      what: 기록 정확도 — 기록이 있는 참여자의 기록과 실제 위치 대조
      status: 미수집
  recruiting: |-
    8명 섭외. 필수 조건은 customer.required_conditions(자취·기숙사 1인 가구, 옷장 외 보관 장소 2곳 이상).
    구성 목표: P1 5명(그중 본가가 먼 사람 3명 이상), P2 3명.
    세탁소 이용·기록 시도 여부는 선별하지 않고 기록만 해 두고, 나중에 그룹을 나눠 비교한다.
  interview_questions:
    - 최근 한 달 안에 입으려던 옷을 못 찾았던 때를 그대로 얘기해 달라. (S1)
    - 그 옷은 실제로 어디 있었나? 찾는 데 얼마나 걸렸고, 결국 어떻게 했나?
    - 지난 환절기에 박스·본가의 옷을 꺼낼 때, 안에 뭐가 있는지 알고 있었나? 두고 오거나 다시 산 옷이 있다면 얼마였나? (S2)
    - 최근 3개월 동안 세탁소·수선집에 맡긴 옷을 늦게 찾거나 잃은 적이 있나? (S3)
    - 본가에 둔 옷이 필요할 때는 어떻게 하나?
    - 마지막으로 옷을 박스·본가·세탁소로 보낸 때를 떠올려 달라. 그때 뭔가 기록했나? 안 했다면 왜? (근본 원인)
    - 옷 사진이나 메모가 있다면 지금 보여 줄 수 있나? (기록 정확도·조회 비용 확인)
    - 그때 기분이 어땠나? (감정 원문)
  method:
    - 발언 원문 기록 (일시·당사자·소요 시간).
    - 해법은 문제 질문이 모두 끝난 뒤에만 보여 준다. 앞에서 보여 주면 답이 해법 쪽으로 쏠린다.
    - 결과로 scenes 빈도, measurable_impact, emotional_impact, alternatives의 [ ] 칸, insight 근거를 채운다.
    - 결과가 가설과 다르면 statement와 root_problem부터 다시 쓴다.
  decision_rules:
    - target: 문제 진행 여부
      rule: 8명 중 5명 이상이 S1(최근 한 달) 또는 S2(지난 환절기)를 겪었으면 이 문제로 진행한다. 미만이면 S3(세탁 회수)로 좁히고 P2 중심으로 다시 검토한다.
    - target: 근본 원인
      rule: 근본 원인 질문에서 다수가 '그때 기록하지 않았다'고 답하면 유지한다. 다수가 '기록은 했는데 못 찾았다'고 답하면 조회 비용으로 교체하고, 해법 중심을 R11에서 R04(검색)로 옮긴다.
    - target: 해법 기준
      rule: E6에서 QR 체크 기록이 메모 앱 한 줄보다 오래 걸리면 입력 흐름을 다시 설계한다.

five_whys:
  symptom: 외출 직전 입으려던 옷이 옷장에 없어 한참 뒤지다가, 세탁소에 맡겼거나 박스·본가에 있다는 걸 뒤늦게 떠올리고 그 옷을 포기한다.
  whys:
    - 그 옷이 지금 어디 있는지 모른다.
    - 옷장 밖(박스·본가·세탁소)으로 옮긴 사실이나 옮긴 곳을 기억하지 못한다.
    - 옮길 당시 어디에도 남기지 않았다. 큰 정리 때 남긴 기록이 있어도 이후 한두 벌씩 옮긴 것은 반영되지 않았다.
    - 옮기는 순간은 손이 바쁘고, 몇 주 뒤에도 기억날 거라고 생각한다.
    - 기록 비용은 지금 들고 이득은 나중에 오므로, 그 순간엔 기록하지 않는 게 합리적이다.
  root_cause: 옮기는 순간에 기록할 계기가 없고, 비용은 지금·이득은 나중이라는 시차 때문에 그 순간엔 기록하지 않는다. (3~5단계는 근본 원인 질문으로 검증)

solution_paths:
  - path: 옮기는 단위 기록 (박스 라벨 QR, 세탁소 영수증 촬영 → 옷 묶음 등록)
    status: chosen
    reason: 옷 한 벌씩이 아니라 '옮기는 단위'로 기록해 비용을 줄이고, 박스 라벨과 영수증이 옮기는 순간의 계기가 된다. 택 OCR은 첫 등록 보조로만 쓴다.
  - path: 모든 옷을 한 벌씩 촬영·입력
    status: deferred
    reason: 기존 옷장 앱과 같은 방식이라 첫 등록과 갱신 부담으로 이탈 가능성이 크다. 묶음에 넣을 미등록 옷을 사진 한 장으로 추가하는 용도로만 남긴다.
  - path: 3D 가상착의·코디
    status: rejected
    reason: 이번에 정의한 문제(위치·상태 모름)와 무관하다.

# 해법 기준과 선택한 해법의 동작. 대시보드 형식의 solution_paths와 분리해 둔다.
# 근본 원인에서 해법·결과로 이어지는 흐름.
solution_logic: |-
  근본 원인: 옮기는 순간에 기록할 계기가 없고, 비용은 지금·이득은 나중이라 옮길 때 아무것도 남기지 않는다.
  → 단서: 기존 대안 중 갱신이 끊기지 않는 건 세탁소 영수증뿐이다. 옮기는 순간 손에 쥐어지는 물건이 기록이 되기 때문이다.
  → 해법 원리: 기록의 계기를 옮기는 순간 이미 손에 있는 물건(박스 라벨, 영수증)에 붙이고, 그 자리에서 3초 안에 끝나게 한다. 그러면 큰 정리뿐 아니라 일상적인 이동까지 기록이 남는다.
  → 해법: 옷을 '옮기는 단위'(박스 하나, 세탁소에 한 번 맡기는 묶음)로 묶어, 박스 라벨 QR이나 세탁소 영수증을 한 번 찍는 것으로 넣을 때와 꺼낼 때의 위치·상태를 기록한다.
  → 결과: 외출 직전 '그 옷이 지금 어디 있고 바로 입을 수 있는지'를 옷장을 뒤지지 않고 확인하고, 그 기록을 믿는다.
solution_criterion: |-
  해법은 세 가지를 모두 만족해야 한다.
  1. 계기: 옮기는 순간 이미 손에 있는 물건(박스 라벨, 세탁소 영수증)이 기록을 떠올리게 한다.
  2. 속도: 등록된 옷 1~3벌을 묶음에 넣거나 빼는 기록이 QR 스캔부터 저장까지 3초 안에 끝난다(E6로 실측).
  3. 정확도(결과 지표): 찾는 순간 기록과 실제 위치가 맞는다. [2주 사용 테스트 후 일치율 _%, 기준선은 measurable_impact의 기록 정확도]
chosen_approach:
  summary: 옷을 '옮기는 단위'(박스 하나, 세탁소에 맡기는 묶음)로 묶어, 넣을 때와 꺼낼 때 한 번의 짧은 동작으로 위치·상태를 남긴다. 찾을 때는 '지금 어디 있고 바로 입을 수 있는지'를 바로 확인한다.
  flow_when_moving: |-
    넣을 때(박스에 넣기·세탁소에 맡기기·본가에 두기)
    1. 묶음을 연다: 박스 라벨 QR을 찍거나 새 묶음을 만든다. 세탁소면 영수증을 찍는다.
    2. 들어가는 옷을 담는다: 등록된 옷은 체크로, 등록하지 않은 옷은 사진 한 장으로 묶음에 넣는다.
    3. 목적지와 날짜를 확인한다: 보낸 곳(박스 A·본가·세탁소)과 날짜는 기본값으로 채워져 있어 확인만 한다.
    꺼낼 때(박스에서 꺼내기·본가에서 가져오기)
    - 박스 QR을 찍으면 그 박스의 옷 목록이 뜬다. 꺼낸 옷을 체크하면 위치가 '옷장'(기본값)으로 바뀐다.
    세탁소에서 찾을 때
    - R08의 '회수 완료'를 누르면 기존 위치를 제안받고, '재배치 확인'으로 보관 중이 된다.
    등록된 옷이라면 QR 찍기 → 체크 → 저장이 3초 안에 끝나는 것이 목표다(실측·검증 대상).
  flow_when_finding: |-
    찾는 순간(외출 직전·계절 교체·회수)에는 남겨 둔 기록을 본다.
    - 옷을 검색하면 '옷장 A → 왼쪽 행거' 또는 '박스 A / 세탁소 / 본가'처럼 현재 위치와 바로 입을 수 있는지(세탁·수선 중 여부)를 보여 준다.
    - 집 밖·박스 속 옷만 모아 보거나, 세탁소에 맡긴 옷의 회수 예정·기한 지남을 한눈에 본다.
    - 묶음마다 마지막 기록일을 보여 줘, 기록을 얼마나 믿어도 되는지 판단할 수 있게 한다.
  how_it_meets_criterion: 계기는 박스 라벨과 영수증이 맡고, 속도는 묶음 단위 기록과 목적지·날짜 기본값이 맡는다. 꺼낼 때도 같은 QR로 기록해 일상적인 이동까지 반영되므로 정확도가 유지된다. 택 OCR은 첫 등록에서만 보조로 쓴다.
  out_of_scope: 모든 옷의 일괄 등록, 정밀 핏 보장, 3D 가상착의·코디는 이번 범위에서 다루지 않는다.
  maps_to_features: [R11, R08, R07, R09, R01]
  open_questions:
    - 3초 목표가 실제로 달성되는지(E6), 옮기는 순간 사용자가 실제로 QR을 찍는지(2주 사용 테스트) 검증이 필요하다.
    - 본가로 옷을 가져갈 때는 박스·영수증 같은 계기 물건이 없을 수 있다. 본가행 가방·박스에도 라벨을 붙이는 방식이 통하는지, 다른 계기가 필요한지 인터뷰로 확인한다. 초기 고객(본가가 먼 자취생)에게 가장 중요한 빈칸이다.
    - 박스 라벨 QR과 세탁소 영수증 촬영 중 어느 입력이 더 부담이 적은지 사용자 테스트로 확인한다.

insight:
  claim: (가설) 사람들은 기록을 '못' 하는 게 아니라, 옮기는 순간엔 기록할 '계기와 이유가 없어서' 안 한다. 그래서 더 꼼꼼한 옷장 앱이 아니라, 옮기는 순간 이미 손에 있는 물건(박스 라벨, 영수증)을 기록의 계기로 만드는 쪽이 답이다.
  evidence: "현재 근거는 팀 제안자 1인 경험(E1)과, 기존 대안 중 세탁소 영수증만 갱신이 끊기지 않는다는 관찰뿐이다. [근본 원인 질문: 8명 중 _명이 마지막으로 옷을 옮길 때 기록하지 않음, 주된 이유 _] (미수집)"
  note: 인터뷰 결과로 claim을 확인하거나 교체한다. 근거를 채우지 못하면 제출 전에 이 칸을 지운다.
  design_decision: 옮기는 단위(박스·세탁소·본가) 기록을 중심에 두고, 꺼낼 때도 같은 QR로 기록한다. 택 OCR은 첫 등록 보조로만 쓴다. 3D 가상착의·코디와 정밀 핏 보장은 이번 범위에서 제외한다.

# features: 좁힌 문제(집 밖·박스 속 옷의 위치·상태)에 맞춰 3D 코디(옛 R05)와 코디 추천(옛 R06)을 제외했다.
# R-id는 추적을 위해 유지하고, 제외한 번호는 비워 둔다.
# 역할 구분(개발 순서도 이 순서):
#   핵심 — 문제를 직접 해결: R11, R08, R07(위치 경로), R09
#   기반 — 서비스가 돌아가기 위한 조건: R00, R10
#   보조 — 첫 등록·탐색을 돕지만 기존 옷장 앱과 겹치는 영역: R01, R02, R03, R04, R07(배치 추천)
features:
  # 기반
  - id: R00
    name: 회원가입·로그인과 계정별 옷장 분리
    input: 이메일·비밀번호(회원가입, 로그인), 로그아웃 버튼
    output: 계정별로 의류·공간·묶음·관리 기록이 서버에 저장되고, 다른 계정의 자료는 보이거나 바뀌지 않는다. 로그인하지 않은 사람은 첫 화면에서 서비스 소개와 예시 옷장 둘러보기만 볼 수 있다.
    done: 회원가입 후 바로 로그인되어 빈 옷장이 보이고, 로그아웃 후 다시 로그인해도 등록한 옷이 그대로 있다. 비밀번호가 틀리면 로그인되지 않고 이유를 보여 준다. 다른 계정의 의류 주소를 열면 404가 된다.
  # 보조 — 첫 등록, R11 흐름 2단계의 미등록 옷 추가에 쓰인다.
  - id: R01
    name: 택 사진 등록·분석·수정(첫 등록 보조)
    input: 한 벌의 택 사진 1장 이상(세탁·혼용률 택, 브랜드·품번 택을 여러 장 묶을 수 있음)
    output: AI가 읽은 브랜드·품번·표기 사이즈·원산지·소재(겉감·안감 구분, 혼용률)·세탁 지시를 원문과 함께 보여 주고, 읽지 못한 값은 '확인 필요'로 표시한다. 사용자가 고친 값이 저장되고 원본 택 사진도 그 의류에 남는다. 미입력이어도 등록을 마칠 수 있다.
    done: 택 사진 2장을 한 의류에 묶어 분석하면 추출값과 원문이 표시되고, 값을 고쳐 저장하면 옷 상세에서 고친 값과 택 사진 2장이 보인다. AI 호출이 실패하면 입력 내용을 유지한 채 재시도와 직접 입력을 고를 수 있다.
  # 보조
  - id: R02
    name: 제품 후보 웹 검색·확정·대체 등록
    input: 택에서 읽은(또는 사용자가 고친) 브랜드와 품번
    output: 웹 검색과 상품 페이지 수집으로 찾은 제품 후보 카드(상품명·대표 이미지·색상·출처 URL·조회 시점·일치 근거)를 보여 준다. 사용자가 실제 보유 제품을 고르면 후보가 그 의류에 연결되고, 고르지 않은 후보는 의류 정보에 섞이지 않는다. 결과가 없거나 검색이 실패하면 직접 촬영 사진과 택 정보로 등록을 계속한다.
    done: 후보를 하나 선택해 저장하면 옷 상세에 상품명·출처 URL·조회 시점이 보인다. 후보가 없거나 검색이 실패해도 '직접 입력으로 계속'을 눌러 등록을 끝낼 수 있다. 정확도 퍼센트 같은 보정되지 않은 점수는 표시하지 않는다.
  # 보조 — 찾는 순간 옷을 알아보기 쉽게 한다.
  - id: R03
    name: 대표 이미지 정리
    input: 선택한 제품 이미지 또는 사용자가 직접 촬영한 옷 사진
    output: 배경 제거, 중앙 정렬, 동일한 정사각 캔버스와 여백을 적용한 대표 이미지가 옷장 목록에 쓰이고 원본은 따로 남는다. 로고·무늬·색은 바꾸지 않는다.
    done: 테스트 사진을 올리면 정리된 대표 이미지와 원본을 나란히 볼 수 있다. 처리에 실패하면 원본이 대표 이미지로 유지되고 '다시 처리'를 누를 수 있다.
  # 보조 — 단, 근본 원인이 조회 비용으로 밝혀지면 핵심으로 올린다(verification_plan.decision_rules).
  - id: R04
    name: 다중 속성 분류와 검색
    input: 보기 기준 선택(종류·계절·브랜드·위치·상태·사용자 컬렉션), 검색어, 분류 수정
    output: AI가 처음 제안한 분류(종류·세부 종류·계절·색상)를 사용자가 수정·추가·삭제할 수 있고, 같은 옷이 여러 계절·컬렉션에 동시에 속한다. 사용자가 고친 값은 AI 재분석으로 덮어쓰지 않는다. '집 밖/박스 속' 같은 위치·상태 기준으로도 묶어 볼 수 있다.
    done: 내 옷장에서 '계절'·'브랜드'·'위치' 보기로 바꾸면 그 기준으로 묶여 보이고, 옷의 계절을 고쳐 저장한 뒤 새로고침해도 고친 값으로 묶인다.
  # R05(체형 비율 반영 3D 코디) — 제외: 3D 가상착의·코디는 정의한 문제(위치·상태 모름)와 무관해 범위에서 뺌.
  # R06(보유 의류 기반 AI 코디 추천) — 제외: 코디 확인은 별도 문제로 분리.
  # 핵심(위치 경로) + 보조(배치 추천)
  - id: R07
    name: 수납 공간 등록·위치 찾기·배치 추천
    input: 공간 이름과 상위 공간(예 옷장 A > 왼쪽 행거, 박스 A, 본가), 유형(걸기·접기·장기보관), 대략적인 수용 개수, 자주 입는 정도
    output: 옷을 검색하면 '옷장 A → 왼쪽 행거' 또는 '박스 A'·'본가'처럼 현재 위치 경로를 보여 준다. 보조 기능으로, 의류 종류·계절·자주 입는 정도·공간 유형·용량으로 만든 배치 추천안을 보여 주고 사용자가 수정할 수 있다. 추천안은 미확정으로 남고 '배치 완료'를 눌러야 현재 위치가 바뀐다. 용량을 넘으면 초과 수량을 표시한다.
    done: 내 옷장에서 옷을 검색하면 확정된 위치 경로가 보인다. 배치 추천을 만든 직후에는 옷 상세의 위치가 바뀌지 않고, '배치 완료'를 누른 뒤에 바뀐다. 용량을 넘긴 공간에는 초과 수량이 표시된다.
  # 핵심 — S3
  - id: R08
    name: 세탁·수선·회수 관리
    input: 상태(세탁 대기·세탁 중·수선 중), 자택·업체 구분, 업체명, 수선 내용, 맡긴 날짜, 회수 예정일. 세탁소 영수증으로 만든 묶음(R11)은 이 값이 기본값으로 채워진다.
    output: 관리함에 '오늘 회수 예정'과 '기한 지남' 목록과 배지가 접속 시점 날짜로 계산되어 보인다. 회수 완료를 누르면 진행 중 목록에서 빠지고 기록은 이력으로 남으며, 옷은 '회수 완료·위치 미확인' 상태로 기존 위치를 제안받는다. '재배치 확인'을 눌러야 보관 중으로 바뀐다.
    done: 회수 예정일이 지난 기록은 '기한 지남'에 보이고, 예정일을 미래로 바꾸면 그 목록에서 빠진다. 회수 완료를 누르면 진행 중 목록에서 사라지고 옷 상세 이력에 남으며, 재배치 확인 후 상태가 '보관 중'으로 표시된다.
  # 핵심 — 기록을 믿을 수 있게 하는 조건
  - id: R09
    name: 일관된 영속 저장
    input: 등록·분류·배치·묶음 기록·관리 상태 변경
    output: 등록→위치→상태→묶음이 같은 의류 ID를 참조하고, 한 화면에서 바꾼 상태가 다른 모든 화면에 같은 값으로 보인다.
    done: 옷을 세탁 중으로 바꾸면 내 옷장 카드·옷 상세·옷장 지도·관리함에서 모두 세탁 중(사용 불가)으로 반영된다. R11로 박스에 넣거나 꺼낸 옷도 모든 화면에 같은 위치로 보이고, 새로고침 후에도 유지된다.
  # 기반
  - id: R10
    name: 공개 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 잘못된 입력, 외부 AI·검색 장애
    output: 공개 HTTPS 주소에서 스마트폰과 PC 모두 핵심 흐름을 쓸 수 있다. 필수 값이 비면 저장하지 않고 이유를 보여 주며, 외부 호출 실패 시 입력을 유지한 채 재시도·수동 입력 경로를 준다. 없는 주소는 404 화면을 보여 준다.
    done: 휴대폰 화면과 PC 화면에서 등록·옷장·옷장 지도·관리함·묶음 기록이 깨지지 않고 사용된다. 별칭 없이 저장을 누르면 저장되지 않고 이유가 보인다.
  # 핵심 — 선택한 해법 자체
  - id: R11
    name: 옮기는 단위(박스·세탁소·본가) 묶음 기록
    input: 박스 라벨 QR 또는 세탁소 영수증 촬영, 넣거나 꺼낼 옷 선택(또는 묶음 통째), 보낸 곳(박스·본가·세탁소)과 날짜
    output: 여러 벌을 한 번에 '넣음' 또는 '꺼냄'으로 기록해 각 옷의 현재 위치·상태가 바뀐다. 보낸 곳과 날짜는 기본값으로 채워 옮기는 순간의 입력을 짧게(목표 3초) 끝낸다. 영수증·QR 원본은 그 묶음에 남고, 묶음마다 마지막 기록일이 보인다. 세탁소로 보낸 묶음은 R08 회수 관리로 이어진다.
    done: |-
      박스 라벨을 찍고 등록된 옷 3벌을 체크해 '박스 A에 넣음'을 저장하면, 각 옷 상세의 위치가 '박스 A'로 바뀌고 '집 밖/박스' 보기에 함께 보인다.
      같은 QR을 다시 찍어 1벌을 '꺼냄'으로 저장하면 그 옷의 위치가 '옷장'으로 바뀌고 박스 A 목록에서 빠진다.
      세탁소 영수증을 찍어 묶음을 만들면 그 옷들이 '세탁 중'이 되고 회수 예정일이 관리함에 나타난다.
      등록된 옷 1~3벌 기준으로 QR 스캔부터 저장까지의 시간을 측정해 남긴다(목표 3초, E6 비교 자료로 쓴다).
  - id: R12
    name: 현재 위치 날씨와 지금 꺼낼 수 있는 옷
    input: 사용자가 허락한 현재 위치(위도·경도), 기상청 단기예보 조회서비스의 초단기실황·단기예보
    output: 내 옷장 맨 위에 현재 기온·하늘·강수와 오늘 최저·최고기온, 강수확률을 보여 주고, 기온에 맞는 계절의 옷 중 지금 집 안에 있어 바로 꺼낼 수 있는 옷을 보관 위치 경로와 함께 보여 준다. 박스 속·집 밖·세탁 중인 옷은 넣지 않는다. 카드 배경은 날씨(맑음·구름·흐림·비·눈)와 밤낮에 따라 바뀌고, 비·눈이나 강수확률 60% 이상·최저 5°C 미만이면 겉옷을 먼저, 최고 28°C 이상이면 겉옷을 빼고, 일교차 10°C 이상이면 겉옷을 하나 넣으며 각 옷에 고른 이유를 붙인다. 기상청 키는 서버에만 두고, 위치를 허락하지 않았거나 날씨를 받지 못하면 그 이유를 보여 주며 옷장은 그대로 쓸 수 있다.
    done: 위치를 허락하면 현재 기온과 오늘 최저·최고기온이 보이고, 그 기온에 맞는 계절의 집 안 옷이 위치 경로와 함께 보이며, 눌러서 옷 상세로 간다. 위치를 거부하거나 기상청 응답이 없으면 안내 문구만 보이고 다른 기능은 영향을 받지 않는다.
