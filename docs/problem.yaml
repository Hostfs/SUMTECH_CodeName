# 옷결 문제정의와 기능 명세
# 출처: 팀 문제정의 캔버스 수정안(우성, 2026-10-29)과 서비스 구체화 문서(SUMTECH_옷결_서비스_구체화.md).

statement: |-
  좁은 자취방 때문에 옷을 본가·보관 박스·세탁소에 나눠 두는 대학생·사회초년생은, 환절기나 중요한 일정 직전에 입으려던 옷이 어디 있는지 확인하지 못해 시간을 허비하거나, 계획한 옷을 포기하거나, 같은 옷을 다시 산다.
    이들은 사진첩·메모·세탁소 영수증으로 위치를 남기지만, 기록 수단이 흩어져 있고 옷을 옮기는 순간에는 짐을 드느라 기록할 여유가 없어, 기록은 몇 주 만에 실제와 어긋난다.

canvas:
  context: |-
    문제가 터지는 순간은 세 장면이다.

    외출 직전: 입으려던 옷이 옷장에 없다. 박스, 세탁소, 본가 중 어디 있는지 기억나지 않아 다른 옷으로 타협하거나 늦는다.
    계절 교체: 본가나 박스에 무엇을 넣어 뒀는지 몰라 필요한 옷을 두고 오거나, 있는 옷을 다시 산다.
    세탁·수선 회수: 맡긴 사실을 잊거나 영수증을 잃어, 필요한 날 그 옷이 없다.
    세 장면 모두 원인은 한발 앞선 순간, 즉 옷을 옮기고, 포장하고, 맡길 때 기록이 남지 않은 데 있다.

  customer: |-
    핵심 고객은 좁은 방 때문에 옷을 옷장 밖으로 내보내야 하는 자취 대학생·사회초년생이다. 옷이 옷장 하나에 다 들어가는 사람은 장면 1·2를 겪지 않으므로 핵심 고객에서 제외한다. 이들도 장면 3은 겪을 수 있다.
    이들이 놓치는 건 옷장 안의 옷이 아니라, 박스에 넣거나 본가에 두거나 세탁소에 맡겨 '눈에 안 보이는 곳으로 간 옷'이다.
    초기 고객 (가장 아픈 사람): 본가가 멀어 옷을 두고 오면 몇 달간 가져올 수 없는 지방 출신 자취생
    
  root_problem: |-
    사람들은 옷을 옮기는 순간에는 기록할 이유를 느끼지 못하고, 찾는 순간에야 기록이 필요해진다.
    박스에 넣거나 세탁소에 맡길 때는 손이 바쁘고 "기억나겠지"라고 생각한다. 기록이 필요해지는 건 몇 주~몇 달 뒤인데, 그때는 이미 기억이 흐려졌다.
    계절 정리처럼 큰 이벤트 때는 사진·메모를 남기기도 하지만, 한두 벌씩 움직이는 일상적인 이동은 기록되지 않는다. 그래서 기록은 곧 실제와 어긋나고, 한 번 틀린 기록은 신뢰를 잃어 결국 다시 뒤지게 된다.
    즉 핵심은 기록 비용은 옮기는 순간에 치르고 이득은 찾는 순간에 돌아오는 시차다. 옷이 여러 곳에 흩어진 것은 이 문제의 조건일 뿐, 원인이 아니다.
  impact:
    feeling: |-
      외출 직전의 조급함, 박스를 다 뒤집은 뒤 다시 넣는 허탈함, 맡긴 옷을 잊고 돈만 날린 아까움.
    measurable: |-
     대상: ② 고객 조건을 만족하는 n명. 기록 시도 경험이 있는 사람과 없는 사람을 나눠 비교한다.

        측정 지표(값은 조사 후 채우고, 못 채우면 제출 전에 지운다):

        - 옷 찾기 시간과 빈도 (장면 1): 1주 기록 → [평균 _분/회, _회/주]
        - 계획한 옷 포기 (장면 1, 최근 한 달): 인터뷰 → [n명 중 _명]
        - 박스·본가에 있는 옷을 모르고 재구매 (장면 2, 지난 환절기): 인터뷰 → [n명 중 _명, 평균 _원]
        - 세탁·수선 회수 지연 / 분실 (장면 3, 최근 3개월): 인터뷰 → [지연 _명 / 분실 _명]
        - 기록 정확도: 기록이 있는 사람의 기록과 실제 위치 대조 → [일치율 _%]
  alternatives:
  - how_used: 옷장·박스를 열어 확인한다.
    shortcoming: 박스는 전부 꺼내 봐야 알고, 본가·세탁소에 있는 옷은 확인할 수 없다.
    why_ours: 열어 보지 않아도 박스 안과 집 밖의 옷을 확인할 수 있다. (단, 기록이 정확할 때만 — 2번이 전제)
  - how_used: 본가 가족에게 전화로 묻고 택배를 부탁한다.
    shortcoming: 가족이 대신 찾아야 하고, 부탁할 때마다 부담과 미안함이 든다.
    why_ours: 본가에 무엇을 두고 왔는지 묻기 전에 스스로 확인할 수 있다.
  - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
    shortcoming: 큰 정리 때는 적지만, 한두 벌씩 옮길 때는 적을 생각을 못 해 금방 틀어진다.
    why_ours: 옮기는 순간에 기록할 계기를 주고, 그 자리에서 바로 끝낼 수 있게 한다.
  - how_used: 세탁소 영수증으로 맡긴 옷을 관리한다.
    shortcoming: "코트 1점"처럼만 적혀 어떤 옷인지 모르고, 잃어버리면 기록이 사라진다.
    why_ours: 영수증 사진 한 장으로 그 옷의 기록에 세탁 상태와 회수일이 붙는다.
  - how_used: 모바일 세탁·보관 서비스를 쓴다.
    shortcoming: "[미확인 — 맡긴 옷 사진, 보관 기능 여부를 직접 확인]"
    why_ours: "[확인 후 작성]"
  - how_used: 디지털 옷장 앱에 옷을 등록하고 코디한다.
    shortcoming: 등록·코디 중심이라 위치·세탁 상태 관리가 약하다. "[미수집 — 앱 2~3개 직접 사용, 리뷰 속 이탈 이유]"
    why_ours: 기능이 아니라 갱신이 끊기지 않는 방식에서 다르다.
  - how_used: 찾기를 포기하고 비슷한 옷을 다시 산다.
    shortcoming: 돈이 들고, 같은 옷이 쌓여 수납 문제가 더 심해진다.
    why_ours: 이미 있는 옷을 사기 전에 확인할 수 있다.
must_beat: |
  기존 대안 중 갱신이 끊기지 않는 건 세탁소 영수증뿐이다. 사용자가 아니라 남이 옮기는 순간에 기록을 만들어 주기 때문이다.
  우리 해법은 두 가지를 해내야 이긴다.
  (1) 계기 — 옷을 옮기는 순간 기록할 생각이 들게 한다.
  (2) 속도 — 그 자리에서 3초 안에 끝난다.
  3초는 가설이며, 현재 메모 앱으로 한 줄 적는 시간과 비교해 검증한다.

personas:
  - id: P1
    description: 23세, 자취 2년 차 대학생. 원룸 옷장 하나에 다 안 들어가 겨울옷은 침대 밑 박스, 일부는 본가에 둔다. 코트·정장은 세탁소에 맡긴다. 우선 검증 대상.
    source: 팀 문제정의 캔버스 수정안(가설, 인터뷰로 검증 예정)
  - id: P2
    description: 입사 1~2년 차 사회초년생. 출근복이 늘어 세탁소 이용이 잦다. P1과의 차이(세탁소 비중)는 인터뷰로 확인한다. 추가 후보.
    source: 팀 문제정의 캔버스 수정안(가설, 인터뷰로 검증 예정)

experiences:
  - id: E1
    when: null
    what_happened: 팀 제안자 본인 경험. 박스 속 옷을 파악하지 못하고, 세탁소 회수를 놓친 적이 있다. (1인)
    workaround: null
