five_whys:
  symptom: 계절이 바뀐 뒤 외출 준비 중 박스·본가에 둔 옷을 바로 찾지 못해 시간을 쓰거나 다른 옷을 입거나 다시 산다.
  whys:
    - 입으려는 옷이 어느 보관 장소에 있는지 바로 확인하지 못한다(E1·E2·E6·E7).
    - 옷을 옮긴 뒤 시간이 지나 박스 위치 또는 본가에 보낸 사실을 기억하지 못한다.
    - 찾을 때 참고할 사진·목록이 없고, 자취방에서 직접 뒤지는 행동에 의존한다.
    - 이현준은 기억할 것으로 생각했고, 김근호는 본가 보관에 별도 목록이 필요하다고 느끼지 못했으며, 김우성은 정리를 먼저 끝내려 했고, 박규성은 여러 벌을 한 벌씩 기록하는 일이 번거롭다고 생각했다. 이는 설정 내 각 인물의 설명이며 공통 원인을 확정한 결과는 아니다.
    - 원인 가설은 이동 정보가 기억에만 의존한다는 것이다. 기록 부담·필요성 인식·재조회 어려움 중 무엇이 이를 지속시키는지는 검증하지 않았다. 다섯 단계 전체를 확인된 인과관계로 취급하지 않는다.

solution_paths:
  - path: 박스·본가로 옮기는 단위의 묶음 기록과 보관 위치 조회
    status: chosen
    reason: 핵심 문제의 위치 확인 단서 부족에 대응하는 시제품 경로로 선택했다. QR·다중 선택이 메모보다 유리하다는 결론은 아니다. 초기 등록, 박스 라벨 부착, 이동 기록, 꺼낼 때의 갱신을 포함해 부담을 비교하고, 일정 기간 뒤 위치를 정확히 찾는지 확인해야 한다. 세탁 영수증·회수 관리는 E5에 대응하는 보조 경로다.
  - path: 모든 옷을 한 벌씩 촬영·입력하는 옷장 앱
    status: deferred
    reason: 첫 등록과 개별 위치 갱신 부담이 크다. 묶음 이동 중 미등록 옷을 즉시 추가하는 보조 경로로만 남긴다.
  - path: 3D 가상착의·코디 추천
    status: rejected
    reason: 옷의 보관 위치와 착용 가능 상태를 확인하는 핵심 문제와 직접 연결되지 않아 범위에서 제외했다.

insight:
  claim: 계절 옷을 옮길 때는 보관 장소를 기억할 것으로 생각하지만, 다시 입는 시점에는 그 기억만으로 옷의 위치를 확인하기 어렵다. 본가에 둔 옷은 자취방을 더 찾아도 발견할 수 없고, 보유 사실까지 잊으면 중복 구매로 이어진다. 이는 설정 내 사건의 공통 패턴이며 실제 고객 전체에 대한 조사 결론은 아니다.
  evidence: |-
    E1(이현준): 침대 밑 박스 세 개를 20분 동안 확인한 뒤 셔츠를 찾았다. 어느 박스인지 알 수 있는 단서가 없었다.
    E2(김근호)·E6(김우성): 본가에 둔 옷을 자취방에서 찾고 다른 옷으로 대체했다. 김우성의 탐색 시간은 30분이다.
    E7(박규성): 본가 보관 사실을 잊어 친구 결혼식 전날 슬랙스를 9만 원에 다시 샀다.
    E3·E4는 위 사건의 인원 집계이며 별도 증거를 추가하는 것이 아니다. E5는 보조 장면이다.
    SRC1~SRC8은 외부 맥락·대안 참고 자료다. 박스·본가 문제의 빈도·크기 또는 QR 해법의 효과를 직접 입증하지 않는다.
    한계: 사례와 발언은 과제 환경의 설정이다. 실제 인터뷰, 탐색 시간 관찰, 대안 비교, 반복 사용 검증은 수행하지 않았다.
  design_decision: 박스·본가 묶음 기록(R11), 위치 조회(R07), 위치 기준 검색(R04)을 핵심으로 둔다. R09는 정보 일관성을 위한 기반 기능이다. 세탁 회수 관리(R08), 택 AI 분석(R01~R03), 날씨 기반 조회(R12)는 보조로 둔다. 문제 정의는 묶음 기록이나 QR을 사용하지 않아도 성립한다.

validation_plan:
  - 실제 대상자에게 최근 계절 전환기의 개별 사건을 묻고, 보관 장소·탐색 행동·대처·손실·기록 여부를 인물별로 확인한다. 모르는 날짜와 금액은 임의로 채우지 않는다.
  - 사진·메모를 쓰는 사람과 쓰지 않는 사람을 구분하고, 사용 경험이 있는 사람에게만 실제 장단점과 중단 이유를 묻는다.
  - 메모와 시제품의 초기 등록·이동 기록·꺼낼 때 갱신 부담을 비교하고, 일정 기간 후 옷의 위치를 찾는 시간과 정확도를 확인한다. 성공 기준과 측정 간격은 실험 전에 정한다.
  - 실제 인터뷰의 동의와 기록을 확보한 뒤 해당 설정을 관찰·회상 근거로 교체한다. 설정값을 측정 결과로 전환하지 않는다.

features:
  - id: R11
    name: 옮기는 단위(박스·세탁소·본가) 묶음 기록
    input: 보낼 곳(박스·집 밖 공간 또는 세탁소), 박스 라벨 QR·영수증 사진(선택), 옮길 옷 여러 벌 체크, 옮긴 날·회수 예정일(최근값 기본)
    output: 선택한 옷들의 위치가 한 번에 해당 박스·본가로 바뀌거나, 세탁소 묶음이면 각 옷이 '세탁 중'이 되고 관리함에 회수 예정일이 등록된다. 박스 라벨 QR을 찍으면 해당 박스가 자동 선택되고 미등록 옷은 그 자리에서 추가해 묶음에 넣는다.
    done: 옮기기에서 '여름 박스'를 고르고 린넨 셔츠·반바지를 체크해 저장하면 두 벌이 모두 '박스 속 · 여름 박스'로 보인다. '본가 → 계절 옷 박스'로 니트·검정 슬랙스를 함께 옮기면 두 벌 모두 해당 위치 경로로 보이고 새로고침 후에도 유지된다. 보조 예시로 '동네 세탁소'에 두 벌을 맡기고 회수 예정일을 '3일 뒤'로 저장하면 관리함에 두 벌이 '세탁 중'으로 보인다.
  - id: R08
    name: 세탁·수선·회수 관리(보조)
    input: 종류(세탁·수선), 자택·업체 구분과 업체명, 맡긴 날짜, 회수 예정일
    output: 관리함에 '기한 지남'·'오늘 회수 예정'·'진행 중'·'완료 이력'이 표시된다. 회수 완료 시 '회수 완료·위치 미확인'이 되며 '재배치 확인'을 눌러야 '보관 중'으로 확정된다.
    done: 예정일이 지난 베이지 니트가 '기한 지남'에 보이고, '회수 완료' 뒤 옷 상세에서 '재배치 확인'을 누르면 상태가 '보관 중'과 위치 경로로 바뀌며 '기한 지남'에서 사라진다.
  - id: R07
    name: 수납 공간과 위치 찾기
    input: 공간 이름과 상위 공간, 유형(걸기·접기·장기보관·박스·집 밖), 수용 개수, 배치 완료 확인
    output: 옷 검색 시 '옷장 A → 왼쪽 행거' 또는 '박스 속 · 여름 박스'처럼 확정된 위치 경로가 보인다. 배치 추천안은 '배치 완료'를 눌러야 위치에 반영된다.
    done: "'현관 행거'(걸기, 3벌)를 만들고 배치 추천에서 '연청 데님 팬츠'의 '배치 완료'를 누르면, 내 옷장에서 '연청'을 검색한 카드에 위치 경로가 보이고 '미배치' 표시가 사라진다."
  - id: R09
    name: 한 벌 한 기록(일관된 저장)
    input: 등록·분류·배치·묶음·관리 상태 변경
    output: 위치·상태·묶음·이력이 같은 의류 ID에 연결되어 모든 화면에서 동일한 상태와 위치를 보여 준다.
    done: 니트·검정 슬랙스를 '본가 → 계절 옷 박스'로 함께 옮기면 내 옷장·옷 상세·옷장 지도에서 같은 의류 ID의 위치가 모두 해당 경로로 바뀌고, 이전 위치에 남지 않으며 새로고침 후에도 유지된다. 보조 예시로 같은 옷을 세탁소에 맡기면 내 옷장·옷 상세·옷장 지도·관리함의 상태가 모두 '세탁 중'으로 바뀌고 새로고침 후에도 유지된다.
  - id: R00
    name: 회원가입·로그인과 계정별 옷장
    input: 이메일·비밀번호, 로그아웃
    output: 계정별로 옷·공간·묶음·관리 기록이 분리 저장되며, 로그인 전에는 서비스 소개와 예시 옷장만 보인다.
    done: 가입 직후 빈 옷장과 '옷 등록' 버튼이 보이고 다시 로그인해도 등록한 옷이 유지된다. 다른 계정의 옷 주소는 404다.
  - id: R10
    name: 휴대폰·PC 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 필수값 누락 입력, 외부 API 장애
    output: 휴대폰과 PC에서 같은 흐름을 쓰며, 필수값 누락 시 입력값을 유지한 채 이유를 보여 주고 외부 호출 실패 시 재시도·직접 입력을 제공한다.
    done: 휴대폰과 PC 화면에서 핵심 메뉴가 깨지지 않고, 옷 이름 없이 저장을 누르면 저장되지 않고 이유가 보인다.
  - id: R04
    name: 보기 기준과 검색
    input: 보기 기준(종류·계절·브랜드·위치·집 밖/박스·상태·컬렉션), 검색어, 분류 수정
    output: 선택한 기준별로 의류를 묶어 보여 주며, '집 밖/박스' 보기는 박스 속·집 밖·세탁 맡김 옷을 먼저 묶어 보여 준다.
    done: |-
      '집 밖/박스' 보기에서 '셔츠'를 검색하면 '박스 속 · 여름 박스'에 보관한 린넨 셔츠의 카드에 위치 경로가 보인다. '슬랙스'를 검색하면 '본가 → 계절 옷 박스'에 보관한 검정 슬랙스의 카드에 위치 경로가 보이고 새로고침 후에도 유지된다.
  - id: R01
    name: 택 사진 AI 분석(보조)
    input: 세탁·브랜드 택 사진 1~4장
    output: 브랜드·품번·사이즈·소재·세탁 지시를 추출하고 미인식 항목은 '확인 필요'로 표시한다.
    done: 택 사진 2장으로 분석해 이름을 넣고 저장하면 옷 상세에 이름·택 사진 2장·읽은 브랜드와 소재가 보인다.
  - id: R02
    name: 제품 후보 웹 검색(보조)
    input: 브랜드와 품번
    output: 웹 검색 후보를 보여 주고 선택한 후보를 옷에 연결하며, 결과가 없어도 직접 입력으로 등록을 마친다.
    done: 후보를 고르거나 '검색 결과 없음'으로 저장해도 옷 상세에 결과가 남는다.
  - id: R03
    name: 대표 이미지 정리(보조)
    input: 제품 이미지 또는 직접 찍은 옷 사진
    output: 배경을 정리한 정사각 대표 이미지를 만들고 원본도 함께 보존한다.
    done: 정리 실패 시 원본이 대표 이미지로 남고 '다시 처리'할 수 있다.
  - id: R12
    name: 현재 위치 날씨와 집 안 옷 보기(보조)
    input: 현재 위치 권한, 기상청 단기예보
    output: 현재 기온에 맞는 옷 중 박스·본가·세탁소에 있지 않고 지금 집 안에 있는 옷을 보관 위치와 함께 보여 준다.
    done: 위치를 허락하면 현재 기온과 집 안 옷이 위치 경로와 함께 보이고, 거부하거나 응답이 없어도 옷장 기능은 그대로 동작한다.
