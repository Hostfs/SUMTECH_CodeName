# 문제정의 캔버스 — 최종안
# statement ~ must_beat 키 이름은 팀 템플릿 키에 맞춰 바꿔도 된다. personas 이하는 기존 키를 그대로 유지했다.
# [ ] 칸은 조사 후 채우고, 못 채우면 제출 전에 지운다. 수치를 추정해 넣지 않는다.

statement: |-
  좁은 자취방 때문에 옷을 옷장 밖(보관 박스·본가·세탁소)에 나눠 두는 대학생·사회초년생은, 외출 직전이나 환절기에 입으려던 옷이 지금 어디 있는지, 세탁이 끝나 바로 입을 수 있는지 확인하지 못한다. 그래서 시간을 허비하거나, 계획한 옷을 포기하거나, 있는 옷을 다시 산다.
  이들은 사진첩·메모·세탁소 영수증으로 버티지만, 옷을 옮기는 순간에는 기록할 이유도 여유도 없어 일상적인 이동이 기록되지 않고, 기록은 곧 실제와 어긋난다.

# 키트 형식의 캔버스. 아래 scenes·customer·root_problem·emotional_impact·measurable_impact·must_beat는 같은 내용의 세부 자료다.
canvas:
  context: |-
    문제가 터지는 순간은 세 장면이다. 세 장면 모두 원인은 한발 앞선 '옮기는 순간'에 기록이 남지 않은 데 있다.
    외출 직전 (핵심): 입으려던 옷이 옷장에 없다. 박스·세탁소·본가 중 어디 있는지 기억나지 않아 옷장을 뒤지다가, 다른 옷으로 타협하거나 늦는다. (기록이 끊긴 순간: 옷을 박스·본가로 옮길 때, 박스에서 꺼내 다른 곳에 둘 때)
    계절 교체 (핵심): 박스·본가에 무엇을 넣어 뒀는지 몰라 박스를 전부 열거나, 필요한 옷을 본가에 두고 오거나, 있는 옷을 다시 산다. (기록이 끊긴 순간: 박스에 포장할 때, 본가에 두고 올 때)
    세탁·수선 회수 (보조): 맡긴 사실을 잊거나 영수증을 잃어, 필요한 날 그 옷이 없다. (기록이 끊긴 순간: 맡길 때, 영수증을 잃은 뒤)
  customer: |-
    좁은 방 때문에 옷을 옷장 밖으로 내보내야 하는 자취 대학생·사회초년생
    이들이 놓치는 건 옷장 안의 옷이 아니라, 박스에 넣거나 본가에 두거나 세탁소에 맡겨 '눈에 안 보이는 곳으로 간 옷'이다.
    제외: 옷장 외 보관 장소가 1곳 이하인 사람. 이 정도는 기억만으로 추적할 수 있다고 보고 제외한다(가설, 인터뷰로 확인). 이들도 S3는 겪을 수 있지만 S3는 보조 장면이다.
    초기 고객: P1 중에서도 본가가 멀어, 옷을 두고 오면 몇 달간 가져올 수 없는 자취생. S1·S2의 손해가 가장 크다.
  root_problem: |-
    사람들은 옷을 '옮기는 순간'에는 기록할 이유를 느끼지 못하고, '찾는 순간'에야 기록이 필요해진다.
    박스에 넣거나 세탁소에 맡길 때는 손이 바쁘고 "기억나겠지"라고 생각한다. 기록이 필요해지는 건 몇 주~몇 달 뒤인데, 그때는 이미 기억이 흐려졌다.
    계절 정리처럼 큰 이벤트 때는 사진·메모를 남기기도 하지만, 한두 벌씩 넣고 꺼내는 일상적인 이동은 기록되지 않는다. 그래서 기록은 곧 실제와 어긋나고, 한 번 틀린 기록은 신뢰를 잃어 결국 다시 뒤지게 된다.
    옮기는 순간에는 기록할 계기가 없고, 기록 비용은 지금 치르는데 이득은 나중에 돌아온다. 이 시차 때문에 그 순간엔 기록하지 않는 게 합리적이다.
    옷이 여러 곳에 흩어진 것은 이 문제의 조건일 뿐, 원인이 아니다.
  impact:
    feeling: 외출 직전의 조급함(S1), 박스를 다 뒤집은 뒤 다시 넣는 허탈함(S2), 맡긴 옷을 잊고 돈만 날린 아까움(S3)
    measurable: '아직 측정하지 않았다(수치 미수집). 측정 계획: customer.required_conditions를 만족하는 8명. segment_markers 기준으로 나눠 비교한다. 옷 찾기 시간과 빈도 (S1)(1주 관찰 기록(E3)), 계획한 옷 포기 (S1, 최근 한 달)(인터뷰(E2)), 있는 옷을 모르고 재구매 (S2, 지난 환절기)(인터뷰(E2)), 세탁·수선 회수 지연 / 분실 (S3, 최근 3개월)(인터뷰(E2)), 기록 정확도(기록이 있는 사람의 기록과 실제 위치 대조(E7). 해법 성과를 잴 기준선이 된다.)'
  alternatives:
  - how_used: 옷장·박스를 열어 확인한다.
    shortcoming: 박스는 전부 꺼내 봐야 알고, 본가·세탁소에 있는 옷은 확인할 수 없다. 꺼낼 때마다 다시 정리해야 한다.
    why_ours: 열어 보지 않아도 박스 안과 집 밖의 옷을 확인할 수 있다. 단, 기록이 정확할 때만 성립하므로 아래 메모 앱 대비 우위가 전제다.
  - how_used: 본가 가족에게 전화로 묻고 택배를 부탁한다.
    shortcoming: 가족이 대신 찾아야 하고, 부탁할 때마다 부담과 미안함이 든다.
    why_ours: 본가에 무엇을 두고 왔는지 묻기 전에 스스로 확인할 수 있다.
  - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
    shortcoming: 큰 정리 때는 적지만, 한두 벌씩 옮길 때는 적을 생각을 못 해 금방 틀어진다.
    why_ours: 박스 라벨 QR이 옮기는 순간 기록할 계기가 되고, 등록된 옷은 체크만으로 그 자리에서 끝난다.
  - how_used: 세탁소 영수증으로 맡긴 옷을 관리한다.
    shortcoming: 영수증에는 '코트 1점'처럼만 적혀 어떤 옷인지 모르고, 영수증을 잃으면 기록이 사라진다.
    why_ours: 영수증을 찍는 한 번의 동작으로 그 옷들의 기록에 세탁 상태와 회수 예정일이 붙고, 원본도 남는다.
  - how_used: 모바일 세탁·보관 서비스를 쓴다.
    shortcoming: '[미확인 — 맡긴 옷 사진 제공·보관 기능 여부를 서비스 2~3개에서 직접 확인(E5)]'
    why_ours: '[확인 후 작성. 해당 기능이 있다면 ''그 서비스 밖의 박스·본가 옷''이 차별점이 된다]'
  - how_used: 디지털 옷장 앱에 옷을 등록하고 코디한다.
    shortcoming: 등록·코디 중심이라 위치·세탁 상태 관리가 약하다. [미수집 — 앱 2~3개 직접 사용 결과와 리뷰 속 이탈 이유(E4)]
    why_ours: 기능 하나가 아니라 '옮기는 단위로 기록해 갱신이 끊기지 않는 방식'에서 다르다. 위치 칸 하나를 추가하는 것으로는 따라오기 어렵다.
  - how_used: 찾기를 포기하고 비슷한 옷을 다시 산다.
    shortcoming: 돈이 들고, 같은 옷이 쌓여 수납 문제가 더 심해진다.
    why_ours: 이미 있는 옷을 사기 전에 확인할 수 있다.

scenes:
  summary: 문제가 터지는 순간은 세 장면이다. 세 장면 모두 원인은 한발 앞선 '옮기는 순간'에 기록이 남지 않은 데 있다.
  items:
    - id: S1
      name: 외출 직전 (핵심)
      what_happens: 입으려던 옷이 옷장에 없다. 박스·세탁소·본가 중 어디 있는지 기억나지 않아 옷장을 뒤지다가, 다른 옷으로 타협하거나 늦는다.
      record_broke_when: 옷을 박스·본가로 옮길 때, 박스에서 꺼내 다른 곳에 둘 때
      period: 최근 한 달
    - id: S2
      name: 계절 교체 (핵심)
      what_happens: 박스·본가에 무엇을 넣어 뒀는지 몰라 박스를 전부 열거나, 필요한 옷을 본가에 두고 오거나, 있는 옷을 다시 산다.
      record_broke_when: 박스에 포장할 때, 본가에 두고 올 때
      period: 지난 환절기
    - id: S3
      name: 세탁·수선 회수 (보조)
      what_happens: 맡긴 사실을 잊거나 영수증을 잃어, 필요한 날 그 옷이 없다.
      record_broke_when: 맡길 때, 영수증을 잃은 뒤
      period: 최근 3개월
  frequency: "[미수집 — 장면별로 8명 중 _명이 해당 기간에 1회 이상 겪음]"
  most_frequent: "[미수집 — S_]"
  most_painful: "[미수집 — S_]"

customer:
  core: 좁은 방 때문에 옷을 옷장 밖으로 내보내야 하는 자취 대학생·사회초년생
  lost_object: 이들이 놓치는 건 옷장 안의 옷이 아니라, 박스에 넣거나 본가에 두거나 세탁소에 맡겨 '눈에 안 보이는 곳으로 간 옷'이다.
  excluded: 옷장 외 보관 장소가 1곳 이하인 사람. 이 정도는 기억만으로 추적할 수 있다고 보고 제외한다(가설, 인터뷰로 확인). 이들도 S3는 겪을 수 있지만 S3는 보조 장면이다.
  required_conditions:  # 모두 만족해야 인터뷰 대상
    - 1인 가구 자취·기숙사 거주
    - 옷장 외 보관 장소 2곳 이상 (보관 박스·본가·세탁소·수선집 중)
  segment_markers:  # 선별 조건이 아니라, 대상자를 나눠 비교하는 기준
    - 세탁소·수선 이용 여부 (S3 해당 여부)
    - 옷 사진·메모 기록 시도 여부 (기록해 본 사람과 안 해 본 사람을 비교)
    - 본가까지의 거리 (옷을 두고 오면 얼마나 오래 못 가져오는지)
  early_adopter: P1 중에서도 본가가 멀어, 옷을 두고 오면 몇 달간 가져올 수 없는 자취생. S1·S2의 손해가 가장 크다.

root_problem:
  claim: |-
    사람들은 옷을 '옮기는 순간'에는 기록할 이유를 느끼지 못하고, '찾는 순간'에야 기록이 필요해진다.
    박스에 넣거나 세탁소에 맡길 때는 손이 바쁘고 "기억나겠지"라고 생각한다. 기록이 필요해지는 건 몇 주~몇 달 뒤인데, 그때는 이미 기억이 흐려졌다.
    계절 정리처럼 큰 이벤트 때는 사진·메모를 남기기도 하지만, 한두 벌씩 넣고 꺼내는 일상적인 이동은 기록되지 않는다. 그래서 기록은 곧 실제와 어긋나고, 한 번 틀린 기록은 신뢰를 잃어 결국 다시 뒤지게 된다.
  core: 옮기는 순간에는 기록할 계기가 없고, 기록 비용은 지금 치르는데 이득은 나중에 돌아온다. 이 시차 때문에 그 순간엔 기록하지 않는 게 합리적이다.
  not_the_cause: 옷이 여러 곳에 흩어진 것은 이 문제의 조건일 뿐, 원인이 아니다.
  competing_hypothesis: 기록은 했지만 찾을 때 그 기록을 찾지 못한다(조회 비용). 이쪽이 맞으면 해법은 기록이 아니라 검색이어야 한다.
  validation:
    questions:
      - 마지막으로 옷을 박스·본가·세탁소로 보낸 때를 떠올려 달라. 그때 뭔가 기록했나? 안 했다면 왜 안 했나?
      - 옷 사진이나 메모가 있다면 지금 찾아 보여 줄 수 있나? (말이 아니라 행동으로 확인)
    supports: 다수가 그 순간 기록하지 않았고, 이유로 바쁨·귀찮음·"기억날 줄 알았다"를 꼽는다.
    refutes: 다수가 기록은 했지만 찾을 때 그 기록을 못 찾았다 → 근본 문제를 조회 비용으로 교체한다.

emotional_impact:
  feelings: 외출 직전의 조급함(S1), 박스를 다 뒤집은 뒤 다시 넣는 허탈함(S2), 맡긴 옷을 잊고 돈만 날린 아까움(S3)
  to_check: 본가 옷을 보내 달라고 부모님께 부탁할 때의 미안함, "나는 왜 이렇게 정리를 못 하지" 같은 자기 비난이 실제로 나오는지 확인한다.
  quotes: "[미수집 — 장면별 인터뷰 원문 1개씩, 예: \"○○\" — 23세 자취생(P1)]"

measurable_impact:
  population: customer.required_conditions를 만족하는 8명. segment_markers 기준으로 나눠 비교한다.
  note: 8명은 통계가 아니라 방향 확인용이다. 값은 조사 후 채우고, 못 채우면 제출 전에 지운다.
  metrics:
    - name: 옷 찾기 시간과 빈도 (S1)
      method: 1주 관찰 기록(E3)
      value: "[평균 _분/회, _회/주]"
    - name: 계획한 옷 포기 (S1, 최근 한 달)
      method: 인터뷰(E2)
      value: "[8명 중 _명]"
    - name: 있는 옷을 모르고 재구매 (S2, 지난 환절기)
      method: 인터뷰(E2)
      value: "[8명 중 _명, 평균 _원]"
    - name: 세탁·수선 회수 지연 / 분실 (S3, 최근 3개월)
      method: 인터뷰(E2)
      value: "[지연 _명 / 분실 _명]"
    - name: 기록 정확도
      method: 기록이 있는 사람의 기록과 실제 위치 대조(E7). 해법 성과를 잴 기준선이 된다.
      value: "[일치율 _%]"

must_beat: |-
  기존 대안 중 갱신이 끊기지 않는 건 세탁소 영수증뿐이다. 사용자 의지가 아니라, 옮기는 순간 손에 쥐어지는 물건이 기록이 되기 때문이다.
  우리 해법은 이 원리를 박스와 본가까지 넓혀야 이긴다.
  (1) 계기 — 옮기는 순간 이미 손에 있는 물건(박스 라벨, 영수증)이 기록을 떠올리게 한다.
  (2) 속도 — 등록된 옷은 그 자리에서 3초 안에 끝난다. 3초는 가설이며, 메모 앱에 한 줄 적는 시간과 비교해 검증한다(E6).

personas:
  - id: P1
    description: 23세, 자취 2년 차 대학생. 원룸 옷장 하나에 다 안 들어가 겨울옷은 침대 밑 박스, 일부는 본가에 둔다. 코트·정장은 세탁소에 맡긴다. 우선 검증 대상이며, 그중 본가가 먼 사람을 초기 고객으로 본다.
    source: 팀 문제정의 캔버스 수정안(가설, 인터뷰로 검증 예정)
  - id: P2
