sources: []

five_whys:
  symptom: 옷은 여러 벌 있지만 필요한 옷을 찾고, 지금 입을 수 있는지와 어울리는 조합을 확인하는 데 수고가 든다.
  whys:
    - 보유한 옷의 종류·위치·현재 상태를 한눈에 확인하기 어렵기 때문이다.
    - 옷이 여러 공간에 나뉘고, 착용·세탁·수선에 따라 위치와 상태가 바뀌기 때문이다.
    - 구매 정보, 옷장 위치, 세탁·수선 기록이 각각 다른 곳에 남거나 기억에 의존하기 때문이다.
    - 한 벌의 정보를 직접 촬영·입력하고 변동 때마다 별도로 수정해야 하므로 기록 유지에 부담이 생길 수 있다.
    - 일상적인 구매·보관·관리 행동이 한 벌의 최신 기록으로 이어지는 과정이 부족하다는 가설이다. 3~5단계는 인터뷰로 확인한다.
  step_back: 원인을 끝까지 파고들면 '기록 연결 부족'이지만, 고객 입장에서 한발 물러서면 잃는 것은 외출 준비 시간과 옷에 쓴 돈이다.

solution_paths:
  - path: 택 인식 + 사용자 확인 + 통합 기록
    status: chosen
    reason: 택 OCR로 등록을 돕고 제품 후보를 사용자가 확인한다. 같은 의류 ID로 분류·코디·위치·관리 상태를 연결한다. 검색 실패도 직접 등록으로 마칠 수 있다.
  - path: 사진·정보를 전부 수동 입력하는 옷장 단독안
    status: deferred
    reason: 빠르게 구현할 수 있지만 최초 입력과 갱신 부담이 크다. 단독안으로는 보류하고, AI 검색이 실패할 때의 대체 경로로만 유지한다.
  - path: 정밀 3D 가상착의 중심 서비스
    status: deferred
    reason: 택·상품 사진만으로 실제 패턴·물성·뒷면을 확보하기 어렵다. 이번에는 회색 체형모형과 의류 템플릿으로 상하의 조화·길이를 비교하는 미리보기를 구현한다.

insight:
  claim: 사용자는 '무슨 옷이 있는가'뿐 아니라 '지금 입을 수 있는가, 어디서 꺼내는가'까지 이어서 확인할 필요가 있다는 가설을 세웠다.
  evidence: 현재 근거는 제안자가 설명한 보유 목록·코디·위치·세탁·수선의 불편이다(E1). 직접 관찰·인터뷰·시간 측정은 아직 없으므로 일반 사용자에게 확인해야 한다.
  design_decision: 택 촬영·확인형 등록, 자유 분류, 회색 3D 코디, 배치·위치 찾기, 세탁·수선 기록을 연결한다. 제품 확정과 실제 배치는 사용자가 확인한다. 정밀 핏 보장과 실물 자동 추적은 이번 범위에서 제외한다.

features:
  - id: R00
    name: 회원가입·로그인과 계정별 옷장 분리
    input: 이메일·비밀번호(회원가입, 로그인), 로그아웃 버튼
    output: 계정별로 의류·공간·코디·신체 치수·관리 기록이 서버에 저장되고, 다른 계정의 자료는 보이거나 바뀌지 않는다. 로그인하지 않은 사람은 첫 화면에서 서비스 소개와 예시 옷장 둘러보기만 볼 수 있다.
    done: 회원가입 후 바로 로그인되어 빈 옷장이 보이고, 로그아웃 후 다시 로그인해도 등록한 옷이 그대로 있다. 비밀번호가 틀리면 로그인되지 않고 이유를 보여 준다. 다른 계정의 의류 주소를 열면 404가 된다.
  - id: R01
    name: 택 사진 등록·분석·수정
    input: 한 벌의 택 사진 1장 이상(세탁·혼용률 택, 브랜드·품번 택을 여러 장 묶을 수 있음)
    output: AI가 읽은 브랜드·품번·표기 사이즈·원산지·소재(겉감·안감 구분, 혼용률)·세탁 지시를 원문과 함께 보여 주고, 읽지 못한 값은 '확인 필요'로 표시한다. 사용자가 고친 값이 저장되고 원본 택 사진도 그 의류에 남는다.
    done: 택 사진 2장을 한 의류에 묶어 분석하면 추출값과 원문이 표시되고, 값을 고쳐 저장하면 옷 상세에서 고친 값과 택 사진 2장이 보인다. AI 호출이 실패하면 입력 내용을 유지한 채 재시도와 직접 입력을 고를 수 있다.
  - id: R02
    name: 제품 후보 웹 검색·확정·대체 등록
    input: 택에서 읽은(또는 사용자가 고친) 브랜드와 품번
    output: 웹 검색과 상품 페이지 수집으로 찾은 제품 후보 카드(상품명·대표 이미지·색상·출처 URL·조회 시점·일치 근거)를 보여 준다. 사용자가 실제 보유 제품을 고르면 후보가 그 의류에 연결되고, 고르지 않은 후보는 의류 정보에 섞이지 않는다. 결과가 없거나 검색이 실패하면 직접 촬영 사진과 택 정보로 등록을 계속한다.
    done: 후보를 하나 선택해 저장하면 옷 상세에 상품명·출처 URL·조회 시점이 보인다. 후보가 없거나 검색이 실패해도 '직접 입력으로 계속'을 눌러 등록을 끝낼 수 있다. 정확도 퍼센트 같은 보정되지 않은 점수는 표시하지 않는다.
  - id: R03
    name: 대표 이미지 정리
    input: 선택한 제품 이미지 또는 사용자가 직접 촬영한 옷 사진
    output: 배경 제거, 중앙 정렬, 동일한 정사각 캔버스와 여백을 적용한 대표 이미지가 옷장 목록에 쓰이고 원본은 따로 남는다. 로고·무늬·색은 바꾸지 않는다.
    done: 테스트 사진을 올리면 정리된 대표 이미지와 원본을 나란히 볼 수 있다. 처리에 실패하면 원본이 대표 이미지로 유지되고 '다시 처리'를 누를 수 있다.
  - id: R04
    name: 다중 속성 분류와 사용자 수정
    input: 보기 기준 선택(종류·계절·브랜드·위치·상태·사용자 컬렉션), 검색어, 분류 수정
    output: AI가 처음 제안한 분류(종류·세부 종류·계절·색상)를 사용자가 수정·추가·삭제할 수 있고, 같은 옷이 여러 계절·컬렉션에 동시에 속한다. 사용자가 고친 값은 AI 재분석으로 덮어쓰지 않는다.
    done: 내 옷장에서 '계절'·'브랜드'·'종류' 보기로 바꾸면 그 기준으로 묶여 보이고, 옷의 계절을 고쳐 저장한 뒤 새로고침해도 고친 값으로 묶인다.
  - id: R05
    name: 체형 비율 반영 3D 코디
    input: 키·어깨너비·가슴둘레·허리둘레·엉덩이둘레·다리 안쪽 길이 중 아는 값(cm), 상의·하의 선택
    output: 회색 3D 신체모형이 입력 치수에 맞춰 부위별 크기를 바꾸고, 반소매 상의·긴소매 상의·재킷·긴바지 4종 템플릿에 선택한 옷의 색상·길이를 반영해 입힌다. 원본 대표 사진을 함께 보여 주고 '체형 비율과 코디 조화 참고용입니다. 실제 착용감과 핏은 다를 수 있습니다.'를 표시한다. 조합을 저장할 수 있다.
    done: 키를 바꾸면 모형 비율이 바뀌고, 모형을 드래그해 회전·확대할 수 있으며, 상의를 다른 템플릿의 옷으로 바꾸면 모형의 옷이 바뀐다. 비워 둔 치수는 '기본 비율'로 표시된다. 저장한 코디는 새로고침 후에도 같은 의류로 다시 열린다.
  - id: R06
    name: 보유 의류 기반 AI 코디 추천
    input: 계절·상황 선택, 선택적으로 고정할 옷 한 벌
    output: 내 옷장에 실제로 있는 의류 ID만으로 만든 상하의 조합과 짧은 이유를 보여 준다. 세탁 대기·세탁 중·수선 중인 옷은 기본 추천에서 제외한다. 추천을 3D 코디로 바로 열 수 있다.
    done: 추천을 받으면 조합의 각 옷이 내 옷장의 옷 카드로 표시되고 이유가 비어 있지 않다. 세탁 중으로 바꾼 옷은 다음 추천에 나오지 않는다. AI 응답에 없는 ID가 섞이면 버리고 남은 결과만 보여 준다.
  - id: R07
    name: 수납 공간 등록·배치 추천·위치 찾기
    input: 공간 이름과 상위 공간(예 옷장 A > 왼쪽 행거), 유형(걸기·접기·장기보관), 대략적인 수용 개수, 자주 입는 정도
    output: 의류 종류·계절·자주 입는 정도·공간 유형·용량으로 만든 배치 추천안을 보여 주고, 사용자가 수정할 수 있다. 추천안은 미확정으로 남고 '배치 완료'를 눌러야 현재 위치가 바뀐다. 용량을 넘으면 초과 수량을 표시한다. 옷을 검색하면 '옷장 A → 왼쪽 행거'처럼 경로를 보여 준다.
    done: 배치 추천을 만든 직후에는 옷 상세의 위치가 바뀌지 않고, '배치 완료'를 누른 뒤 내 옷장에서 그 옷을 검색하면 확정된 위치 경로가 보인다. 용량을 넘긴 공간에는 초과 수량이 표시된다.
  - id: R08
    name: 세탁·수선·회수 관리
    input: 상태(세탁 대기·세탁 중·수선 중), 자택·업체 구분, 업체명, 수선 내용, 맡긴 날짜, 회수 예정일
    output: 관리함에 '오늘 회수 예정'과 '기한 지남' 목록과 배지가 접속 시점 날짜로 계산되어 보인다. 회수 완료를 누르면 진행 중 목록에서 빠지고 기록은 이력으로 남으며, 옷은 '회수 완료·위치 미확인' 상태로 기존 위치를 제안받는다. '재배치 확인'을 눌러야 보관 중으로 바뀐다.
    done: 회수 예정일이 지난 기록은 '기한 지남'에 보이고, 예정일을 미래로 바꾸면 그 목록에서 빠진다. 회수 완료를 누르면 진행 중 목록에서 사라지고 옷 상세 이력에 남으며, 재배치 확인 후 상태가 '보관 중'으로 표시된다.
  - id: R09
    name: 일관된 영속 저장
    input: 등록·분류·코디·배치·관리 상태 변경
    output: 등록→코디→위치→상태가 같은 의류 ID를 참조하고, 한 화면에서 바꾼 상태가 다른 모든 화면에 같은 값으로 보인다.
    done: 옷을 세탁 중으로 바꾸면 내 옷장 카드·옷 상세·옷장 지도·코디 추천에서 모두 세탁 중(사용 불가)으로 반영되고, 새로고침 후에도 유지된다.
  - id: R10
    name: 공개 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 잘못된 입력, 외부 AI·검색 장애
    output: 공개 HTTPS 주소에서 스마트폰과 PC 모두 핵심 흐름을 쓸 수 있다. 필수 값이 비면 저장하지 않고 이유를 보여 주며, 외부 호출 실패 시 입력을 유지한 채 재시도·수동 입력 경로를 준다. 없는 주소는 404 화면을 보여 준다.
    done: 휴대폰 화면과 PC 화면에서 등록·옷장·코디·옷장 지도·관리함이 깨지지 않고 사용된다. 별칭 없이 저장을 누르면 저장되지 않고 이유가 보인다.
