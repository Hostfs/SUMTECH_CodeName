# 옷결 — 문제정의와 기능 명세
# 팀 구성: 조선대학교 AISW학부(정보보안전공) 이현준(팀장), 울산대학교 전기공학부 김근호, 선문대학교 컴퓨터공학부 김우성, 국립순천대학교 컴퓨터공학과 박규성, 한양대학교 ERICA 수리데이터사이언스학과 이고은

statement: |-
  좁은 자취방 때문에 옷을 보관 박스·본가·세탁소로 나눠 두는 대학생·사회초년생은, 외출 직전에 입으려던 옷이 어디 있는지·세탁이 끝나 바로 입을 수 있는지 몰라 박스를 다 뒤지거나 다른 옷으로 타협한다.
  옷결은 옷을 옮기는 그 순간 여러 벌을 한 묶음으로 기록해, 나중에 박스를 열지 않고도 기록된 위치와 착용 가능 상태(보관 중·세탁 중 등)를 먼저 확인하게 하는 서비스다.

canvas:
  context: |-
    1. 외출 직전(핵심): 입으려던 옷이 옷장에 없다. 박스에 무엇을 넣었는지 몰라 박스를 전부 꺼내 뒤지거나(E1), 어디 뒀는지 기억나지 않아 찾기를 포기하고 다른 옷을 입고 나간다(E2).
    2. 계절 교체(핵심): 박스·본가에 무엇을 넣어 뒀는지 몰라 박스를 전부 열거나, 필요한 옷을 본가에 두고 온다.
    3. 세탁·수선 회수(보조): 맡긴 옷의 회수 시점을 놓쳐 필요한 날 그 옷이 없다(E1).
  customer: |-
    좁은 방 때문에 옷을 옷장 밖(보관 박스·본가·세탁소)으로 나눠 두는 자취 대학생·사회초년생.
    우선 고객은 그중 보관 박스와 세탁소를 함께 쓰는 자취생이다. 계절이 바뀔 때마다 박스·본가와 옷장 사이로 옷이 오가고, 출근·외출복은 세탁소를 오간다.
    배경: 수도권 청년 1인가구 중 9.6%는 최저주거기준(1인 14㎡)에 못 미치는 곳에 살며 계절 옷 등을 둘 수납 공간이 부족하다(SRC7). 크린토피아의 2023년 2월 의류보관서비스 이용객은 전년 같은 달보다 27% 늘었고, 기사는 그 배경으로 좁은 주거공간을 효율적으로 쓰려는 1인 가구 증가를 든다(SRC8). 즉 옷을 집 밖으로 내보내는 행동 자체는 이미 일어나고 있다. 2024년 1인가구는 전체의 36.1%이고 29세 이하가 17.8%다(SRC1).
  root_problem: |-
    옷이 옷장 밖으로 옮겨 가는 순간(박스에 넣을 때·본가에 두고 올 때·세탁소에 맡길 때)의 위치가 찾을 때 믿을 수 있는 형태로 남아 있지 않다. 두 경우가 있다.
    (가) 옮길 때 아예 적지 않는다. 옮기는 순간에는 손이 바쁘고 적는 수고는 지금 들지만, 그 기록이 쓸모 있는 때는 나중에 그 옷을 찾을 때라 적기를 미룬다.
    (나) 큰 정리 때 메모를 남겼어도, 이후 한두 벌씩 넣고 꺼낸 변화가 반영되지 않아 메모가 실제 위치와 어긋난다.
    세탁소도 같다. 맡긴 사실과 회수일이 옷 기록과 떨어져 영수증·달력 알림에 따로 남아, 영수증을 받지 못하거나 잃으면 회수 시점을 놓친다(E1, 분쟁 사례로는 SRC2).
    어느 쪽이든 찾을 때 박스를 다 뒤지거나 다른 옷으로 대신한다. (이 인과는 팀원 경험 E1·E2에서 세운 가설이며, 팀 밖 사용자에게도 같은지는 아직 확인하지 않았다.)
  impact:
    feeling: 답답함, 외출 준비가 늦어지는 조급함, 여러 벌을 꺼냈다 다시 정리하는 번거로움(팀 문제정의 캔버스의 예상 반응, 실제 발언은 미수집).
    measurable: |-
      확인된 손실(E1·E2): 박스를 전부 꺼내 뒤진 뒤 다시 넣는 시간, 입으려던 옷을 포기하고 다른 옷을 입은 일, 세탁소 회수 시점을 놓친 일.
      찾는 시간·빈도·재구매 금액은 아직 재지 않았다. 측정할 지표는 '옷 한 벌을 찾는 데 연 박스 수와 걸린 시간', '맡긴 옷 회수 지연 건수'다.
  alternatives:
    - how_used: 옷장과 박스를 직접 열어 확인한다.
      shortcoming: 박스 속은 열어서 꺼내 봐야 알고(E1은 박스를 전부 꺼내 뒤진 뒤 다시 넣었다), 본가·세탁소에 있는 옷은 눈으로 확인할 수 없다.
      why_ours: 박스를 열지 않아도 박스 안과 집 밖(본가·세탁소)에 둔 옷의 위치 경로와 상태를 화면에서 먼저 확인한다.
    - how_used: 본가 가족에게 연락해 옷이 있는지 묻고 택배를 부탁한다.
      shortcoming: 가족이 대신 찾아야 하고 부탁할 때마다 부담이 생긴다.
      why_ours: 본가로 보낼 때 묶음으로 기록해 두면 묻기 전에 본가에 둔 옷 목록을 스스로 확인할 수 있다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
      shortcoming: 옷마다 위치를 직접 적어야 하고, 한두 벌씩 옮기거나 꺼낼 때 고치지 않으면 실제 위치와 어긋난다.
      why_ours: 박스 라벨 QR을 찍으면 보낼 곳이 골라지고 옷은 체크만 하면 되므로, 여러 벌의 위치가 한 번에 바뀐다. 위치를 글로 다시 적지 않아도 된다.
    - how_used: 종이 세탁소 영수증으로 맡긴 옷을 기억한다.
      shortcoming: 영수증을 잃거나 받지 못하면 어떤 옷을 언제 찾는지 확인하기 어렵다. 분실 피해구제 231건 중 102건(44.2%)은 인수증을 받지 못했다(SRC2).
      why_ours: 맡길 때 옷 여러 벌을 한 묶음으로 남겨(영수증이 있으면 사진도 함께) 영수증이 없어도 '세탁 중' 상태와 회수 예정일·기한 지남을 관리함에서 보여 준다.
    - how_used: 모바일 세탁 서비스(세탁특공대·런드리고)를 쓴다.
      shortcoming: 앱 설명 기준 검수 사진·진행 상태·세탁 이력·보관 기능을 제공하나(SRC5·SRC6), 해당 서비스에 맡긴 세탁물만 다룬다.
      why_ours: 집 안 박스·본가·동네 세탁소로 흩어진 옷의 위치와 상태를 한곳에서 관리한다.
    - how_used: 디지털 옷장 앱(에이클로젯 등)에 옷을 등록한다.
      shortcoming: 앱 설명 기준 옷 등록·코디 추천이 중심이며 박스·본가·세탁소 위치 관련 설명은 없다(SRC4).
      why_ours: 옷 목록이 아니라 '옷이 옮겨 가는 순간'의 위치·상태 기록에 집중한다.

personas:
  - id: P1
    description: 23세 자취 대학생. 원룸 옷장 외에 침대 밑 박스와 본가에 계절 옷을 나누어 두고 동네 세탁소를 이용한다.
    source: 팀 문제정의 캔버스(2026-10-29)
  - id: P2
    description: 입사 1~2년 차 자취 사회초년생. 출근복 세탁소 이용이 잦고 계절 옷을 박스에 나누어 보관한다.
    source: 팀 문제정의 캔버스(2026-10-29)

