# 옷결 문제정의와 기능 명세
# 출처: 팀 문제정의 캔버스 기입본(SUMTECH_옷결_문제정의_캔버스_기입본.pdf)과 서비스 구체화 문서(SUMTECH_옷결_서비스_구체화.md, 2026-10-29).
# 캔버스에 '가설'·'미수집'으로 적힌 내용은 확인된 사실로 바꾸지 않았다. 실제 관찰·인터뷰를 확보하면 해당 칸을 교체한다.

statement: |-
  여러 계절의 옷을 나누어 보관하는 대학생·사회초년생은 외출 준비와 계절 정리 때 보유 의류의 정보·위치·관리 상태가 연결되지 않아 옷을 찾고 코디를 확인하는 수고를 겪는다.
  지금은 옷장을 직접 뒤지거나 사진·메모로 버티지만, 기록 유지가 번거롭고 실제 옷의 위치·상태와 쉽게 어긋난다.
  그 결과 외출 직전의 조급함과 '분명 있는데'라는 답답함을 느끼며, 이런 단점에도 따로 돈이나 새 도구가 필요 없다는 이유로 기존 방법을 계속 쓰고 있다.

canvas:
  context: |-
    외출 전 상하의를 고르거나 계절 옷을 교체할 때, 여러 수납공간에 나누어 둔 옷 중 무엇이 있고 어디에 있는지 다시 확인해야 한다.
    세탁·수선을 맡긴 옷은 집에 없다는 사실과 회수 예정일을 별도로 기억해야 한다. 새 옷을 살 때도 이미 가진 비슷한 옷을 확인하기 어렵다.
    발생 빈도: 외출 준비·세탁·계절 정리 때 반복될 것으로 예상하며, 실제 빈도는 사용자 조사로 확인한다.
    가장 아픈 순간(가설): 출발 시간이 정해진 외출 직전(등교·출근·약속)에 원하는 옷이 바로 나오지 않을 때.
  customer: |-
    계절별 옷을 옷장·서랍·보관 박스에 나누어 두고, 외출 준비와 세탁·수선을 스스로 관리하는 대학생·사회초년생.
    특히 자취 공간에 수납이 분산되어 있거나, 옷이 늘면서 보유 목록과 위치를 기억하기 어려워진 사람을 우선 대상으로 한다.
    처음부터 모든 옷을 등록하는 일에는 부담을 느낄 수 있어, 새 옷이나 자주 입는 옷부터 점진적으로 시작할 수 있어야 한다.
    정말 고통받는 10%(가설): 최근에 옷을 못 찾아 준비가 늦어졌거나, 이미 가진 옷을 다시 샀거나, 맡긴 옷 회수를 놓친 경험이 있고 사진·메모 같은 대안을 이미 써 본 사람을 먼저 검증한다. 대안을 써 본 적 없는 사람은 '조금 성가신 90%'로 보고 우선순위를 낮춘다.
    확인할 행동 패턴: 외출 전 옷 고르기에 쓰는 시간, 옷을 꺼내 입어 보고 되돌려 놓는 횟수, 계절 정리 주기, 사진·메모 기록을 시작했다가 그만둔 시점과 이유(인터뷰로 수집, 현재 미수집).
  root_problem: |-
    옷의 제품·세탁 정보, 보관 위치, 세탁·수선 상태가 각각 흩어져 있고 기억이나 개별 메모에 의존한다.
    옷을 사거나 정리하고 맡기고 돌려받을 때 생긴 변화가 한 벌의 기록에 이어지지 않아, 옷의 현재 상태를 다시 확인해야 한다.
    수동으로 목록을 만들더라도 촬영·입력·갱신 부담 때문에 실제 옷과 기록이 어긋날 수 있다.
    ※ 근본 원인은 현재 가설이며, 관찰과 사용자 검증으로 보완한다.
    한발 물러서 본 근본 문제(가설): 옷을 못 찾는 것 자체보다, 가진 옷을 믿고 바로 꺼내 쓸 수 없어 정해진 외출 준비 시간과 옷에 쓴 돈을 잃는다는 점이 고객에게 실제 손실이다.
  impact:
    feeling: |-
      예상 반응: '분명 있는 옷인데 어디 있지?', '지금 꺼내 입을 수 있는 옷인가?'
      답답함, 준비가 늦어지는 조급함, 여러 벌을 꺼내고 다시 정리하는 번거로움이 발생할 수 있다. 실제 발언은 아직 수집하지 않았다.
      진통제인지 비타민인지는 판단 보류: 지각·중복 구매·미회수 같은 손실이 실제로 반복되면 진통제, '있으면 편한 정리 도구' 정도의 반응이면 비타민으로 본다. 인터뷰에서 확인한다.
    measurable: |-
      옷 찾기·입어보기·재정리에 쓰는 시간, 세탁·수선 회수 누락, 비슷한 옷의 중복 구매 가능성.
      시간·비용은 미측정이며 절감 효과는 검증 후 제시한다.
      측정할 지표(값은 측정 전까지 비워 둠): 외출 전 옷 찾기·고르기 시간(분/회), 옷을 못 찾아 준비가 늦어진 횟수(회/월), 비슷한 옷 중복 구매 경험과 금액(원/년), 맡긴 옷 회수를 놓친 횟수(회/년).
  alternatives:
    - how_used: 옷장을 직접 열어 찾고 여러 벌을 꺼내 입어 상하의 조합을 확인한다.
      shortcoming: 찾을 때마다 확인·착용·재정리를 반복하며, 다른 공간에 있거나 맡긴 옷은 한 번에 파악하기 어렵다.
      strength: 따로 준비하거나 배울 것이 없고 실물을 바로 보고 입어 볼 수 있다.
      why_still_used: 비용이 없고 가장 익숙하다.
      why_ours: 보유한 상의·하의를 체형 비율을 반영한 회색 3D 모형에서 비교하고, 고른 옷이 지금 사용 가능한지와 꺼낼 위치까지 함께 보여 준다.
    - how_used: 휴대폰 사진이나 메모로 옷 목록·보관 위치를 따로 기록한다.
      shortcoming: 사진·제품 정보·위치를 직접 정리해야 하며, 옷이 이동하거나 상태가 바뀌면 다시 수정해야 한다.
      strength: 이미 가진 휴대폰으로 바로 시작할 수 있고, 밖에서도 가진 옷을 확인할 수 있다.
      why_still_used: 정리 앱을 따로 설치·학습하지 않아도 된다. 중도 포기 여부는 인터뷰로 확인한다.
      why_ours: 택을 촬영하면 AI가 제품 정보와 세탁법을 읽어 등록 부담을 줄이고, 택 정보·대표 이미지·위치·상태를 같은 의류 ID 하나에 연결한다.
    - how_used: 세탁소 영수증과 달력 알림으로 맡긴 옷과 회수일을 관리한다.
      shortcoming: 영수증·알림이 개별 옷 기록과 연결되지 않으면, 지금 입을 수 있는 옷과 미회수 의류를 함께 보기 어렵다.
      strength: 회수일 알림은 확실하게 받을 수 있다.
      why_still_used: 세탁소에서 받은 영수증을 그대로 쓰면 되어 추가 수고가 적다.
      why_ours: 세탁·수선 상태와 회수 예정일을 그 옷의 기록에 남겨, 맡긴 옷은 코디 추천에서 빠지고 회수 예정·기한 지남 목록에 나타난다.
  must_beat: 대안이 있다는 것은 문제가 실제로 아프다는 신호다. 직접 찾기와 사진·메모는 '공짜이고 바로 쓸 수 있다'는 강점이 있으므로, 우리 해법은 등록·갱신 수고가 사진·메모보다 적고 외출 직전 확인 시간이 직접 찾기보다 짧아야 이긴다.

personas:
  - id: P1
    description: 계절 옷을 나누어 보관하고 세탁·수선을 직접 관리하는 대학생·사회초년생. 외출 준비 때 보유한 옷의 조합과 위치를 확인해야 하는 상황을 우선 검증한다.
    source: 팀 문제정의 캔버스(가설, 인터뷰로 검증 예정)
  - id: P2
    description: 추가 대상 후보로 수납공간이 분산된 1인 가구와 의류가 많은 사람. P1과의 차이는 인터뷰로 확인한다.
    source: 팀 문제정의 캔버스(가설, 인터뷰로 검증 예정)

