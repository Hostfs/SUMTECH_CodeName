# 옷결 — 문제정의와 기능 명세
# 근거: 팀 문제정의 캔버스(2026-10-29 수정안), 팀 제안자 경험(E1), 공개 자료(SRC1~SRC6, 실제로 열어 원문 숫자 그대로 옮김).
# 아직 하지 않은 사용자 조사는 docs/research-plan.md에 따로 둔다. 수치를 추정해 넣지 않는다.

statement: |-
  좁은 자취방 때문에 옷을 보관 박스·본가·세탁소에 나눠 두는 대학생·사회초년생은, 외출 직전에 입으려던 옷이 지금 어디 있고 바로 입을 수 있는지 몰라 옷장을 뒤지다 포기하거나 있는 옷을 다시 산다.
  옷결은 옷을 옮기는 순간에 박스 라벨 QR·세탁소 영수증과 함께 여러 벌을 한 번에 기록해 두고, 찾는 순간에 '옷장 A → 왼쪽 행거 / 여름 박스 / 세탁 중(11월 1일 회수)'로 바로 답하는 옷 위치·상태 기록 서비스다.

canvas:
  context: |-
    문제가 터지는 장면은 셋이고, 모두 한발 앞선 '옮기는 순간'에 기록이 남지 않아서 생긴다.
    1. 외출 직전(핵심): 입으려던 옷이 옷장에 없다. 박스·세탁소·본가 중 어디 있는지 기억나지 않아 옷장을 뒤지다 다른 옷으로 타협하거나 늦는다. 기록이 끊긴 순간은 옷을 박스·본가로 옮길 때, 박스에서 꺼내 다른 곳에 둘 때다.
    2. 계절 교체(핵심): 박스·본가에 무엇을 넣어 뒀는지 몰라 박스를 전부 열거나, 필요한 옷을 본가에 두고 오거나, 있는 옷을 다시 산다. 기록이 끊긴 순간은 박스에 포장할 때, 본가에 두고 올 때다.
    3. 세탁·수선 회수(보조): 맡긴 사실을 잊거나 영수증을 잃어 필요한 날 그 옷이 없다. 세탁물 분실 피해구제 231건 중 인수증을 받은 경우는 32.9%뿐이었다(SRC2). 맡긴 순간의 기록이 소비자 손에 남지 않는 일이 분쟁 사례에서는 흔하고, 한국소비자원은 장기간 미회수를 주의사항으로 든다(SRC2·SRC3).
  customer: |-
    좁은 방 때문에 옷을 옷장 밖으로 내보내야 하는 자취 대학생·사회초년생. 이들이 놓치는 건 옷장 안의 옷이 아니라 박스에 넣거나 본가에 두거나 세탁소에 맡겨 '눈에 안 보이는 곳으로 간 옷'이다.
    초기 고객은 그중 박스와 세탁소를 함께 쓰는 자취생이다. 옮기는 순간 손에 쥐는 물건(박스 라벨, 영수증)이 있어 해법이 바로 통한다. 본가가 멀어 옷을 두고 오면 몇 달간 가져올 수 없는 자취생은 손해가 가장 크지만, 본가행에는 그런 물건이 없어 보낼 곳을 직접 고르는 수동 기록으로 지원한다.
    옷장 밖 보관 장소가 한 곳 이하인 사람은 기억만으로 추적할 수 있다고 보고 대상에서 뺀다.
    규모 참고: 2024년 1인가구는 전체 가구의 36.1%(804만 5천 가구)이고 29세 이하 17.8%, 30대 17.4%다(SRC1). 이 중 옷장 밖 보관 장소가 두 곳 이상인 비율은 조사하지 않았다.
  root_problem: |-
    사람들은 옷을 옮기는 순간에는 기록할 계기도 이유도 없고, 찾는 순간에야 기록이 필요해진다.
    박스에 넣거나 세탁소에 맡길 때는 손이 바쁘고 "기억나겠지"라고 생각한다. 기록이 필요해지는 건 몇 주~몇 달 뒤인데 그때는 기억이 흐려져 있다. 기록 비용은 지금 들고 이득은 나중에 오는 시차 때문에, 그 순간에는 기록하지 않는 게 합리적이다.
    계절 정리처럼 큰 이벤트 때는 사진·메모를 남기기도 하지만, 한두 벌씩 넣고 꺼내는 일상적인 이동은 기록되지 않는다. 그래서 기록은 곧 실제와 어긋나고, 한 번 틀린 기록은 신뢰를 잃어 결국 다시 뒤지게 된다.
    옷이 여러 곳에 흩어진 것은 이 문제의 조건이지 원인이 아니다.
  impact:
    feeling: 외출 직전 옷을 못 찾는 조급함, 박스를 다 뒤집었다가 다시 넣는 허탈함, 맡긴 옷을 잊어 돈만 날린 아까움, 본가에 옷을 보내 달라고 부탁할 때의 미안함.
    measurable: 옷 찾기에 쓰는 시간, 계획한 옷을 포기한 횟수, 있는 옷을 모르고 다시 산 금액, 세탁·수선 회수 지연·분실 횟수. 아직 측정하지 않았으며 측정 방법은 docs/research-plan.md에 있다. 공개 자료로는 세탁물 분실 상담이 3년간 5,120건, 피해구제 231건(SRC2)이 있다.
  alternatives:
    - how_used: 옷장과 박스를 직접 열어 확인한다.
      shortcoming: 박스는 전부 꺼내 봐야 알고, 본가·세탁소에 있는 옷은 확인할 수 없다. 꺼낼 때마다 다시 정리해야 한다.
      why_ours: 열어 보지 않아도 박스 안과 집 밖의 옷을 위치 경로로 확인한다.
    - how_used: 본가 가족에게 전화로 묻고 택배를 부탁한다.
      shortcoming: 가족이 대신 찾아야 하고, 부탁할 때마다 부담과 미안함이 든다.
      why_ours: 본가에 무엇을 두고 왔는지 묻기 전에 스스로 확인한다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
      shortcoming: 큰 정리 때는 적지만, 한두 벌씩 옮길 때는 적을 생각을 못 해 금방 틀어진다. 틀어진 기록은 믿지 못해 결국 다시 뒤진다.
      why_ours: 옮기는 순간 손에 이미 있는 박스 라벨 QR이 기록의 계기가 되고, 등록된 옷은 체크만 하면 그 자리에서 끝난다. 한 벌씩이 아니라 옮기는 묶음 단위로 기록해 갱신이 끊기지 않는다.
    - how_used: 세탁소 영수증으로 맡긴 옷을 관리한다.
      shortcoming: 영수증에는 '코트 1점'처럼만 적혀 어떤 옷인지 모르고, 잃으면 기록이 사라진다. 분실 피해구제 231건 중 44.2%는 인수증을 받지도 못했다(SRC2).
      why_ours: 맡기는 자리에서 영수증 사진을 묶음에 남기고 맡긴 옷을 체크한 뒤 회수 예정일을 고르면, 그 옷들이 한 번에 '세탁 중'이 되고 관리함에 회수 예정·기한 지남으로 모인다.
    - how_used: 모바일 세탁 서비스(세탁특공대·런드리고)를 쓴다.
      shortcoming: 검수 사진·진행 상태·세탁 이력·의류 보관까지 제공하지만(SRC5·SRC6), 모두 그 서비스에 맡긴 세탁물에 대한 기능이다. 박스·본가에 둔 옷과 동네 세탁소에 맡긴 옷은 다루지 않는다.
      why_ours: 특정 서비스에 맡긴 옷만이 아니라 박스·본가·동네 세탁소로 흩어진 옷의 위치와 상태를 한곳에서 본다.
    - how_used: 디지털 옷장 앱(에이클로젯 등)에 옷을 등록하고 코디한다.
      shortcoming: 사진·온라인 검색으로 옷 추가, 날씨에 맞춘 코디 추천, OOTD 캘린더가 중심이고 앱 설명에 보관 위치·박스·수납·세탁 기능은 나오지 않는다(SRC4). '무슨 옷이 있는가'는 답하지만 '지금 어디 있는가'는 답하지 않는다.
      why_ours: 옷 목록이 아니라 '옮기는 단위로 기록해 갱신이 끊기지 않는 방식'이 다르다. 위치 칸 하나를 붙이는 것으로는 옮기는 순간의 기록 공백이 메워지지 않는다.

personas:
  - id: P1
    description: 23세, 자취 2년 차 대학생. 원룸 옷장 하나에 다 안 들어가 겨울옷은 침대 밑 박스에, 일부는 본가에 둔다. 코트·정장은 세탁소에 맡긴다. 우선 대상이며, 그중 본가가 먼 사람을 초기 고객으로 본다.
    source: 팀 문제정의 캔버스(2026-10-29)
  - id: P2
    description: 입사 1~2년 차 사회초년생. 출근복이 늘어 세탁소 이용이 잦다. 장면 3(세탁·수선 회수)의 비중이 P1보다 클 것으로 본다.
    source: 팀 문제정의 캔버스(2026-10-29)

