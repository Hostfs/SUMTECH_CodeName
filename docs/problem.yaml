five_whys:
  symptom: 외출 직전 입으려던 옷이 옷장에 없어 한참 뒤지다가, 세탁소에 맡겼거나 박스·본가에 있다는 걸 뒤늦게 떠올리고 그 옷을 포기한다.
  whys:
    - 그 옷이 지금 어디 있는지 모른다.
    - 옷장 밖(박스·본가·세탁소)으로 옮긴 사실이나 옮긴 곳을 기억하지 못한다.
    - 옮길 당시 어디에도 남기지 않았다. 큰 정리 때 남긴 기록이 있어도 이후 한두 벌씩 옮긴 것은 반영되지 않았다.
    - 옮기는 순간은 손이 바쁘고, 몇 주 뒤에도 기억날 거라고 생각한다.
    - 기록 비용은 지금 들고 이득은 나중에 오므로, 그 순간에는 기록하지 않는 게 합리적이다. 그래서 '더 꼼꼼한 기록'이 아니라 '옮기는 순간 손에 있는 물건이 기록이 되게' 해야 한다.

solution_paths:
  - path: 옮기는 단위 기록 — 박스 라벨 QR·세탁소 영수증을 찍고 옷 여러 벌을 체크해 한 묶음으로 저장
    status: chosen
    reason: 기존 대안 중 갱신이 끊기지 않는 건 세탁소 영수증뿐인데, 사용자 의지가 아니라 옮기는 순간 손에 쥐어지는 물건이 기록이 되기 때문이다. 영수증은 받는 것이고 QR은 찍는 것이라 같지 않다. 그래서 라벨을 박스에 붙이는 행위 자체를 첫 기록으로 삼고, 그 뒤로는 박스를 열 때마다 라벨이 눈에 보여 찍게 되는 흐름을 만든다. 본가행은 손에 쥐는 물건이 없어 보낼 곳을 직접 고르는 수동 흐름으로만 지원하고, 이 간극은 이 해법의 한계로 둔다. 한 벌씩이 아니라 옮기는 묶음 단위로 기록해 비용을 줄이고, 보낼 곳·업체·날짜는 최근값으로 미리 채워 체크만 하면 끝나게 한다. 택 OCR은 첫 등록 보조로만 쓴다.
  - path: 모든 옷을 한 벌씩 촬영·입력하는 옷장 앱
    status: deferred
    reason: 기존 옷장 앱과 같은 방식이라 첫 등록과 갱신 부담으로 이탈하기 쉽다. 묶음에 넣을 미등록 옷을 사진 한 장으로 추가하는 용도로만 남긴다.
  - path: 3D 가상착의·코디 추천
    status: rejected
    reason: 정의한 문제(옷이 지금 어디 있고 입을 수 있는지 모름)와 무관하다. 처음 기획에 있었지만 2026-10-29 수정안에서 뺐다. 상하의 조합을 고르는 코디 추천은 하지 않으며, R12는 조합이 아니라 '지금 집에 있어 바로 꺼낼 수 있는 옷과 그 위치'를 날씨 기준으로 먼저 보여 주는 찾기 보조다.

insight:
  claim: 사람들은 기록을 '못' 하는 게 아니라, 옮기는 순간에 기록할 계기와 이유가 없어서 안 한다. 그래서 답은 더 꼼꼼한 옷장 앱이 아니라, 옮기는 순간 이미 손에 있는 물건(박스 라벨, 영수증)을 기록의 계기로 만드는 것이다.
  evidence: |-
    E1: 팀 제안자가 박스 속 옷을 파악하지 못하고 세탁소 회수를 놓친 경험.
    SRC2·SRC3: 분실 분쟁 231건 중 인수증을 받은 경우는 32.9%, 받지 못한 경우가 44.2%였다(나머지는 확인 불가). 세탁소에 맡기는 순간조차 기록이 소비자 손에 남지 않는 일이 흔하고, 한국소비자원은 빠른 회수를 안내한다. 맡긴 순간의 기록과 회수 예정일을 옷 기록에 붙이는 설계(R08·R11)의 근거다.
    SRC4~SRC6: 기존 옷장 앱은 '무슨 옷이 있는가'를, 세탁 서비스는 '그 서비스에 맡긴 옷'만을 다룬다. 박스·본가·동네 세탁소로 흩어진 옷의 '지금 어디 있는가'를 다루는 서비스는 확인한 범위에 없었다.
    아직 하지 않은 것: 팀 밖 사용자 인터뷰와 관찰. 조사 계획과 결정 규칙은 docs/research-plan.md에 있고, 결과가 claim과 다르면 statement부터 다시 쓴다.
  design_decision: 옮기는 단위(박스·세탁소·본가) 묶음 기록을 서비스의 중심에 두고, 계기는 박스 라벨 QR과 세탁소 영수증이 맡으며 본가행은 수동 선택으로 둔다. 찾는 순간에는 위치 경로와 입을 수 있는지(세탁·수선 중 여부)를 한 화면에서 답한다. 택 OCR은 첫 등록 보조로만, 3D 코디와 추천은 범위에서 뺀다.

# 기능. 핵심(해법 자체)부터 적고, 기반과 보조는 뒤에 둔다. R05·R06(3D 코디·추천)은 수정안에서 제외해 번호를 비운다.
features:
  # 핵심 — 선택한 해법 자체
  - id: R11
    name: 옮기는 단위(박스·세탁소·본가) 묶음 기록
    input: 보낼 곳(박스·집 밖 공간 또는 세탁소), 박스 라벨 QR·영수증 사진(선택), 옮길 옷 여러 벌 체크, 옮긴 날·회수 예정일(최근값으로 미리 채움)
    output: 여러 벌이 한 번에 옮겨져 각 옷의 위치가 '여름 박스'·'본가'로, 세탁소 묶음은 각 옷이 '세탁 중'으로 바뀌고 회수 예정일이 관리함에 생긴다. 박스 라벨 QR을 찍으면 그 박스가 보낼 곳으로 자동 선택된다. 사진은 그 묶음에 남고, 최근 옮긴 기록이 목록으로 보인다. 처음 보는 옷은 이름과 종류(사진은 선택)만으로 그 자리에서 등록해 묶음에 넣는다.
    done: 옮기기에서 '여름 박스'를 고르고 린넨 셔츠·반바지를 체크해 '여름 박스로 보냄 (2벌)'을 누르면, 내 옷장 '집 밖/박스' 보기의 '박스 속' 묶음에 두 벌이 '박스 속 · 여름 박스'로 보인다. '세탁소'를 고르고 '동네 세탁소'와 '3일 뒤'를 정해 두 벌을 맡기면 관리함 진행 중 목록에 두 벌이 '세탁 중', 3일 뒤 회수 예정으로 보인다.
  # 핵심 — 장면 3
  - id: R08
    name: 세탁·수선·회수 관리
    input: 종류(세탁·수선), 자택·업체 구분과 업체명, 맡긴 날짜, 회수 예정일. 옮기기의 세탁소 묶음은 이 값이 채워진 채 만들어진다.
    output: 관리함에 '기한 지남'·'오늘 회수 예정'·'진행 중'·'완료 이력'이 접속 시점 날짜로 계산되어 보이고, 메뉴에 처리할 건수가 배지로 보인다. 회수 완료를 누르면 옷은 '회수 완료·위치 미확인'이 되어 기존 위치를 제안받고, '재배치 확인'을 눌러야 '보관 중'이 된다.
    done: 예정일이 지난 베이지 니트가 '기한 지남'에 보이고, '회수 완료' 뒤 옷 상세에서 '재배치 확인'을 누르면 상태가 '보관 중'과 위치 경로로 바뀌며 관리 이력에 회수 완료가 남고 '기한 지남'에서 사라진다.
  # 핵심 — 찾는 순간의 답
  - id: R07
    name: 수납 공간과 위치 찾기(배치 추천은 보조)
    input: 공간 이름과 상위 공간(옷장 A > 왼쪽 행거, 여름 박스, 본가), 유형(걸기·접기·장기보관·박스·집 밖), 수용 개수
    output: 옷을 검색하면 '옷장 A → 왼쪽 행거'처럼 확정된 위치 경로가, 박스·집 밖이면 '박스 속 · 여름 박스'가 보인다. 보조로 종류·계절·자주 입는 정도·공간 유형·용량에 따른 배치 추천안을 주되, '배치 완료'를 눌러야 위치가 바뀐다.
    done: |-
      '현관 행거'(걸기, 3벌)를 만들고 배치 추천에서 '연청 데님 팬츠'의 '배치 완료'를 누르면, 내 옷장에서 '연청'을 검색한 카드에 위치 경로가 보이고 '미배치' 표시가 사라진다.
  # 핵심 — 기록을 믿을 수 있게 하는 조건
  - id: R09
    name: 한 벌 한 기록(일관된 저장)
    input: 등록·분류·배치·묶음·관리 상태의 모든 변경
    output: 위치·상태·묶음·이력이 같은 의류 ID에 묶이고, 세탁 중·수선 중·회수 후 위치 미확인은 저장값이 아니라 기록에서 계산해 모든 화면이 같은 값을 보여 준다.
    done: 옷을 세탁소에 맡기면 내 옷장 카드·옷 상세·옷장 지도·관리함이 모두 '세탁 중'으로 바뀌고, 새로고침 후에도 유지된다.
  # 찾는 순간(외출 직전)을 돕는 기능
  - id: R12
    name: 현재 위치 날씨와 지금 꺼낼 수 있는 옷
    input: 사용자가 허락한 현재 위치, 기상청 단기예보(초단기실황·단기예보, 키는 서버에만)
    output: 내 옷장 맨 위에 현재 기온·하늘·강수, 오늘 최고·최저, 3시간 간격 예보와 한 줄 조언이 날씨에 따라 바뀌는 배경 위에 보인다. 그 기온에 맞는 계절 옷 중 지금 집 안에 있어 바로 꺼낼 수 있는 옷을 보관 위치와 고른 이유와 함께 최대 4벌 보여 준다. 비·눈·강수확률 60% 이상·최저 5°C 미만이면 겉옷부터, 최고 28°C 이상이면 겉옷을 빼고, 일교차 10°C 이상이면 겉옷을 하나 넣는다(초기 기준, 써 보며 조정). 박스 속·집 밖·세탁 중인 옷은 넣지 않는다.
    done: 위치를 허락하면 현재 기온과 오늘 최고·최저가 보이고, 집 안 옷이 위치 경로와 함께 보이며 눌러서 옷 상세로 간다. 위치를 거부하거나 기상청 응답이 없으면 안내 문구만 보이고 다른 기능은 그대로다.
  # 기반
  - id: R00
    name: 회원가입·로그인과 계정별 옷장
    input: 이메일·비밀번호, 로그아웃
    output: 옷·공간·묶음·관리 기록이 계정별로 서버에 저장되고 다른 계정의 자료는 보이지 않는다. 로그인 전에는 첫 화면의 서비스 소개와 예시 옷장만 본다.
    done: 가입 직후 로그인된 빈 옷장과 '옷 등록' 버튼이 보이고, 다시 로그인해도 등록한 옷이 남아 있다. 비밀번호가 틀리면 이유가 보이고, 다른 계정의 옷 주소는 404다.
  - id: R10
    name: 휴대폰·PC 접속과 오류 복구
    input: 스마트폰·PC 브라우저, 잘못된 입력, 외부 AI·검색·기상청 장애
    output: 공개 HTTPS 주소 하나에서 휴대폰(하단 탭)과 PC(왼쪽 메뉴)로 같은 흐름을 쓴다. 필수 값이 비면 저장하지 않고 이유를 보여 주며 입력값은 지우지 않는다. 외부 호출이 실패하면 입력을 유지한 채 '다시 시도'와 '직접 입력으로 계속'을 준다. 없는 주소는 404 화면이다.
    done: 휴대폰과 PC 화면에서 등록·내 옷장·옷장 지도·옮기기·관리함이 깨지지 않고, 이름 없이 저장을 누르면 저장되지 않고 이유가 보인다.
  # 보조 — 첫 등록을 돕는다. 미입력이어도 등록은 끝난다.
  - id: R01
    name: 택 사진 AI 분석(첫 등록 보조)
    input: 세탁·혼용률 택과 브랜드·품번 택 사진 1~4장
    output: AI가 읽은 브랜드·품번·사이즈·원산지·소재·세탁 지시를 원문과 함께 보여 주고, 읽지 못한 값은 '확인 필요'로 표시한다. 고친 값과 원본 택 사진이 그 옷에 남는다.
    done: 택 사진 2장으로 분석해 이름을 넣고 저장하면 옷 상세에 이름·택 사진 2장·읽은 브랜드와 소재가 보인다. AI 실패 시 입력을 유지한 채 재시도·직접 입력을 고를 수 있다.
  - id: R02
    name: 제품 후보 웹 검색
    input: 택에서 읽은(또는 고친) 브랜드와 품번
    output: 웹 검색으로 찾은 제품 후보(상품명·이미지·출처 URL·조회 시점)를 보여 주고, 사용자가 고른 후보만 옷에 연결한다. 결과가 없으면 '검색 결과 없음'으로 기록하고 등록을 계속한다.
    done: 후보를 고르거나 '검색 결과 없음'인 채로 저장해도 옷 상세의 제품 정보 칸에 그 결과가 남는다.
  - id: R03
    name: 대표 이미지 정리
    input: 고른 제품 이미지 또는 직접 찍은 옷 사진
    output: 배경을 지우고 가운데 정렬한 정사각 대표 이미지가 목록에 쓰이고 원본은 남는다. 로고·무늬·색은 바꾸지 않는다.
    done: 정리에 실패하면 원본이 대표 이미지로 남고 '다시 처리'할 수 있다.
  - id: R04
    name: 보기 기준과 검색
    input: 보기 기준(종류·계절·브랜드·위치·집 밖/박스·상태·컬렉션), 검색어, 분류 수정
    output: 같은 옷이 여러 계절·컬렉션에 동시에 속하고, '집 밖/박스' 보기는 박스 속·집 밖·세탁 맡김·미배치·집 안으로 묶는다. 사용자가 고친 분류는 AI 재분석으로 덮어쓰지 않는다.
    done: 화이트 반소매 티셔츠에 '봄'을 추가하고 계절 보기로 바꾸면 봄·여름 묶음 모두에 보이고, 새로고침 후에도 유지된다.
