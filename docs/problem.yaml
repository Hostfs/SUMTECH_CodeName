five_whys:
  symptom: 외출 직전 입으려던 옷이 옷장에 없다. 박스에 넣었는지 몰라 보관 박스를 전부 꺼내 뒤지거나(E1), 어디 뒀는지 기억나지 않아 찾기를 포기하고 다른 옷을 입고 나간다(E2). 세탁소에 맡긴 옷은 회수 시점을 놓쳐 필요한 때 집에 없다(E1).
  whys:
    - 그 옷이 지금 옷장·박스·본가·세탁소 중 어디 있는지, 언제 돌려받는지 바로 확인할 방법이 없다(E1·E2).
    - 옷장 밖으로 옮기거나 맡긴 사실과 구체적인 위치·회수일을 기억에 의존했고, 기억하지 못했다(E2는 어디 뒀는지, E1은 박스 속 내용과 회수 시점을 기억하지 못했다).
    - (가설) 옮길 당시 위치를 기록으로 남기지 않았거나(원인 가), 이후 한두 벌씩 꺼내고 넣은 변화를 반영하지 않았다(원인 나). 세탁소라면 맡긴 사실과 회수일이 옷 기록이 아니라 영수증·달력 알림에만 따로 남았다(원인 다).
    - (가설) 갈래마다 기록을 미루는 이유가 있다. (가) 옮기거나 맡기는 순간에는 손이 바쁘고, 박스·본가는 옷마다 위치를 글로 적어야 한다. (나) 한 벌을 꺼낼 때는 그 옷을 찾는 순간 목적이 끝나 메모를 고칠 이유가 없다. (다) 세탁소는 영수증을 받는 것으로 끝나, 맡긴 옷과 회수일을 옷 기록에 옮겨 적지 않는다.
    - (가설) 세 갈래 모두, 기록의 수고는 옮기는(꺼내는·맡기는) 그 순간에 들지만 기록의 쓸모는 나중에 찾을 때에야 생겨, 그 순간에 기록할 이유가 약하다.

solution_paths:
  - path: 옮기는 단위 묶음 기록 — 최근 기록으로 보낼 곳을 미리 채우고, 옷은 여러 벌을 체크해 한 번에 위치·상태 변경
    status: chosen
    reason: |-
      근본 원인을 '옮기는 순간의 기록 수고'(가설 (가)·(나)·(다))로 보았으므로, 그 순간의 입력을 줄이는 쪽을 골랐다.
      - (가) 보낼 곳: 옮기기 화면에서 박스·본가(그 아래 '본가 → 안방 옷장' 같은 안쪽 공간 포함)·세탁소를 고르며, 가장 최근 기록의 보낼 곳·세탁소 이름·회수 간격이 기본값으로 채워진다.
      - (가) 옷: 이미 등록된 옷은 체크만 하면 여러 벌이 한 번에 옮겨진다. 처음 보는 옷은 그 자리에서 한 벌씩 이름·종류만 넣어(사진은 선택) 묶음에 추가하므로, 가진 옷을 전부 미리 등록할 필요는 없다. 다만 처음 옮기는 옷이 많으면 그 한 번은 메모만큼 입력이 들고, 줄어드는 것은 그다음 이동부터다.
      - (나) 낱벌: 꺼낼 때의 계기는 '찾을 때'다. 외출 전 내 옷장 카드에서 '박스 속 · 여름 박스'처럼 위치를 보고 꺼내는 그 자리에서, 같은 카드의 '꺼내기'로 집 안 자리를 한 번 고른다(옷 상세를 열지 않는다). 찾는 순간이 곧 기록하는 순간이 되게 해, 꺼낸 뒤 고칠 이유가 사라지는 원인 (나)를 줄인다. 박스에 한 벌을 더 넣을 때는 같은 옮기기 화면에서 한 벌만 체크한다. 계절 교체로 여러 벌을 꺼낼 때는 옷장 지도에서 공간의 '옷 넣기'로 여러 벌을 골라 한 번에 넣는다. 어느 경우든 메모처럼 위치를 글로 다시 쓰지 않는다. 다만 찾지 않고 그냥 꺼내 입으면 기록이 어긋날 수 있고, 이를 막는 장치는 없다.
      - (다) 세탁소: 맡긴 옷 묶음이 곧 맡긴 옷 목록과 회수 예정일이 된다. 영수증을 받지 못한 경우가 많아도(SRC2의 44.2%) 기록은 남는다. 그 옷을 찾으면 '세탁 중'과 회수 예정일이 보이고, 앱을 열면 회수가 밀린 건수가 메뉴의 '관리함' 옆 숫자와 알림 종으로 보인다. 앱을 열지 않는 날을 위해 관리함의 '달력에 넣기'로 회수 예정일을 휴대폰 달력에 옷 이름과 함께 넣는다.
      - (찾을 때·보조) 이렇게 쌓인 위치·상태 기록은 내 옷장의 '집 밖/박스' 보기(R04)와 현재 날씨 기준 집 안 옷 보기(R12)에서 지금 집에 없는 옷을 걸러 보여 주는 데 쓰이고, 위치가 비어 있는 옷은 배치 추천(R07)으로 처음 정리를 돕는다.
      남는 위험: 옮기거나 꺼낼 때 앱을 열지 않으면 여전히 어긋난다(자동으로 위치를 알아내지는 않는다). 이 부담이 메모보다 실제로 작은지는 팀 밖 사용으로 확인해야 한다.
  - path: (보조) 새 옷 한 벌을 택 사진으로 등록 — 택 인식 + 사용자 확인
    status: chosen
    reason: 첫 캔버스(2026-10-29)의 선택 권고안이었다. 수정안에서 핵심을 옮기는 순간의 기록으로 옮기면서, 가진 옷 전부가 아니라 새 옷을 샀을 때 한 벌을 기록에 들이는 입구(R01~R03)로 낮췄다. 근본 원인을 직접 겨냥하지는 않는다.
  - path: 옷의 실물 위치를 자동으로 추적
    status: rejected
    reason: 팀 문제정의 캔버스(2026-10-29) 설계 결정에 '실물 자동 추적은 이번 범위에서 제외한다'고 적었다. 그래서 위치는 사용자가 옮길 때 남기는 기록에 의존하며, 위 chosen 경로는 그 기록의 수고를 줄이는 데 집중한다.
  - path: 모든 옷을 한 벌씩 촬영·입력하는 옷장 앱
    status: deferred
    reason: 가진 옷을 전부 미리 등록하게 하면 첫 등록 부담이 크다. 그래서 일괄 사전 등록은 요구하지 않고, 옮기는 중 '처음 보는 옷'으로 바로 추가하거나 새 옷을 샀을 때 택 사진(R01)으로 한 벌 등록하는 길만 남긴다.
  - path: 3D 가상착의·코디 추천
    status: rejected
    reason: 옷의 보관 위치와 착용 가능 상태를 확인하는 핵심 문제와 직접 연결되지 않아 범위에서 제외했다.

insight:
  claim: 팀이 세운 가설은, 옷의 위치는 찾을 때가 아니라 옮길 때(처음 넣을 때와 한 벌씩 꺼낼 때 모두) 잃는다는 것이다. 그렇다면 기록은 옮기는 순간에, 여러 벌을 한 번에, 글로 적지 않고 남길 수 있어야 한다.
  evidence: |-
    E1·E2: 박스에 넣어 둔 옷이 무엇인지·어디 뒀는지 몰라 박스를 전부 뒤지거나 착용을 포기했고, 세탁소 회수 시점을 놓쳤다.
    SRC7·SRC8: SRC7은 청년 1인가구의 계절 옷 수납 공간 부족을, SRC8은 좁은 주거공간을 이유로 든 세탁업체 의류보관 서비스 이용 증가를 보도한다. 본가·개인 박스로 옷을 옮기는 빈도는 직접 다루지 않는다.
    SRC2·SRC3·SRC9: 세탁물 분실 피해구제 231건 중 인수증을 받은 경우는 76건(32.9%)이었고, 다른 집계에서 분실 228건 중 44건(19.3%)은 3개월 이상 회수하지 않은 세탁물이었다. 소비자원은 완성된 세탁물을 빨리 회수하라고 안내한다. 맡긴 옷의 기록·회수 문제가 분쟁에서도 드러난다(일반 이용자의 빈도를 뜻하지는 않는다).
    SRC11·SRC14: 2024년 주거실태조사에서 청년가구의 1인당 주거면적은 줄고 최저주거기준 미달 비율은 8.2%로 늘었으며, 2025년에도 세탁업체는 1인 가구의 의류 보관 서비스 이용이 매년 늘고 있다고 밝혔다. 좁은 집 때문에 옷을 옷장 밖에 두는 조건은 최근 자료에서도 이어진다.
    SRC12·SRC13: 세탁 서비스 피해구제 신청은 2022~2024년 4,855건이고 소비자원은 완성된 세탁물을 신속히 회수하라고 당부한다. 3개월 미회수 뒤 분실되면 세탁업자가 면책된다. 회수 시점을 기록해 두는 일이 분쟁 예방과도 맞닿는다.
    SRC4~SRC6: 앱 설명 기준 옷장 앱은 보유 목록·코디 중심이고, 세탁 앱은 자기 서비스에 맡긴 세탁물만 다룬다.
    아직 확인하지 못한 것: 팀 밖 사용자 인터뷰, 메모 대비 묶음 기록에 걸리는 시간, 반복 사용 시 기록이 실제 위치와 맞게 유지되는 비율.
  design_decision: |-
    핵심(근본 원인 → 기능): (가) 옮길 때 적지 않음 → 박스·세탁소·본가(안쪽 공간 포함)로 옮기는 묶음 기록(R11). (나) 낱벌 변화 누락 → 찾은 카드에서 바로 '꺼내기', 옷 상세 '위치 변경', 옷장 지도 '옷 넣기'와 위치 경로 조회(R07). (다) 세탁 기록 분리 → 세탁 회수 관리와 회수일 '달력에 넣기'(R08). 세 기능은 같은 의류 ID에 기록돼 모든 화면이 같은 위치·상태를 보여 준다(R09).
    찾을 때: 내 옷장의 '집 밖/박스' 보기(R04)가 박스 속·집 밖·세탁 맡김 옷을 먼저 묶어 보여 준다.
    범위 변화: 첫 캔버스(2026-10-29)는 택 인식 등록을 중심으로 했으나, 수정안(2026-10-29)에서 3D 코디·추천(R05·R06)을 빼고 옮기기(R11)를 넣어 핵심을 옮기는 순간의 기록으로 옮겼다.
    보조: 택 AI 분석(R01~R03)은 첫 등록 입력을 줄이고 세탁 지시를 함께 읽어 옷 상세에 남긴다. E2의 세탁 방법 실수는 위치 문제와 별개이며, 이것으로 실수가 줄어드는지는 확인하지 않았다. 현재 날씨 기반 집 안 옷 보기(R12)는 꺼내 입을 때 박스·본가·세탁소에 있는 옷을 걸러 준다. 배치 추천(R07)은 위치가 비어 있는 옷을 한꺼번에 정리할 때의 편의 기능이며 꼭 필요한지는 확인하지 않았다. 추천은 '배치 완료'를 눌러야 위치가 된다.
    만들지 않은 것: 실물 자동 추적, 옷결 자체의 회수일 푸시·문자 알림(대신 휴대폰 달력으로 넘긴다), 3D 가상착의·코디 추천.

features:
  - id: R11
    name: 옮기는 단위(박스·세탁소·본가) 묶음 기록
    input: 보낼 곳(박스·집 밖 공간 또는 세탁소), 옮길 옷 여러 벌 체크, 처음 보는 옷의 이름·종류(사진은 선택), 옮긴 날·회수 예정일(최근값 기본)
    output: 보낼 곳 목록에는 박스·집 밖 공간과 그 아래 가장 안쪽 공간('본가 → 안방 옷장')이 뜬다. 선택한 옷들의 위치가 한 번에 고른 박스·집 밖 공간(안쪽 공간 포함)으로 바뀌거나, 세탁소 묶음이면 각 옷이 '세탁 중'이 되고 관리함에 회수 예정일이 등록된다. 등록되지 않은 옷은 '처음 보는 옷'에서 이름·종류만 넣어(사진은 선택) 그 자리에서 묶음에 넣는다.
    done: |-
      옮기기에서 '여름 박스'를 고르고 린넨 셔츠·반바지를 체크해 '여름 박스로 보냄 (2벌)'을 누르면 내 옷장 '집 밖/박스' 보기의 '박스 속' 묶음에 두 벌이 '박스 속 · 여름 박스'로 보인다.
      '세탁소'에서 '동네 세탁소'와 '3일 뒤'로 두 벌을 맡기면 관리함 진행 중 목록에 두 벌이 '세탁 중'으로 보인다.
      '본가'를 고르고 한 벌을 보내면 '집 밖/박스' 보기의 '집 밖' 묶음에 그 옷이 '집 밖 · 본가'로 보인다.
      '처음 보는 옷'으로 추가한 옷은 체크된 채 목록 맨 위에 나타나고, 보낸 뒤 내 옷장에서 그 박스 위치로 보인다.
      '본가' 아래 '안방 옷장'을 만들면 보낼 곳에 '본가 → 안방 옷장'이 뜨고, 그리로 보낸 옷은 '집 밖/박스' 보기의 '집 밖' 묶음에 보인다.
      한 번 세탁소로 맡긴 뒤 옮기기를 다시 열면 보낼 곳·업체명·회수 간격이 지난번 값으로 채워져 있다.
  - id: R08
    name: 세탁·수선·회수 관리
    input: 맡길 때 옷 상세의 '세탁·수선 맡기기'에서 종류(세탁·수선), 자택·업체 구분과 업체명, 맡긴 날짜, 회수 예정일(여러 벌이면 R11 옮기기의 '세탁소'), 돌려받을 때 관리함의 '회수 완료'와 옷 상세의 '재배치 확인' 또는 '위치 변경', 관리함 진행 중 기록의 '달력에 넣기'
    output: 관리함에 '기한 지남'·'오늘 회수 예정'·'진행 중'·'완료 이력'이 표시되고, 기한 지남과 오늘 회수 예정 건수는 메뉴의 '관리함' 옆 숫자와 화면 위 알림 종으로 어느 화면에서나 보인다. 진행 중 기록은 '달력에 넣기'로 회수 예정일 일정(.ics, 옷 이름·맡긴 곳 포함)을 받아 휴대폰 달력에 넣을 수 있다. 회수 완료 시 '회수 완료·위치 미확인'이 되며, 맡기기 전 위치가 있으면 그 위치를 제안하고 '재배치 확인'을, 없으면 '위치 변경'으로 넣을 곳을 골라야 '보관 중'으로 확정된다.
    done: 네이비 옥스퍼드 셔츠를 '세탁·수선 맡기기'로 '동네 세탁소'에 내일 회수 예정으로 기록하면 관리함 '진행 중'에 '세탁 중'으로 보인다. 예정일이 지난 베이지 니트가 '기한 지남'에 보이고, '회수 완료' 뒤 옷 상세에서 '재배치 확인'을 누르면 상태가 '보관 중'과 위치 경로로 바뀌며 '기한 지남'에서 사라진다. '회수 완료'를 누르면 메뉴의 '관리함' 옆 숫자와 화면 위 알림 종의 숫자도 1 줄어든다(0이 되면 숫자가 사라진다). 진행 중인 '카키 치노 팬츠'의 '달력에 넣기'를 누르면 '옷결 회수 · 카키 치노 팬츠' 일정이 회수 예정일로 든 달력 파일을 받는다.
  - id: R07
    name: 수납 공간과 위치 찾기
    input: 공간 이름과 상위 공간, 유형(걸기·접기·장기보관·박스·집 밖), 수용 개수, 내 옷장 카드의 '꺼내기'·옷 상세의 '위치 변경'(한 벌), 옷장 지도의 '옷 넣기'(여러 벌), 배치 추천의 '배치 완료' 확인
    output: 옷 검색 시 '옷장 A → 왼쪽 행거' 또는 '박스 속 · 여름 박스'처럼 확정된 위치 경로가 보인다. 박스·집 밖에 있는 옷은 내 옷장 카드의 '꺼내기'(옷 상세를 열지 않음)나 '위치 변경', 공간의 '옷 넣기'로 집 안 공간을 고르면 그 경로로 바뀐다. 박스·집 밖 아래에 만든 안쪽 공간의 옷도 각각 '박스 속'·'집 밖'(바로 꺼낼 수 없는 옷)으로 본다(예 '본가 → 안방 옷장'은 집 밖). 배치 추천안은 '배치 완료'를 눌러야 위치에 반영된다.
    done: |-
      '현관 행거'(걸기, 3벌)를 만들고 배치 추천에서 '연청 데님 팬츠'의 '배치 완료'를 누르면, 내 옷장에서 '연청'을 검색한 카드에 위치 경로가 보이고 '미배치' 표시가 사라진다.
      '여름 박스'에 있던 옷의 상세에서 '위치 변경'으로 집 안 공간을 고르고 '여기로 옮김'을 누르면, 그 옷의 위치가 '박스 속 · 여름 박스'에서 고른 공간 경로로 바뀐다.
      옷장 지도에서 공간 카드의 '옷 넣기'로 두 벌을 골라 넣으면 두 벌 모두 그 공간 경로로 보인다.
      내 옷장에서 '박스 속 · 여름 박스'인 옷 카드의 '꺼내기'를 누르고 '옷장 A → 왼쪽 행거'를 고르면, 카드의 위치가 바로 '옷장 A → 왼쪽 행거'로 바뀐다.
  - id: R09
    name: 한 벌 한 기록(일관된 저장)
    input: 등록·분류·배치·묶음·관리 상태 변경
    output: 위치·상태·묶음·이력이 같은 의류 ID에 연결되어 모든 화면에서 동일한 상태와 위치를 보여 준다.
    done: 옷을 세탁소에 맡기면 내 옷장 카드·옷 상세·관리함에서 모두 '세탁 중'으로 보이고, 옷장 지도에서는 원래 공간 카드에서 빠지며, 새로고침 후에도 유지된다.
  - id: R00
    name: 회원가입·로그인과 계정별 옷장
    input: 이메일·비밀번호, 로그아웃
    output: 계정별로 옷·공간·묶음·관리 기록이 분리 저장되며, 로그인 전에는 서비스 소개와 예시 옷장만 보인다.
    done: 가입 직후 빈 옷장과 '옷 등록' 버튼이 보이고 다시 로그인해도 등록한 옷이 유지된다. 다른 계정의 옷 주소는 404다.
  - id: R10
    name: 휴대폰·PC 접속과 오류 복구
    input: 스마트폰·PC 브라우저 접속, 필수값 누락 입력, 외부 API 장애
    output: 휴대폰과 PC에서 같은 흐름을 쓰며, 필수값 누락 시 입력값을 유지한 채 이유를 보여 주고 외부 호출 실패 시 재시도·직접 입력을 제공한다.
    done: 휴대폰(가로 390px)과 PC(가로 1440px)에서 주 메뉴가 보이고 가로 스크롤 없이 옷장·옮기기·관리함을 연다. 옷 이름 없이 저장을 누르면 저장되지 않고 이유가 보이며 입력한 다른 값은 그대로 남는다. 택 분석이 실패하면 실패 이유가 보이고, 사진을 그대로 둔 채 '택 분석하기'를 다시 누르거나 직접 입력해 등록을 마칠 수 있다.
  - id: R04
    name: 보기 기준과 검색
    input: 보기 기준(종류·계절·브랜드·위치·집 밖/박스·상태·컬렉션), 검색어, 분류 수정
    output: 선택한 기준별로 의류를 묶어 보여 주며, '집 밖/박스' 보기는 바로 꺼낼 수 없는 '박스 속'·'집 밖'·'세탁·수선 맡김' 옷을 먼저 묶어 보여 준다. 옷의 분류(계절·종류 등)를 고치면 바뀐 기준 묶음에 바로 반영된다.
    done: |-
      '여름 박스'로 보낸 옷은 '집 밖/박스' 보기의 '박스 속' 묶음에, 세탁소에 맡긴 옷은 '세탁·수선 맡김' 묶음에 보인다.
      화이트 반소매 티셔츠에 '봄'을 추가하고 계절 보기로 바꾸면 봄·여름 묶음 모두에 보이고 새로고침 후에도 유지된다.
  - id: R01
    name: 택 사진 AI 분석(보조)
    input: 세탁·브랜드 택 사진 1~4장
    output: 브랜드·품번·사이즈·소재·세탁 지시를 추출하고 미인식 항목은 '확인 필요'로 표시한다.
    done: 택 사진 2장으로 분석해 이름을 넣고 저장하면 옷 상세에 이름·택 사진 2장·읽은 브랜드와 소재가 보인다. 택에서 읽지 못한 항목은 '확인 필요'로 표시되어 직접 고칠 수 있다.
  - id: R02
    name: 제품 후보 웹 검색(보조)
    input: 브랜드와 품번
    output: 웹 검색 후보를 보여 주고 선택한 후보를 옷에 연결하며, 결과가 없어도 직접 입력으로 등록을 마친다.
    done: 후보를 고르거나 '검색 결과 없음'으로 저장해도 옷 상세에 결과가 남는다.
  - id: R03
    name: 대표 이미지 정리(보조)
    input: 제품 이미지 또는 직접 찍은 옷 사진
    output: 배경을 정리한 정사각 대표 이미지를 만들고 원본도 함께 보존한다.
    done: 정리 실패 시 원본이 대표 이미지로 남고 '다시 처리'할 수 있다.
  - id: R12
    name: 현재 위치 날씨와 집 안 옷 보기(보조)
    input: 현재 위치 권한, 기상청 날씨 정보(초단기실황·단기예보)
    output: 현재 기온에 맞는 옷 중 박스·본가·세탁소에 있지 않고 지금 집 안에 있는 옷을 보관 위치와 함께 보여 주며, 비·눈이 오거나 강수확률이 높으면 집 안 겉옷을 먼저 보여 준다. 기상청 실황(하늘 상태·강수)과 밤낮에 따라 내 옷장 화면 위쪽 하늘이 맑은 낮(파란 하늘과 구름)·흐림·비(빗방울)·눈(눈송이)·밤(어두운 밤하늘)으로 바뀌고, 어두운 하늘에서는 제목과 버튼 색이 함께 바뀐다. 한 번 위치를 허락한 기기는 다음부터 옷장을 열 때 바로 불러온다.
    done: 위치를 허락하면 현재 기온과 집 안 옷이 위치 경로와 함께 보이고, 비가 오는 날에는 화면 위쪽이 빗방울이 내리는 회색 하늘이 되며 집 안 겉옷이 먼저 보인다. 거부하거나 응답이 없어도 옷장 기능은 그대로 동작한다.
