# 옷결 — 문제정의와 기능 명세
# 팀 구성: 조선대학교 AISW학부(정보보안전공) 이현준(팀장), 울산대학교 전기공학부 김근호, 선문대학교 컴퓨터공학부 김우성, 국립순천대학교 컴퓨터공학과 박규성, 한양대학교 ERICA 수리데이터사이언스학과 이고은

statement: |-
  좁은 자취방 때문에 계절 옷을 보관 박스·본가로 나눠 두고 입는 옷은 세탁소에 맡기는 대학생·사회초년생은, 외출 직전에 입으려던 옷이 어디 있는지·세탁소에 맡겨 지금 집에 없는지 몰라 박스를 다 뒤지거나 다른 옷으로 타협한다.
  옷결은 옷을 옮기는 그 순간 여러 벌을 한 묶음으로 기록해, 나중에 박스를 열지 않고도 기록된 위치와 착용 가능 상태(보관 중·세탁 중 등)를 먼저 확인하게 하는 서비스다.

canvas:
  context: |-
    1. 외출 직전(핵심, E1·E2, 2026년 10월): 입으려던 옷이 옷장에 없다. E1은 박스에 무엇을 넣었는지 몰라 보관 박스를 전부 꺼내 뒤진 뒤 다시 넣었고, E2는 어디 뒀는지 기억나지 않아 찾기를 포기하고 다른 옷을 입고 나갔다.
    2. 세탁소 회수(핵심, E1): 세탁소에 맡긴 옷의 회수 시점을 놓쳐, 필요한 때 그 옷이 집에 없었다. 팀 가설로는, 맡긴 사실과 회수일이 옷 기록과 떨어져 있어 회수가 밀렸다는 것을 그 옷이 필요해진 날에야 알게 된다.
    3. 계절 교체(배경, 팀원 경험 기록 없음): 계절이 바뀔 때 박스·본가와 옷장 사이로 옷이 오간다. 이때 무엇을 어디 넣었는지 몰라 박스를 전부 열거나 필요한 옷을 본가에 두고 오는 장면은 팀이 예상한 장면이며, 근거는 계절 옷을 둘 공간이 부족하다는 보도(SRC7·SRC8)뿐이다.
  customer: |-
    좁은 방 때문에 옷을 옷장 밖(보관 박스·본가·세탁소)으로 나눠 두는 자취 대학생·사회초년생.
    우선 고객은 그중 보관 박스와 세탁소를 함께 쓰는 자취생이다(E1은 보관 박스와 세탁소를 둘 다 썼다). 계절 옷은 박스·본가와 옷장 사이를 오가고, 출근·외출복은 세탁소를 오간다.
    경험 범위: 팀원 경험(E1·E2)은 대학생 팀원의 것이다. 사회초년생(P2)과 본가 보관 사례는 아직 경험을 수집하지 않은 확장 대상이다.
    배경: 국토교통부 2024년 주거실태조사 기준 청년가구의 1인당 주거면적은 31.1㎡로 전년(32.7㎡)보다 줄었고, 최저주거기준에 못 미치는 청년가구는 8.2%로 전체 평균(3.8%)의 약 두 배다(SRC11). 수도권 청년 1인가구 중 9.6%는 최저주거기준(1인 14㎡)에 못 미치는 곳에 살며 계절 옷 등을 둘 수납 공간이 부족하다(SRC7). 크린토피아의 2023년 2월 의류보관서비스 이용객은 전년 같은 달보다 27% 늘었고, 기사는 그 배경으로 좁은 주거공간을 효율적으로 쓰려는 1인 가구 증가를 든다(SRC8). 크린토피아는 2025년에도 의류 보관 서비스 이용 고객이 2020년 출시 이후 매년 늘고 있으며 공간 활용이 중요한 1인 가구가 많이 찾는다고 밝혔다(SRC14). 즉 세탁업체 보관 서비스로 옷을 집 밖에 맡기는 행동은 늘고 있다. 2024년 1인가구는 전체 가구의 36.1%(804만 5천 가구)이고, 1인가구 중 29세 이하의 비중은 17.8%다(SRC1).
  root_problem: |-
    옷이 옷장 밖으로 옮겨 가는 순간(박스에 넣을 때·본가에 두고 올 때·세탁소에 맡길 때)의 위치와 상태가, 나중에 찾을 때 믿을 수 있는 기록으로 남아 있지 않다. 팀 가설로는, 기록하는 수고는 옮기는 그 순간에 들고 기록의 쓸모는 나중에 찾을 때에야 생겨 옮기는 순간의 기록이 빠진다.
    확인한 것(E1·E2): 찾을 때 박스 속 내용과 옷의 위치를 몰라 박스를 다 뒤지거나 다른 옷으로 대신했고, 맡긴 옷의 회수 시점을 놓쳤다.
    왜 기록이 남지 않는가(팀 가설, 팀 밖 사용자에게는 아직 확인하지 않음):
    (가) 옮길 때 아예 적지 않는다. 적는 수고는 옮기는 그 순간에 드는데 그때는 손이 바쁘고, 기록이 쓸모 있는 때는 나중에 찾을 때라 미룬다.
    (나) 큰 정리 때 메모를 남겼어도, 이후 한두 벌씩 넣고 꺼낸 변화를 고치지 않아 메모가 실제 위치와 어긋난다. 한 벌을 꺼낼 때는 그 옷을 찾는 순간 목적이 끝나, 메모를 고칠 이유가 남지 않는다.
    (다) 세탁소에 맡긴 사실과 회수일은 옷 기록과 떨어져 영수증·달력 알림에만 남는다. 영수증을 받지 못하거나 잃으면 무엇을 언제 찾을지 확인하기 어렵고, 영수증·달력은 옷장 쪽 기록이 아니어서 옷을 찾을 때 그 옷이 세탁소에 있다는 것이 함께 보이지 않는다. 분쟁 사례에서도 인수증을 받지 못한 경우(SRC2)와 3개월 이상 회수하지 않은 세탁물의 분실(SRC9)이 보고된다. 의뢰 후 3개월간 찾아가지 않은 세탁물이 분실되면 세탁업 표준약관상 세탁업자가 면책되므로(SRC13), 회수 시점을 놓치는 것은 그 옷을 잃을 위험으로도 이어진다.
  impact:
    feeling: 팀 문제정의 캔버스(2026-10-29)에 적은 예상 반응은 '분명 있는 옷인데 어디 있지?', '지금 꺼내 입을 수 있는 옷인가?' 하는 답답함, 외출 준비가 늦어지는 조급함, 여러 벌을 꺼냈다 다시 정리하는 번거로움이다. 팀원이 그때 실제로 한 말과 감정은 기록하지 않아, E1·E2의 feeling·quote는 지어내지 않고 null로 둔다.
    measurable: |-
      확인된 손실(E1·E2, 횟수·시간은 재지 않음): 보관 박스를 전부 꺼내 뒤진 뒤 다시 넣은 일, 입으려던 옷을 포기하고 다른 옷을 입고 나간 일, 세탁소 회수 시점을 놓친 일.
      팀 밖 자료: 한국소비자원 집계(2011~2013년) 세탁물 분실 피해 228건 중 44건(19.3%)은 소비자가 3개월 이상 회수하지 않은 세탁물이었다(SRC9). 이는 분쟁으로 접수된 장기 미회수 사례이며, 일반 이용자가 회수를 얼마나 자주 놓치는지를 뜻하지는 않는다.
      아직 재지 않은 것: 찾는 데 걸린 시간·빈도·재구매 금액. 측정할 지표는 '옷 한 벌을 찾는 데 연 박스 수와 걸린 시간', '맡긴 옷 회수 지연 건수'다.
  alternatives:
    - how_used: 옷장과 박스를 직접 열어 확인한다.
      shortcoming: 박스 속은 열어서 꺼내 봐야 알고(E1은 박스를 전부 꺼내 뒤진 뒤 다시 넣었다), 본가·세탁소에 있는 옷은 눈으로 확인할 수 없다.
      why_ours: 박스를 열지 않아도 박스 안과 집 밖(본가·세탁소)에 둔 옷의 위치 경로와 상태를 화면에서 먼저 확인한다. 옮길 때마다 기록했다면 열어야 할 박스가 하나로 좁혀진다(기록하지 않고 옮긴 옷은 여전히 찾아야 한다).
    - how_used: 본가 가족에게 연락해 옷이 있는지 묻고 택배를 부탁한다.
      shortcoming: 가족이 대신 찾아야 하고 부탁할 때마다 부담이 생긴다.
      why_ours: 본가로 보낼 때 묶음으로 기록해 두면 묻기 전에 본가에 둔 옷 목록을 스스로 확인하고, 부탁할 때 옷 이름을 집어 말할 수 있다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
      shortcoming: 옷마다 위치를 글로 직접 적어야 하고, 한두 벌씩 옮기거나 꺼낼 때 고치지 않으면 실제 위치와 어긋난다(원인 (나)).
      why_ours: 보낼 곳은 최근 기록으로 미리 채워지고, 이미 등록된 옷은 목록에서 체크만 하면 여러 벌의 위치가 한 번에 바뀐다. 목록에 없는 옷은 처음 옮길 때 한 벌씩 이름과 종류를 넣어야 하지만(메모처럼 한 번은 적는다), 그다음 이동부터는 체크만 한다. 한 벌을 꺼낼 때도 그 옷을 찾은 내 옷장 카드의 '꺼내기'에서 넣을 공간을 한 번 고를 뿐 글로 다시 쓰지 않는다.
    - how_used: 종이 세탁소 영수증과 달력 알림으로 맡긴 옷과 회수일을 기억한다.
      shortcoming: 영수증을 잃거나 받지 못하면 어떤 옷을 언제 찾는지 확인하기 어렵다(분실 피해구제 231건 중 102건(44.2%)은 인수증을 받지 못했다, SRC2). 달력 알림은 날짜만 알려 주고, 어떤 옷이 지금 집에 없는지는 옷 기록과 이어지지 않는다.
      why_ours: 옷결의 강점은 날짜 알림이 아니라 맡긴 옷과 회수일을 옷 기록에 잇는 것이다. 맡길 때 고른 옷 묶음이 곧 맡긴 옷 목록과 회수 예정일이 되어 영수증이 없어도 남는다. 외출 전 옷을 찾으면 내 옷장 카드에 '세탁 중'·'지금 집에 없어요'가 보여 박스를 헛되이 뒤지지 않고, 옷 상세에는 맡긴 곳과 회수 예정일이 보인다. 회수 예정일이 오늘이거나 지난 건수는 다른 옷을 옮기거나 찾으려고 앱을 열 때마다 메뉴의 '관리함' 옆 숫자와 알림 종으로 보여, 그 옷이 필요해지기 전에 밀린 회수를 볼 기회가 생긴다. 앱을 열지 않는 날을 위해서는 관리함의 '달력에 넣기'로 회수 예정일을 휴대폰 달력에 옷 이름과 함께 넣어, 그날 달력이 '무엇을 찾아올지'까지 알려 준다(달력 알림이 날짜만 아는 단점을 옷 기록으로 채운다). 옷결 자체의 푸시·문자 알림은 없다.
    - how_used: 모바일 세탁 서비스(세탁특공대·런드리고)를 쓴다.
      shortcoming: 앱 설명 기준 검수 사진·진행 상태·세탁 이력·보관 기능을 제공하나(SRC5·SRC6), 설명에서 확인한 기능은 그 서비스에 맡긴 세탁물 중심이며 집 안 박스·본가에 둔 옷에 관한 설명은 없다.
      why_ours: 집 안 박스·본가·동네 세탁소로 흩어진 옷의 위치와 상태를 한곳에서 관리한다.
    - how_used: 디지털 옷장 앱(에이클로젯 등)에 옷을 등록한다.
      shortcoming: 앱 설명 기준 옷 등록·코디 추천이 중심이며 박스·본가·세탁소 위치 관련 설명은 없다(SRC4).
      why_ours: 옷 목록이 아니라 '옷이 옮겨 가는 순간'의 위치·상태 기록에 집중한다. 가진 옷을 미리 전부 등록하지 않아도, 옮기는 옷부터 기록이 쌓인다.

personas:
  - id: P1
    description: |-
      23세 자취 대학생(우선 고객). 원룸의 붙박이 옷장 하나로는 사계절 옷이 다 들어가지 않아, 지난 계절 옷은 침대 밑 보관 박스 여러 개와 본가로 나눠 두고 외출복은 동네 세탁소에 맡긴다. 청년 가구의 1인당 주거면적이 일반 가구보다 좁고(SRC11) 계절 옷 수납 공간이 부족한(SRC7) 집에 사는 사람이다.
      목표: 아침 수업·약속 전에 정해 둔 옷을 바로 꺼내 입는다.
      불편: 박스에 무엇을 넣었는지 기억하지 못하고, 어떤 옷이 세탁소에 가 있는지 헷갈린다. 메모를 남겨도 한두 벌씩 넣고 뺀 뒤에는 고치지 않는다.
      [지금] 가을 들어 처음 쌀쌀한 아침, 1교시 전에 지난봄 넣어 둔 니트를 입으려 한다. 어느 박스인지 몰라 박스를 전부 꺼내 뒤진 뒤 다시 넣거나(E1), 찾기를 포기하고 다른 옷을 입고 나간다(E2).
      [옷결 · 넣을 때] 봄에 옷을 정리하며 옮기기에서 '겨울 박스'를 고르고(여러 번 나눠 넣을 때는 방금 보낸 '겨울 박스'가 보낼 곳으로 미리 골라져 있다), 넣을 옷을 체크해 '겨울 박스로 보냄'을 누른다. 목록에 없는 옷은 그 자리에서 '처음 보는 옷'으로 이름·종류만 넣는다.
      [옷결 · 찾을 때] 가을 아침 내 옷장에서 '니트'를 검색하면 카드에 '박스 속 · 겨울 박스'가 보여 그 박스 하나만 연다. '집 밖 · 본가'로 나오면 그날은 바로 다른 옷을 고르고 주말에 본가에서 가져온다.
      [옷결 · 한 벌 꺼낼 때] 겨울 박스에서 니트 한 벌만 꺼내 옷장에 걸 때, 방금 찾은 그 카드의 '꺼내기'로 '옷장 A → 왼쪽 행거'를 고른다. 박스 쪽 목록도 함께 바뀌어 메모처럼 어긋나지 않는다(원인 (나)).
    source: 팀원 경험 E1·E2를 바탕으로 만든 페르소나(2026-10-29 팀 문제정의 캔버스). 주거 배경은 SRC7·SRC11.
  - id: P2
    description: |-
      입사 1~2년 차 자취 사회초년생(확장 고객). 평일 출근용 셔츠·니트를 동네 세탁소에 자주 맡기고, 부피 큰 겨울옷은 박스나 세탁업체 보관 서비스로 집 밖에 둔다(SRC8·SRC14).
      목표: 회의·면접 같은 중요한 날 입을 옷이 그날 집에 있게 한다.
      불편: 세탁소 인수증을 못 받거나 잃어 무엇을 언제 찾을지 모르고(SRC2), 퇴근 시간이 늦어 회수를 미루다 잊는다. 3개월 넘게 찾지 않은 세탁물은 분실돼도 배상받기 어렵다(SRC13).
      [지금] 월요일 회의에 입을 셔츠가 옷장에 없다. 지난주 세탁소에 맡긴 것은 떠올랐지만 인수증이 없어 언제 찾기로 했는지 모르고, 퇴근길에 찾는 것도 잊었다. 결국 다른 셔츠를 입는다.
      [옷결 · 맡길 때] '옮기기 → 세탁소'에서 셔츠 두 벌을 체크하고 회수 예정일 '3일 뒤'를 고른다(세탁소 이름은 지난번 기록이 기본값). 인수증을 못 받았어도 이 묶음이 맡긴 옷 목록과 회수일이 된다. 관리함의 '달력에 넣기'로 회수일을 휴대폰 달력에 넣어 두면, 앱을 열지 않은 날에도 달력이 '옷결 회수 · 셔츠'로 알려 준다.
      [옷결 · 회수할 때] 퇴근길에 휴대폰 달력의 '옷결 회수 · 셔츠' 알림을 보거나, 지하철에서 앱을 열었을 때 메뉴의 '관리함' 옆 숫자와 알림 종으로 오늘 찾을 옷이 있음을 확인한다. 찾은 뒤 관리함에서 '회수 완료'를 누르고 옷 상세의 '재배치 확인'을 누르면 맡기기 전 자리('옷장 A → 왼쪽 행거')로 돌아간다. 날짜를 넘기면 '기한 지남'으로 올라온다.
      [옷결 · 외출 전날] 일요일 밤 그 셔츠를 검색하면 카드에 '세탁 중'·'지금 집에 없어요'가 뜨는지 '옷장 A → 왼쪽 행거'가 뜨는지 바로 보여, 아침에 옷장을 뒤지지 않는다.
    source: 팀 문제정의 캔버스의 페르소나(2026-10-29). 세탁소 장면은 E1의 회수 시점 누락과 SRC2·SRC9·SRC12·SRC13을, 집 밖 보관은 SRC8·SRC14를 바탕으로 했다. 사회초년생 당사자 경험은 아직 수집하지 않았다.

experiences:
  - id: E1
    when: 2026년 10월, 외출 준비 중
    what_happened: 박스에 넣어 둔 옷이 무엇인지 파악하지 못해 입으려던 옷을 바로 찾지 못했고, 세탁소에 맡긴 옷의 회수 시점을 놓친 적이 있다.
    workaround: 보관 박스를 전부 꺼내 뒤진 뒤 다시 넣었다.
    feeling: null
    quote: null
    source: 팀 제안자 본인 경험. 팀장 이현준이 팀원 전원(김근호·김우성·박규성·이고은)과 같은 상황을 겪었는지 확인하고 반영에 동의받음(2026-10-29, 개별 발언 원문 미기록)
  - id: E2
    when: 2026년 10월, 외출 직전
    what_happened: 입으려던 옷을 어디에 뒀는지 기억하지 못해 찾지 못했다. 위치 문제와는 별개로 세탁 방법을 잘못 맞춰 세탁한 적도 있다(보조 기능 R01이 택의 세탁 지시를 함께 읽는 배경).
    workaround: 옷 찾기를 포기하고 다른 옷을 입고 나갔다.
    feeling: null
    quote: null
    source: 국립순천대학교 컴퓨터공학과 박규성 본인 경험(2026-10-29 팀장 이현준 확인, 발언 원문 미기록)

