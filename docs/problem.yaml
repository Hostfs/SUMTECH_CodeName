# 옷결 — 문제정의와 기능 명세
# 팀 구성: 조선대학교 AISW학부(정보보안전공) 이현준(팀장), 울산대학교 전기공학부 김근호, 선문대학교 컴퓨터공학부 김우성, 국립순천대학교 컴퓨터공학과 박규성, 한양대학교 ERICA 수리데이터사이언스학과 이고은

statement: |-
  자취생이 박스·본가·세탁소로 옮긴 옷을 묶음으로 기록하고, 위치와 착용 가능 상태를 확인하는 서비스다.
  좁은 자취방 때문에 옷을 보관 박스·본가·세탁소에 나눠 두는 대학생·사회초년생이 외출 직전에 입으려던 옷이 어디 있는지, 세탁이 끝나 바로 입을 수 있는지 몰라 옷장을 뒤지거나 다른 옷으로 타협하는 문제를 다룬다.

canvas:
  context: |-
    1. 외출 직전(핵심): 입으려던 옷이 옷장에 없다. 보관 박스·세탁소·본가 중 어디에 두었는지 기억나지 않아 박스를 뒤지다 다른 옷으로 타협하거나 늦는다.
    2. 계절 교체(핵심): 박스·본가에 무엇을 넣어 뒀는지 몰라 박스를 전부 열거나, 필요한 옷을 본가에 두고 오거나, 있는 옷을 다시 산다.
    3. 세탁·수선 회수(보조): 맡긴 사실을 잊거나 영수증을 잃어 필요한 날 그 옷이 없다. 세탁물 분실 피해구제 231건 중 인수증을 받은 경우는 32.9%뿐이었다(SRC2).
  customer: |-
    좁은 방 때문에 옷을 옷장 밖(보관 박스·본가·세탁소)으로 나눠 두는 자취 대학생·사회초년생.
    우선 고객은 그중 보관 박스와 세탁소를 함께 쓰는 자취생이다. 본가가 멀어 옷을 두고 오면 오래 가져오지 못하는 자취생도 대상에 포함하되, 현재는 팀원 경험(E1·E2)에 기반한 설정이므로 대상 집단 전반의 공통 문제인지는 추가 인터뷰로 확인해야 한다.
    참고 자료로 2024년 1인가구는 전체 가구의 36.1%(804만 5천 가구)이고 29세 이하 17.8%, 30대 17.4%다(SRC1). 이 중 옷장 밖 보관 장소가 두 곳 이상인 비율은 확인된 바 없다.
  root_problem: |-
    옷을 박스·본가·세탁소로 옮기는 순간에는 손이 바쁘고 기록할 계기가 없어 위치가 남지 않고, 몇 주 뒤 옷을 찾는 순간에야 기록이 필요해진다는 것이 팀이 세운 검증 전 가설이다.
    큰 정리 때 메모를 남기더라도 한두 벌씩 넣고 꺼내는 일상 이동이 누락되면 기록이 실제 위치와 어긋나고, 결국 다시 박스를 뒤지게 된다고 본다. 다만 이 원인이 대상 집단의 공통 원인인지, 기록 후 조회가 어려운 것인지는 실제 인터뷰와 사용 결과에 따라 유지하거나 수정한다.
  impact:
    feeling: 외출 직전 옷을 못 찾는 조급함, 박스를 다 꺼냈다 다시 넣는 허탈함, 맡긴 옷의 회수를 놓쳤을 때의 당혹감.
    measurable: 관찰한 옷 찾기 시간과 빈도, 재구매 금액은 측정 결과가 없다. 팀원 2인의 박스 뒤지기·착용 포기·세탁 회수 지연 경험(E1·E2)만 확인된 상태다.
  alternatives:
    - how_used: 옷장과 박스를 직접 열어 확인한다.
      shortcoming: 박스는 전부 꺼내 봐야 알고, 본가·세탁소에 있는 옷은 눈으로 확인할 수 없다. 꺼낸 뒤 다시 정리해야 한다.
      why_ours: 박스를 열지 않아도 박스 안과 집 밖(본가·세탁소)에 둔 옷의 위치 경로와 상태를 화면에서 먼저 확인한다.
    - how_used: 본가 가족에게 연락해 옷이 있는지 묻고 택배를 부탁한다.
      shortcoming: 가족이 대신 찾아야 하고 부탁할 때마다 부담이 생긴다.
      why_ours: 본가로 보낼 때 묶음으로 기록해 두면 묻기 전에 본가 보관 목록을 스스로 확인할 수 있다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
      shortcoming: 한두 벌씩 옮기거나 꺼낼 때 갱신을 놓치면 실제 위치와 어긋날 수 있다(팀원 경험 기반, 타 사용자 직접 확인 전).
      why_ours: 박스 라벨 QR과 최근 입력값 자동 채움으로 묶음 기록 시간을 줄이려 한다. 다만 메모 대비 실제 기록 시간(3초 목표)과 갱신 유지 효과는 실측 전이다.
    - how_used: 종이 세탁소 영수증으로 맡긴 옷을 기억한다.
      shortcoming: 품목만 간략히 적히거나 영수증을 잃으면 어떤 옷을 언제 찾는지 확인하기 어렵다. 분실 피해구제 231건 중 44.2%는 인수증을 받지 못했다(SRC2).
      why_ours: 맡길 때 영수증 사진과 옷 여러 벌을 한 묶음으로 등록해 '세탁 중' 상태와 회수 예정일·기한 지남을 관리함에서 보여 준다.
    - how_used: 모바일 세탁 서비스(세탁특공대·런드리고)를 쓴다.
      shortcoming: 앱 설명 기준 검수 사진·진행 상태·세탁 이력·보관 기능을 제공하나(SRC5·SRC6, 실제 사용 미확인), 해당 서비스에 맡긴 세탁물만 다룬다.
      why_ours: 집 안 박스·본가·동네 세탁소로 흩어진 옷의 위치와 상태를 한곳에서 관리한다.
    - how_used: 디지털 옷장 앱(에이클로젯 등)에 옷을 등록한다.
      shortcoming: 앱 설명 기준 옷 등록·코디 추천·캘린더가 중심이며 박스·본가·세탁소 위치 관리 기능은 설명에 나오지 않는다(SRC4, 실제 앱 내 세부 기능은 미확인).
      why_ours: 개별 옷 목록 정리가 아니라 박스·세탁소·본가로 옮기는 묶음 단위 위치·상태 기록에 집중한다.

personas:
  - id: P1
    description: 23세 자취 대학생. 원룸 옷장 외에 침대 밑 박스와 본가에 계절 옷을 나누어 두고 동네 세탁소를 이용한다.
    source: 팀 문제정의 캔버스(2026-10-29)
  - id: P2
    description: 입사 1~2년 차 자취 사회초년생. 출근복 세탁소 이용이 잦고 계절 옷을 박스에 나누어 보관한다.
    source: 팀 문제정의 캔버스(2026-10-29)

experiences:
  - id: E1
    when: 2026년 10월, 외출 준비 중
    what_happened: 박스에 넣어 둔 옷이 무엇인지 파악하지 못해 입으려던 옷을 바로 찾지 못했고, 세탁소에 맡긴 옷의 회수 시점을 놓친 적이 있다.
    workaround: 보관 박스를 전부 꺼내 뒤진 뒤 다시 넣었다.
    feeling: null
    quote: null
    source: 팀 제안자 본인 경험. 팀장 이현준(조선대학교 AISW학부 정보보안전공)이 팀원 김근호(울산대학교 전기공학부)·김우성(선문대학교 컴퓨터공학부)·박규성(국립순천대학교 컴퓨터공학과)·이고은(한양대학교 ERICA 수리데이터사이언스학과) 전원과 문제 상황 공감 및 반영에 동의 확인(2026-10-29, 개별 발언 원문 미기록)
  - id: E2
    when: 2026년 10월, 외출 직전
    what_happened: 입으려던 옷을 어디에 뒀는지 기억하지 못해 찾지 못했고, 세탁 방법을 잘못 맞춰 세탁한 적도 있다.
    workaround: 옷 찾기를 포기하고 다른 옷을 입고 나갔다.
    feeling: null
    quote: null
    source: 국립순천대학교 컴퓨터공학과 박규성 본인 경험(2026-10-29 팀장 이현준 확인, 발언 원문 미기록)

