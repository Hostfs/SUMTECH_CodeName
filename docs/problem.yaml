# 옷결 문제정의와 기능 명세
# 출처: 팀 문제정의 캔버스 수정안(우성, 2026-10-29)과 서비스 구체화 문서(SUMTECH_옷결_서비스_구체화.md).
# 수정 원칙(우성 수정안):
#  - 범위 축소: '맡기거나 옮겨서 집에 없는 옷의 현재 위치·상태를 모름' 하나에 집중한다. 코디 확인·중복 구매는 별도 문제로 분리한다.
#  - 솔루션 단어 금지: 원인은 '기록이 연결되지 않는다'(솔루션을 뒤집은 말) 대신 사람이 실제로 하는/안 하는 행동으로 쓴다.
#  - 근거 칸 고정: 인터뷰 전이라도 수치·발언 자리를 [ ]로 남겨 둔다. 조사 후 실제 값으로 채우고, 채우지 못하면 제출 전에 그 문장을 지운다.
#  - 경쟁 앱 포함: 기존 디지털 옷장 앱을 대안에 넣어 '왜 이미 있는 걸 안 쓰나'에 답한다.
#  - 3D 코디 제외: 정의한 문제와 연결이 약해 캔버스와 기능에서 뺐다.

statement: |-
  자취하며 계절 옷을 박스·본가·세탁소에 나눠 두는 대학생·사회초년생은, 입으려는 옷이 지금 어디 있고 바로 입을 수 있는지 몰라 외출 직전에 옷장을 뒤지거나 계획한 옷을 포기한다.
  이들은 사진첩·메모·세탁소 영수증으로 버티지만, 옷이 옮겨지거나 맡겨지는 순간 기록을 고치지 않기 때문에 기록은 며칠 안에 실제와 어긋난다.

canvas:
  context: |-
    문제가 터지는 순간은 세 장면이다.
    1. 외출 직전: 입으려던 옷이 옷장에 없다. 박스에 넣었는지, 세탁소에 있는지, 본가에 두고 왔는지 기억나지 않는다.
    2. 계절 교체: 박스를 열기 전엔 안에 뭐가 있는지 모른다. 결국 박스를 전부 열어 꺼낸다.
    3. 세탁·수선 회수: 맡긴 옷을 잊어 회수가 늦어지거나, 영수증을 잃어 무엇을 맡겼는지 모른다.
    발생 빈도(미수집): [인터뷰 n명 중 최근 한 달 내 1회 이상 겪은 사람 _명]
    가장 자주 꼽힌 장면(미수집): [1~3 중 _]
  customer: |-
    핵심 고객은 '옷이 한 곳에 다 들어가지 않는 자취생'이다. 옷이 적어 옷장 하나에 다 들어가는 사람은 이 문제가 없으므로 제외한다.
    처음부터 모든 옷을 등록하진 않는다. 박스에 넣는 옷, 세탁소에 맡기는 옷처럼 '집 밖이나 안 보이는 곳으로 가는 옷'부터 기록하게 한다.
  root_problem: |-
    사람들은 옷을 '옮기는 순간'에는 기록할 이유를 느끼지 못하고, '찾는 순간'에야 기록이 필요해진다.
    박스에 넣을 때, 세탁소에 맡길 때는 손이 바쁘고 "기억나겠지"라고 생각한다.
    기록이 필요해지는 건 몇 주~몇 달 뒤 찾을 때인데, 그때는 이미 기억이 흐려졌다.
    그래서 사진·메모를 시도해도 첫 등록 이후 갱신이 끊기고, 기록을 믿지 못해 결국 다시 뒤진다.
    즉 문제는 '정보가 흩어져 있음'이 아니라, 옮기는 순간의 기록 비용이 그 순간의 이득보다 크다는 것이다.
    이 가설은 인터뷰의 "마지막으로 옷 목록을 갱신한 게 언제인가" 질문으로 검증한다.
  impact:
    feeling: |-
      외출 직전의 조급함, 박스를 다 뒤집은 뒤 다시 넣는 허탈함.
      실제 발언(미수집): [인터뷰 원문 2~3개, 예: "○○" — 24세 자취생]
    measurable: |-
      고객 조건(아래를 모두 만족하는 사람을 대상으로 본다):
      - 거주: 자취·기숙사 1인 가구 — 수납이 좁아 박스·본가로 분산됨
      - 보관 장소: 3곳 이상(옷장·박스·본가·세탁소 등) — 장소가 2곳 이하면 기억으로 충분
      - 관리 방식: 세탁소·수선을 직접 맡김 — 회수 누락이 생기는 조건
      - 기존 시도: 옷 사진·메모를 남겨본 적 있음 — 문제를 인식하고 이미 비용을 쓰는 사람
      측정 지표(값은 조사 후 채우고, 못 채우면 제출 전에 지운다):
      - 옷 찾기에 쓰는 시간: 최근 경험 회상 + 1주 기록 → [평균 _분/회]
      - 찾다가 계획한 옷을 포기한 경험: 인터뷰 질문 → [n명 중 _명]
      - 세탁·수선 회수 지연·분실 경험: 인터뷰 질문 → [n명 중 _명]
      - 있는 줄 모르고 비슷한 옷을 다시 산 경험: 인터뷰 질문 → [n명 중 _명]
  alternatives:
    - how_used: 옷장·박스를 열어 확인한다.
      shortcoming: 박스·본가·세탁소에 있는 옷은 확인할 수 없다. 찾을 때마다 꺼내고 다시 정리해야 한다.
      why_ours: 집 밖·박스 속 옷이 지금 어디 있고 바로 입을 수 있는지 한눈에 보여 준다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 보관 위치를 적는다.
      shortcoming: 옷을 옮겨도 메모를 고치지 않아 금방 틀어진다.
      why_ours: 옮기는 순간의 기록을 짧게 끝내 첫 등록 이후에도 갱신이 끊기지 않게 한다.
    - how_used: 세탁소 영수증과 회수일 알림으로 맡긴 옷을 관리한다.
      shortcoming: 어떤 옷을 맡겼는지는 기록되지 않는다. 영수증을 잃으면 끝이다.
      why_ours: 세탁·수선 상태와 회수 예정일을 그 옷의 기록에 남긴다.
    - how_used: 기존 디지털 옷장 앱에 옷 사진을 등록하고 분류·코디한다.
      shortcoming: "등록·코디 중심이라 위치·세탁 상태는 관리하지 않는다. [사용 경험자 n명 중 _명이 한 달 안에 중단, 이유: _] (미수집 — 제출 전 실제 앱 2~3개를 직접 써 보고 리뷰 속 이탈 이유로 채운다)"
      why_ours: 코디가 아니라 '집 밖·박스 속 옷의 위치·상태'를 중심에 둔다.
  must_beat: 기존 대안은 모두 '첫 기록'은 돕지만 '옮길 때의 갱신'은 사용자 의지에 맡긴다. 우리 해법은 옮기는 순간의 기록을 3초 안에 끝낼 수 있어야 이긴다.

personas:
  - id: P1
    description: 23세, 자취 2년 차 대학생. 원룸 옷장 하나에 다 안 들어가 겨울옷은 침대 밑 박스, 일부는 본가에 둔다. 코트·정장은 세탁소에 맡긴다. 우선 검증 대상.
    source: 팀 문제정의 캔버스 수정안(가설, 인터뷰로 검증 예정)
  - id: P2
    description: 입사 1~2년 차 사회초년생. 출근복이 늘어 세탁소 이용이 잦다. P1과의 차이(세탁소 비중)는 인터뷰로 확인한다. 추가 후보.
    source: 팀 문제정의 캔버스 수정안(가설, 인터뷰로 검증 예정)

experiences:
  - id: E1
    when: null
    what_happened: 팀 제안자 본인 경험. 박스 속 옷을 파악하지 못하고, 세탁소 회수를 놓친 적이 있다. (1인)
    workaround: null
    feeling: null
    quote: null
