# 옷결 — 문제정의와 기능 명세
# 팀 구성: 조선대학교 AISW학부(정보보안전공) 이현준(팀장), 울산대학교 전기공학부 김근호, 선문대학교 컴퓨터공학부 김우성, 국립순천대학교 컴퓨터공학과 박규성, 한양대학교 ERICA 수리데이터사이언스학과 이고은

document_context: 가상환경 문제 정의 모범예시 답안. 주석의 팀원 이름을 예시 인물에 적용했으며, 아래 경험·발언·수치는 실제 인물에 관해 검증된 인터뷰나 관찰 결과가 아니다.

statement: |-
  계절 옷을 박스·본가에 나눠 보관하는 자취 대학생은 계절이 바뀐 뒤 외출을 준비할 때, 입으려던 옷의 보관 장소를 기억하지 못해 오래 찾거나 다른 옷을 입고 나간다.
  일부는 이미 가진 옷이 본가에 있다는 사실을 잊어 비슷한 옷을 다시 구매한다. 핵심 문제는 눈에 보이지 않는 곳으로 옮겨 둔 옷의 존재와 위치를 필요할 때 떠올리거나 확인하기 어렵다는 것이다.

canvas:
  context: |-
    핵심 장면은 '계절이 바뀐 뒤 외출 준비 중, 박스·본가에 둔 옷의 위치를 몰라 찾지 못하는 순간' 하나다. 계절 교체는 배경이고 외출 준비는 문제가 드러나는 시점이다.
    조원 이현준·김근호·김우성·박규성·이고은 5명은 모두 자취하며 옷장 외에 박스 또는 본가에 옷을 보관한다. 이현준·김근호·김우성·박규성 4명에게 이 장면을 배정했다(E3). 이현준은 침대 밑 박스의 셔츠를 20분 찾았고(E1), 김근호는 본가의 니트를 찾지 못해 다른 옷을 입었으며(E2), 김우성은 본가의 카디건을 자취방에서 30분 찾았고(E6), 박규성은 친구 결혼식용 슬랙스가 본가에 있는 것을 잊어 9만 원에 다시 샀다(E7).
    E1·E2·E6·E7은 서로 다른 네 사람의 개별 사건이고 E3·E4는 이 사람들의 집계다. 별도 응답자나 추가 사건으로 합산하지 않는다. 4/5는 설정 내 경험자 비율이며 발생 빈도가 아니다. 월간·계절별 반복 횟수는 정하지 않았다.
    세탁소 회수 누락(E5)은 보조 장면이며 핵심 문제의 경험자 집계에 넣지 않는다. SRC1~SRC8은 인구·일반 의류 관리·기존 서비스에 관한 참고 자료로, 박스·본가 장면을 직접 검증한 자료가 아니다.
  customer: |-
    우선 고객은 좁은 자취방 때문에 계절 옷을 박스 또는 본가에 나눠 보관하고, 계절이 바뀐 뒤 외출 준비 중 필요한 옷의 위치를 몰라 찾지 못하는 자취 대학생이다.
    이들이 놓치는 것은 눈에 보이지 않는 박스·본가로 옮겨 둔 옷의 존재와 위치다. 세탁소 이용 여부나 옷장 외 보관 장소 두 곳 이상을 필수 조건으로 삼지 않는다.
    설정 내 조원 이현준·김근호·김우성·박규성·이고은 5명 중 이현준·김근호·김우성·박규성 4명이 핵심 장면을 경험한다. 사회초년생은 확장 고객 후보이며 이번 문제 정의의 근거 집단에는 포함하지 않는다. SRC1의 1인가구 통계를 이 고객군의 규모로 환산하지 않는다.
  root_problem: |-
    설정 내 이현준·김근호·김우성·박규성은 계절 옷을 옮길 때 사진·목록을 남기지 않고 기억에 의존했다. 이현준은 어느 박스인지 기억할 것으로 생각했고, 김근호는 본가에 두는 옷이라 따로 목록을 남길 필요를 느끼지 못했으며, 김우성은 정리를 끝내는 데 집중했고, 박규성은 여러 벌을 한꺼번에 옮기면서 한 벌씩 기록하는 일이 번거롭다고 생각했다.
    네 사건의 공통점은 옷을 옮긴 시점과 다시 필요한 시점 사이에 간격이 있고, 찾을 때 보관 장소를 확인할 단서가 없다는 것이다. 옷장부터 뒤지는 행동만으로는 본가나 닫힌 박스 안의 옷을 확인하기 어렵다.
    근본 원인 가설은 보관 이동 정보가 기억에만 남아 시간이 지난 뒤 필요한 옷과 장소를 연결하지 못한다는 것이다. 기록 생략의 이유를 모두 동일하다고 단정하지 않으며, 기록 부담과 필요성 인식의 영향은 별도 검증 대상으로 둔다.
  impact:
    feeling: 이현준은 박스를 뒤지고 다시 정리하는 일이 번거로웠고(E1), 김근호는 원하는 옷을 포기하는 데 답답함을 느꼈다(E2). 김우성은 본가에 있는 옷을 자취방에서 계속 찾은 시간이 아까웠고(E6), 박규성은 가진 옷을 다시 사서 9만 원을 쓴 것이 아까웠다(E7).
    measurable: '설정 내 핵심 문제 경험자 4/5명(이현준·김근호·김우성·박규성). 사건별 손실은 이현준의 탐색 20분(E1), 김근호의 예정 의상 포기 1회(E2), 김우성의 탐색 30분(E6), 박규성의 슬랙스 중복 구매 9만 원(E7)이다. E3·E4를 추가 인원으로 합산하지 않는다. 시간·금액은 시나리오 값이며 실측값이나 평균 손실이 아니다. 반복 빈도와 같은 옷을 입는 횟수는 정하지 않았다.'
  alternatives:
    - how_used: 옷장과 박스를 직접 열어 확인한다.
      shortcoming: 이현준은 여러 박스를 열어야 했고(E1), 김우성은 옷이 없는 자취방을 30분 동안 찾았다(E6). 집에서 직접 뒤지는 방법으로는 본가의 옷을 확인할 수 없다.
      why_ours: 보관 위치를 기록해 박스를 열거나 자취방을 뒤지기 전에 위치를 확인하도록 하려 한다. 직접 탐색 대비 탐색 시간 단축 효과는 검증 전이다.
    - how_used: 본가 가족에게 연락해 옷이 있는지 묻고 택배를 부탁한다.
      shortcoming: 김근호·김우성은 가족에게 물은 뒤에야 위치를 알았다(E2·E6). 위치를 확인해도 외출 전까지 가져올 수 없는 경우가 있다. 부탁의 심리적 부담은 이번 사례에서 확인하지 않았다.
      why_ours: 본가 보관 목록으로 가족에게 묻기 전에 위치를 확인하고 필요한 옷을 미리 가져오도록 하려 한다. 가족에게 확인하는 횟수의 감소 효과는 검증 전이며 운송 시간은 별도로 필요하다.
    - how_used: 휴대폰 앨범·메모 앱에 옷 목록과 위치를 적는다.
      shortcoming: 이현준·김근호·김우성·박규성은 이 방법을 사용하지 않았으므로 실제 단점이나 중단 이유를 사례에서 확인할 수 없다. 위치 갱신 누락 가능성은 비교 실험으로 확인할 가설이다.
      why_ours: 박스 라벨 QR·다중 선택으로 이동 기록과 재조회를 쉽게 하려 한다. 메모 대비 초기 등록·갱신 부담과 위치 확인 효과는 검증 전이다.
    - how_used: 종이 세탁소 영수증으로 맡긴 옷을 기억한다. (보조)
      shortcoming: 품목만 간략히 적히거나 영수증을 잃으면 어떤 옷을 언제 찾는지 확인하기 어렵다. 분실 피해구제 231건 중 44.2%는 인수증을 받지 못했다(SRC2).
      why_ours: 영수증 사진과 여러 벌의 옷을 묶어 등록하고 회수 예정일을 보여 줘 회수를 잊지 않도록 하려 한다. 종이 영수증 대비 회수 누락 감소 효과는 검증 전이다.
    - how_used: 모바일 세탁 서비스(세탁특공대·런드리고)를 쓴다. (보조)
      shortcoming: 앱 설명 기준 검수 사진·진행 상태·세탁 이력·보관 기능을 제공하나(SRC5·SRC6, 실제 사용 미확인), 해당 서비스에 맡긴 세탁물만 다룬다.
      why_ours: 박스·본가·동네 세탁소에 둔 옷을 한곳에서 확인하도록 하려 한다. 개별 세탁 서비스 앱과 비교한 통합 관리의 편의성은 검증 전이다.
    - how_used: 디지털 옷장 앱(에이클로젯 등)에 옷을 등록한다.
      shortcoming: 앱 설명 기준 옷 등록·코디 추천·캘린더가 중심이며 박스·본가·세탁소 위치 관리 기능은 설명에 나오지 않는다(SRC4, 실제 앱 내 세부 기능은 미확인).
      why_ours: 박스·본가로 옮기는 묶음 단위의 위치 기록과 조회에 집중하려 한다. 기존 디지털 옷장 앱 대비 기록 부담과 위치 확인 효과는 검증 전이다.

personas:
  - id: P1
    description: 우선 고객. 원룸 옷장과 침대 밑 박스에 계절 옷을 나눠 두는 자취 대학생. 가을 외출 준비 중 오랜만에 입을 긴팔 셔츠가 어느 박스에 있는지 기억하지 못한다.
    source: 조원 이현준(E1)
  - id: P2
    description: 우선 고객의 본가 보관 유형. 자취방과 본가 박스에 옷을 나눠 둔 대학생. 가을에 친구 결혼식에 입을 슬랙스를 찾다가 본가에 둔 사실을 잊고 새로 구매한다.
    source: 조원 박규성(E7)

experiences:
  - id: E1
    participant_id: 이현준
    when: 2026년 10월 초, 날씨가 쌀쌀해진 날 등교 준비 중
    what_happened: 봄에 긴팔 셔츠를 침대 밑 보관 박스에 넣었다. 가을에 다시 입으려 했으나 어느 박스인지 기억하지 못해 옷장과 박스 세 개를 약 20분 동안 찾은 끝에 마지막 박스에서 발견했다. 넣을 때 사진이나 메모는 남기지 않았다.
    workaround: 박스를 하나씩 열어 셔츠를 찾고 꺼낸 옷을 다시 정리했다.
    feeling: 외출 준비보다 옷을 찾고 다시 정리하는 데 시간이 들어 번거로웠다.
    quote: 넣을 때는 어느 박스인지 기억할 줄 알았어요. 막상 입으려니까 다 열어 봐야 하더라고요.
    source: 조원 이현준의 경험·발언. E3 집계의 이현준과 같은 사람이다.
  - id: E2
    participant_id: 김근호
    recording_omission_reason: 본가에 두는 옷은 필요할 때 다시 가져오면 된다고 생각해 따로 목록을 남길 필요를 느끼지 못했다.
    when: 2026년 10월 초, 가을 저녁 약속에 나가기 전
    what_happened: 봄에 본가에 가져다 둔 니트를 자취방에 가져온 것으로 기억해 옷장과 자취방 박스를 찾았다. 외출 시간이 되어 다른 옷을 입었다. 그날 저녁 가족에게 물어 니트가 본가 계절 옷 박스에 있다는 것을 알았다. 옮길 때 기록하지 않았다.
    workaround: 니트 대신 평소 입던 맨투맨을 입고 나갔다.
    feeling: 갖고 있는 옷을 입지 못하고 익숙한 옷으로 바꿔 입어 답답했다.
    quote: 본가에 두는 옷이라 나중에 가져오면 된다고 생각해서 따로 적지는 않았어요. 그런데 가져온 줄 알고 찾다가 약속 시간이 돼서 그냥 늘 입던 옷을 입었어요.
    source: 조원 김근호의 경험·발언. E3·E4 집계의 김근호와 같은 사람이다.
  - id: E3
    participant_ids: [이현준, 김근호, 김우성, 박규성]
    when: 2026년 9~10월, 가을 옷을 다시 입기 시작한 시기
    what_happened: 조원 이현준·김근호·김우성·박규성·이고은 5명 중 이현준·김근호·김우성·박규성 4명에게 박스·본가의 옷 위치를 바로 떠올리지 못해 탐색·착용 포기·중복 구매를 겪는 사건을 설정했다. 네 명 모두 옮길 때 기록하지 않았다. 이현준은 결국 찾았으므로 네 명 모두 못 입었다고 집계하지 않는다.
    workaround: 이현준은 박스를 열어 찾고, 김근호·김우성은 다른 옷을 입고, 박규성은 새로 구매했다.
    feeling: 개별 사건 E1·E2·E6·E7에 기재한다.
    quote: null
    source: 조원 5명의 집계. E1(이현준)·E2(김근호)·E6(김우성)·E7(박규성)의 요약이며 추가 인터뷰가 아니다.
  - id: E4
    participant_ids: [김근호, 김우성, 박규성]
    when: 2026년 9~10월, E2·E6·E7의 사건 시점
    what_happened: 조원 5명 중 김근호·김우성·박규성 3명은 본가에 둔 옷을 자취방에서 찾았다. 이 중 박규성 1명은 이미 가진 슬랙스를 다시 구매했다. 세 명 모두 재구매했다고 해석하지 않는다.
    workaround: 김근호·김우성은 다른 옷으로 대체했고 박규성은 슬랙스를 다시 샀다.
    feeling: 개별 사건 E2·E6·E7에 기재한다.
    quote: null
    source: 조원 김근호·김우성·박규성의 집계. E3의 부분집합이다.
  - id: E5
    participant_id: 이고은
    scope: 보조 장면. 핵심 문제 집계에서 제외한다.
    when: 2026년 10월 중순, 셔츠를 입으려고 준비하던 날
    what_happened: 동네 세탁소에 맡긴 셔츠의 예정 회수일이 지났지만 찾지 않았다. 외출 준비 중 셔츠가 없어서 영수증을 확인한 뒤 세탁소에 있다는 것을 떠올렸다. 박스·본가의 계절 옷 탐색 문제와는 별도 사건이다.
    workaround: 다른 셔츠를 입고 나간 뒤 다음 날 세탁소에서 회수했다.
    feeling: 맡겨 둔 사실을 잊어 필요한 날 입지 못한 것이 불편했다.
    quote: 세탁은 끝났을 텐데 제가 찾으러 가는 걸 잊었어요. 입으려던 날에야 생각났어요.
    source: 조원 이고은의 경험·발언. 세탁소 방문 빈도와 회수 누락 빈도는 정하지 않았다.
  - id: E6
    participant_id: 김우성
    when: 2026년 10월, 가을 주말 외출 준비 중
    what_happened: 봄에 본가에 두고 온 카디건을 자취방으로 가져왔다고 생각해 옷장·빨래 바구니·보관 박스를 약 30분 동안 찾았다. 가족에게 연락한 뒤 본가 박스에 남아 있다는 것을 알았다. 봄 정리 때는 짐을 넣는 데 집중해 보관 목록을 남기지 않았다.
    workaround: 가족에게 위치를 확인하고 그날은 다른 겉옷을 입었다.
    feeling: 자취방에 없는 옷을 계속 찾느라 쓴 시간이 아까웠다.
    quote: 본가에 두고 온 걸 까먹고 자취방에서 30분이나 찾았어요. 처음부터 거기 있는 줄 알았으면 안 뒤졌을 텐데요.
    source: 조원 김우성의 경험·발언. E3·E4의 김우성과 같은 사람이며 30분은 설정값이다.
  - id: E7
    participant_id: 박규성
    recording_omission_reason: 계절 옷 여러 벌을 한꺼번에 옮기면서 한 벌씩 사진을 찍거나 목록을 적는 일이 번거롭다고 생각해 생략했다.
    when: 2026년 9월 말, 가을에 열린 친구 결혼식 전날
    what_happened: 봄에 계절 옷과 함께 검정 슬랙스를 본가 박스에 넣어 두었다. 가을 친구 결혼식에 입으려고 자취방 옷장과 박스를 찾았지만 발견하지 못했다. 본가에 둔 사실을 떠올리지 못한 채 현재 가진 옷에 없다고 판단해 새로 구매했다. 결혼식이 끝난 뒤 본가를 방문했을 때 계절 옷 박스에서 원래 슬랙스를 발견했다.
    workaround: 급히 9만 원짜리 새 슬랙스를 샀다.
    feeling: 이미 가진 옷의 위치를 잊어서 9만 원을 추가로 쓴 것이 아까웠다.
    quote: 옷을 한꺼번에 옮기는데 한 벌씩 찍고 적기는 번거로워서 그냥 넣었어요. 친구 결혼식에 입을 검정 슬랙스를 못 찾아서 급하게 9만 원 주고 샀는데, 나중에 본가에 가니까 박스 안에 있더라고요. 제가 넣어 놓고 까먹었던 거예요.
    source: 조원 박규성의 경험·발언. 결혼식 당사자는 박규성의 친구이며 경험자는 팀 밖 사람이 아니다. E3·E4의 박규성과 같은 사람이다.

