name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/db/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/db/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: otgyeol_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: schema.sql과 Flyway 마이그레이션(V1, V2 …를 차례로 이은 것)이 같은지 확인
        run: diff docs/db/schema.sql <(cat $(ls backend/src/main/resources/db/migration/V*__*.sql | sort -V))
      - name: 통합 테스트(실제 MariaDB)
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:mariadb://127.0.0.1:3306/otgyeol_test
          TEST_DATABASE_USERNAME: root
          TEST_DATABASE_PASSWORD: root
        run: ./mvnw -B test
