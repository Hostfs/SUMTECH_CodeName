name: backend

on:
  push:
    branches: [main]
    paths: ["server/**", "docs/db/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["server/**", "docs/db/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: otgyeol_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: schema.sql과 마이그레이션(V1, V2 …를 차례로 이은 것)이 같은지 확인
        run: diff docs/db/schema.sql <(cat $(ls server/db/migration/V*__*.sql | sort -V))
      - working-directory: server
        run: npm ci --no-audit --no-fund
      - name: 타입 검사와 빌드
        working-directory: server
        run: npm run build
      - name: 통합 테스트(실제 MariaDB)
        working-directory: server
        env:
          TEST_DATABASE_URL: jdbc:mariadb://127.0.0.1:3306/otgyeol_test
          TEST_DATABASE_USERNAME: root
          TEST_DATABASE_PASSWORD: root
          TZ: UTC
        run: npm test
