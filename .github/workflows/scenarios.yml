name: scenarios

# 빈 DB에서 docker compose로 앱을 띄우고 docs/scenarios.yaml의 흐름(e2e/scenarios/S*.spec.ts)을 PC·휴대폰 화면으로 실행한다.
# S2(택 AI 분석)는 실제 AI 응답이 필요해서 저장소 Secrets의 AI_GATEWAY_API_KEY를 쓴다. 키 값은 로그에 남지 않는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_ID: ${{ github.sha }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # 키 값은 출력하지 않고 있는지만 알린다. 없으면 S2(택 AI 분석)는 실패한다.
      - name: AI 키 설정 여부
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then echo "AI_GATEWAY_API_KEY: 설정됨"
          else echo "::warning::저장소 Secrets에 AI_GATEWAY_API_KEY가 없어 S2(택 AI 분석)가 실패합니다"; fi

      - name: 빈 DB에서 앱 띄우기
        run: |
          docker compose down -v
          start=$(date +%s)
          docker compose up -d --build
          until curl -sf http://localhost:3000/__health; do
            if [ $(( $(date +%s) - start )) -gt 600 ]; then docker compose logs app; exit 1; fi
            sleep 3
          done
          echo
          echo "앱 준비까지 $(( $(date +%s) - start ))초(이미지 빌드 포함)"

      - name: 배포 commit 확인
        run: curl -sf http://localhost:3000/__health | grep -q "${RELEASE_ID}"

      # 화면 주소를 직접 열거나 새로고침해도 200이어야 한다. App.tsx의 Route(상대 경로 path="closet" 포함)와 SpaController 목록이 어긋나면 실패.
      - name: 화면 주소 직접 열기
        run: |
          fail=0
          for p in / $(grep -oE 'path="[^"*]+"' frontend/src/App.tsx | sed -E 's/path="\/?([^"]*)"/\/\1/; s/:[a-zA-Z]+/1/g'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p")
            echo "$p $code"
            [ "$code" = 200 ] || fail=1
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/no-such-page)" = 404 ] || { echo "없는 주소가 404가 아님"; fail=1; }
          exit $fail

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright 설치
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 흐름 E2E
        working-directory: e2e
        run: npx playwright test

      - name: 실패 시 앱 로그
        if: failure()
        run: |
          echo "--- AI 관련 로그 ---"
          docker compose logs app | grep -E "AI Gateway|AI 키|AI 응답|AiGateway" || echo "(AI 관련 로그 없음)"
          echo "--- 마지막 200줄 ---"
          docker compose logs app | tail -200

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
