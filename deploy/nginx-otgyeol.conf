# install.sh가 /etc/nginx/sites-available/otgyeol 로 복사하며 server_name·포트를 채운다.
# HTTPS 인증서는 install.sh가 certbot --nginx 로 붙인다(certbot이 443 블록을 추가한다).
server {
    listen 80;
    server_name example.com;

    # 택 사진은 한 장 10MB, 한 번에 4장까지
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 빌드 산출물(파일 이름에 해시)은 오래 캐시한다. Node도 같은 헤더를 주지만 nginx에서 한 번 더 붙인다.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 택 분석·제품 검색은 수십 초 걸릴 수 있다
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
